<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synder UX prototypes</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5c5c5c;
      --border: #e5e5e2;
      --accent: #2563eb;
      --folder-bg: #f0f4ff;
      --folder-border: #c7d2fe;
      --folder-label: #4338ca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      font-size: 14px; /* min font size */
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 {
      font-size: 22px;
      font-weight: 650;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .intro {
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 14px;
      max-width: 52ch;
    }
    h2 {
      font-size: 14px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .section { margin-bottom: 28px; }
    .list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    /* Shared card base — keep small for many items */
    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      text-decoration: none;
      color: inherit;
      min-height: 72px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      border-color: #c8c8c4;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }
    .card-title {
      font-weight: 600;
      font-size: 14px;
      margin: 0 0 4px;
      color: var(--accent);
    }
    .card:hover .card-title { text-decoration: underline; }
    .card-meta {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
    .card-desc {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Folder cards — distinct from prototype cards */
    .card-folder {
      background: var(--folder-bg);
      border-color: var(--folder-border);
    }
    .card-folder:hover {
      border-color: #a5b4fc;
      box-shadow: 0 1px 4px rgba(67, 56, 202, 0.08);
    }
    .folder-badge {
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
      color: var(--folder-label);
      margin: 0 0 4px;
    }
    .card-folder .card-title {
      color: var(--text);
    }
    .card-folder:hover .card-title { text-decoration: none; }

    .note {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
    }
    .empty {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Synder UX prototypes</h1>
    <p class="intro">Browse by folder or open a standalone prototype. Folders stay in this tab; each prototype opens in a new tab.</p>

    <!-- ========== FOLDERS ==========
         To add a folder card: copy a <li>…</li> block below.
         href → folders/<slug>/  (same tab — no target="_blank")
         Update the count in card-meta to match prototypes in that folder.
    -->
    <section class="section" aria-labelledby="folders-heading">
      <h2 id="folders-heading">Folders</h2>
      <ul class="list">
        <li>
          <a class="card card-folder" href="folders/payment-application/">
            <span class="folder-badge">Folder</span>
            <div class="card-title">Payment application</div>
            <p class="card-meta">1 prototype</p>
          </a>
        </li>
        <!--
        <li>
          <a class="card card-folder" href="folders/your-folder/">
            <span class="folder-badge">Folder</span>
            <div class="card-title">Your folder name</div>
            <p class="card-meta">N prototypes</p>
          </a>
        </li>
        -->
      </ul>
    </section>

    <!-- ========== SINGLES (standalone prototypes, not in a folder) ==========
         Omit this whole <section> when there are none.
         To add a single: copy a <li>…</li> with target="_blank" rel="noopener noreferrer".
         href → prototypes/<slug>/
    -->
    <!-- Singles section omitted — no standalone prototypes yet.
    <section class="section" aria-labelledby="singles-heading">
      <h2 id="singles-heading">Singles</h2>
      <ul class="list">
        <li>
          <a class="card" href="prototypes/example/" target="_blank" rel="noopener noreferrer">
            <div class="card-title">Example prototype</div>
            <p class="card-meta">v1.0</p>
            <p class="card-desc">Short description.</p>
          </a>
        </li>
      </ul>
    </section>
    -->

    <p class="note">Add a folder under <code>folders/</code> or a single under <code>prototypes/</code>, then drop a card into the lists above.</p>
  </div>
</body>
</html>
