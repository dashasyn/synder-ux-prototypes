<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synder UX prototypes</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5c5c5c;
      --border: #e5e5e2;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 650;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .intro {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 0.875rem;
    }
    .list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      text-decoration: none;
      color: inherit;
      min-height: 88px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      border-color: #c8c8c4;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }
    .card-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin: 0 0 2px;
      color: var(--accent);
    }
    .card:hover .card-title { text-decoration: underline; }
    .card-meta {
      font-size: 0.7rem;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .card-desc {
      margin: 0;
      font-size: 0.75rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .note {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Synder UX prototypes</h1>
    <p class="intro">Interactive UX prototypes. Each opens in a new tab.</p>
    <ul class="list">
      <li>
        <a class="card" href="prototypes/payment-matching-rules/" target="_blank" rel="noopener noreferrer">
          <div class="card-title">Payment matching rules</div>
          <p class="card-meta">v3.2</p>
          <p class="card-desc">Match payments to invoices — FDD sign-off (v3.2).</p>
        </a>
      </li>
    </ul>
    <p class="note">New prototypes appear here as they are added.</p>
  </div>
</body>
</html>
