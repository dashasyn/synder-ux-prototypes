<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firm context switcher — Synder</title>
  <!--
    v4: restructured firm-side Client details (Work/Profile/Billing/Firm colleagues), dev state toggle, pending client page. Deep link: #firm/c3
    Firm context switcher v2 (Ignat, Nov 4 2026): live top bar (Balance, How it works?, bell, help, user menu with My firm on top)
    - One context switcher top-left of the sidebar (replaces firm section + "CLIENT WORKSPACE" org dropdown).
    - One sidebar; contents swap fully per context (Firm nav vs Org nav). No top tabs.
    - v9: one white centered onboarding shell, firm name step, pinned review action, empty directory.
    - v8: explicit role choice, neutral Create/Join, full client switcher, left-aligned directory welcome.
    - v7: portrait role and firm cards, client-directory welcome, then a simulated QuickBooks / Xero / CSV import. Firm user only.
    - v6: firm onboarding (#onboarding), client list import, firm Dashboard + setup progress. Firm user only.
    - Ctrl/Cmd+K opens the switcher; arrows + Enter + Esc work inside.
    - Last context remembered per scenario in localStorage.
  -->
  <link rel="stylesheet" href="https://dashasyn.github.io/synder-prototypes/ui-kit/synder-ui-kit.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    :root { --proto-bar-h: 48px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; line-height: 20px; color: var(--text-primary, #1A1B24); background: #fff;
    }

    /* ── Dark prototype bar (name + variant switcher only) ── */
    .proto-bar {
      position: sticky; top: 0; z-index: 300;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      min-height: var(--proto-bar-h); padding: 8px 16px;
      background: #111827; color: #F9FAFB;
    }
    .proto-bar .brand { font-size: 14px; font-weight: 500; letter-spacing: .02em; opacity: .92; white-space: nowrap; }
    .proto-bar .spacer { flex: 1; }
    .seg { display: inline-flex; background: rgba(255,255,255,.06); border-radius: 6px; padding: 2px; gap: 2px; }
    .seg button {
      appearance: none; border: none; background: transparent; color: #9CA3AF;
      font: inherit; font-size: 14px; font-weight: 500; height: 30px; padding: 0 10px;
      border-radius: 4px; cursor: pointer; white-space: nowrap;
    }
    .seg button:hover { color: #fff; background: rgba(255,255,255,.08); }
    .seg button.active { background: #0053CC; color: #fff; }

    /* ── Product shell ── */
    .p-top {
      height: 56px; background: #fff; border-bottom: 1px solid #C8C7CC;
      display: flex; align-items: center; justify-content: flex-end;
      gap: 16px; padding: 0 20px 0 10px;
      position: sticky; top: var(--proto-bar-h); z-index: 30;
    }
    .t-balance { font-size: 14px; line-height: 20px; color: #1A1B24; padding: 2px 0; box-shadow: inset 0 -2px 0 #0053CC; cursor: default; }
    .t-balance b { color: #0053CC; font-weight: 600; }
    .t-how { font-size: 14px; color: #0053CC; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
    .t-how:hover { text-decoration: underline; }
    .t-wrap { position: relative; }
    .t-ico {
      position: relative; height: 32px; min-width: 32px; border-radius: 6px; padding: 0 4px;
      display: inline-flex; align-items: center; justify-content: center; gap: 0;
      color: #0053CC; background: transparent; border: none; cursor: pointer; font-family: inherit;
    }
    .t-ico:hover, .t-ico[aria-expanded="true"] { background: #F2F6FC; }
    .t-ico .material-icons { font-size: 22px; }
    .t-ico .chev { font-size: 18px; opacity: .7; }
    .t-badge {
      position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 8px; background: #CC2929; color: #fff; font-size: 11px; line-height: 16px; font-weight: 500;
    }
    .menu {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 220px;
      background: #fff; border: 1px solid #DFE4EC; border-radius: 8px; padding: 6px 0;
      box-shadow: 0 8px 24px rgba(26,27,36,.14); display: none;
    }
    .menu.open { display: block; }
    .menu button {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 16px;
      background: none; border: none; cursor: pointer; font: inherit; font-size: 14px; color: #1A1B24; text-align: left;
    }
    .menu button:hover { background: #F2F6FC; }
    .menu .material-icons { font-size: 20px; color: #6B778C; }
    .menu .div { height: 1px; background: #EFF1F5; margin: 6px 0; }
    .menu .who { padding: 8px 16px 10px; border-bottom: 1px solid #EFF1F5; margin-bottom: 6px; }
    .menu .who b { display: block; font-weight: 500; }
    .menu .who span { color: #6B778C; }
    .p-body { display: flex; min-height: calc(100vh - var(--proto-bar-h) - 56px); }
    .p-side {
      width: 248px; min-width: 248px; background: #F6F6F6; border-right: 1px solid #C8C7CC;
      scrollbar-gutter: stable;
      position: sticky; top: calc(var(--proto-bar-h) + 56px);
      height: calc(100vh - var(--proto-bar-h) - 56px); overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .p-main { flex: 1; min-width: 0; padding: 24px 32px 48px; }

    /* ── Context switcher trigger ── */
    .ctx { position: relative; flex: 0 0 228px; width: 228px; height: 40px; display: flex; align-items: center; }
    .t-left { display: flex; align-items: center; gap: 12px; margin-right: auto; height: 40px; }
    .t-left #backChip:empty { display: none; }
    .ctx-trigger {
      width: 100%; display: flex; align-items: center; gap: 10px;
      height: 40px; padding: 0 8px; border: 0; border-radius: 6px;
      background: transparent; cursor: pointer; text-align: left; font: inherit; color: inherit;
    }
    .ctx-trigger:hover { background: #F2F6FC; }
    .ctx-trigger[aria-expanded="true"] { background: #F2F6FC; box-shadow: inset 0 0 0 1px #DFE4EC; }
    .ctx-trigger:focus-visible { outline: 2px solid #0053CC; outline-offset: 0; }
    .ctx-trigger .av { width: 28px; height: 28px; font-size: 12px; }
    .ctx-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .ctx-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctx-cap { font-size: 12px; line-height: 16px; color: #6B778C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctx-trigger .material-icons { font-size: 20px; color: #6B778C; }

    .av {
      width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 500; letter-spacing: .02em;
    }
    .av.firm { border-radius: 8px; background: #1A1B24; }
    .av.sm { width: 24px; height: 24px; font-size: 11px; }
    .av.sm.firm { border-radius: 6px; }

    .back-chip {
      display: inline-flex; align-items: center; gap: 4px; margin: 0; height: 28px;
      padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #6B778C;
      text-decoration: none; cursor: pointer; background: none; border: none; font-family: inherit;
    }
    .back-chip:hover { color: #0053CC; background: #F2F6FC; }
    .back-chip .material-icons { font-size: 16px; }

    /* ── Switcher popover ── */
    .pop {
      position: absolute; left: 0; top: calc(100% + 8px); z-index: 60;
      width: 300px; background: #fff; border: 1px solid #DFE4EC; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(26,27,36,.14); display: none; overflow: hidden;
    }
    .pop.open { display: block; }
    .pop-search { padding: 10px; border-bottom: 1px solid #EFF1F5; position: relative; }
    .pop-search input { height: 36px; padding-right: 56px; }
    .kbd {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      font-size: 12px; color: #6B778C; border: 1px solid #DFE4EC; border-radius: 4px; padding: 0 5px; background: #F7F8FA;
    }
    .pop-list { max-height: 380px; overflow-y: auto; padding: 4px 0; }
    .pop-sec { padding: 10px 14px 4px; font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: #6B778C; }
    .pop-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 7px 14px; background: none; border: none; cursor: pointer; text-align: left;
      font: inherit; color: #1A1B24;
    }
    .pop-item:hover, .pop-item.kb { background: #F2F6FC; }
    .pop-item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .pop-item .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pop-item .c { font-size: 12px; line-height: 16px; color: #6B778C; }
    .pop-item .check { font-size: 18px; color: #0053CC; }
    .pop-link {
      display: block; width: 100%; padding: 7px 14px 7px 48px; background: none; border: none;
      text-align: left; cursor: pointer; font: inherit; color: #0053CC;
    }
    .pop-link:hover, .pop-link.kb { background: #F2F6FC; }
    .pop-empty { padding: 16px 14px; color: #6B778C; }
    .pop-foot { border-top: 1px solid #EFF1F5; padding: 6px 0; }
    .pop-foot button {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 14px;
      background: none; border: none; cursor: pointer; font: inherit; color: #6B778C; text-align: left;
    }
    .pop-foot button:hover, .pop-foot button.kb { background: #F7F8FA; color: #1A1B24; }
    .pop-foot .material-icons { font-size: 18px; width: 24px; text-align: center; }

    /* ── Sidebar nav (Synder production style) ── */
    .nav { flex: 1; }
    .nav-i {
      display: flex; align-items: center; gap: 8px; width: 100%;
      min-height: 43px; padding: 0 16px; background: transparent;
      border: none; border-bottom: 1px solid #C8C7CC; cursor: pointer;
      font: inherit; font-size: 14px; color: #555; text-align: left;
    }
    .nav-i .material-icons { font-size: 22px; color: #007AFF; }
    .nav-i:hover { background: #D9D9D9; }
    .nav-i.active, .nav-i.active:hover { background: #007AFF; color: #fff; }
    .nav-i.active .material-icons { color: #fff; }
    .nav-i .cnt { margin-left: auto; font-size: 13px; color: #6B778C; }
    .nav-i.active .cnt { color: #fff; }

    /* ── Main content ── */
    .ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .ph h1 { font-size: 28px; line-height: 36px; font-weight: 400; margin: 0; }
    .ph .sub { color: #6B778C; margin-top: 2px; }
    .ph-actions { display: flex; align-items: center; gap: 12px; }
    .crumb {
      display: inline-flex; align-items: center; gap: 4px; color: #0053CC; cursor: pointer;
      background: none; border: none; font: inherit; padding: 0; margin-bottom: 8px;
    }
    .crumb:hover { text-decoration: underline; }
    .crumb .material-icons { font-size: 18px; }
    .toolbar { display: flex; gap: 12px; margin-bottom: 12px; }
    .toolbar input { max-width: 320px; }
    .linkish { color: #0053CC; cursor: pointer; background: none; border: none; font: inherit; padding: 0; text-align: left; }
    .linkish:hover { text-decoration: underline; }
    .client-cell { display: flex; align-items: center; gap: 10px; }
    .muted { color: #6B778C; }
    .status { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 4px; font-size: 14px; white-space: nowrap; }
    .tbl-foot { padding: 12px 10px; color: #6B778C; }

    .section-h { font-size: 20px; line-height: 28px; font-weight: 400; margin: 8px 0 12px; }
    .empty { text-align: center; padding: 56px 24px; max-width: 460px; margin: 0 auto; }
    .empty .material-icons { font-size: 40px; color: #B4BBCB; }
    .empty h2 { font-size: 20px; line-height: 28px; font-weight: 500; margin: 12px 0 6px; }
    .empty p { color: #6B778C; margin: 0 0 20px; }
    .empty .sec { display: block; margin: 12px auto 0; }

    .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; max-width: 840px; }
    .kpi { border: 1px solid #DFE4EC; border-radius: 8px; padding: 16px; }
    .kpi .l { color: #6B778C; }
    .kpi .v { font-size: 28px; line-height: 36px; margin-top: 4px; }

    /* ── Modal ── */
    .scrim { position: fixed; inset: 0; background: rgba(26,27,36,.4); z-index: 400; display: none; align-items: center; justify-content: center; }
    .scrim.open { display: flex; }
    .modal { width: 440px; max-width: calc(100vw - 32px); background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 12px 32px rgba(0,0,0,.2); }
    .modal h3 { margin: 0 0 8px; font-size: 20px; line-height: 28px; font-weight: 500; }
    .modal p { margin: 0 0 16px; color: #6B778C; }
    .idrow { display: flex; gap: 8px; margin-bottom: 20px; }
    .idrow input { font-size: 16px; letter-spacing: .04em; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
    /* ── v4 client details ── */
    .cd-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
    .cd-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .cd-title h1 { font-size: 28px; line-height: 36px; font-weight: 400; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cd-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .pager { display: inline-flex; align-items: center; gap: 2px; color: #6B778C; font-size: 13px; white-space: nowrap; }
    .pager button { width: 28px; height: 28px; border: 0; background: none; border-radius: 4px; cursor: pointer; color: #6B778C; display: inline-flex; align-items: center; justify-content: center; }
    .pager button:hover:not(:disabled) { background: #F2F6FC; color: #0053CC; }
    .pager button:disabled { opacity: .35; cursor: default; }
    .period { height: 36px; border: 1px solid #C8C7CC; border-radius: 4px; padding: 0 8px; font: inherit; background: #fff; }
    .tipwrap { position: relative; display: inline-flex; }
    .tipwrap[data-tip]:hover::after {
      content: attr(data-tip); position: absolute; right: 0; top: calc(100% + 6px); z-index: 70; width: 260px;
      background: #1A1B24; color: #fff; font-size: 13px; line-height: 18px; padding: 8px 10px; border-radius: 6px; white-space: normal;
    }
    .btn[disabled] { opacity: .5; cursor: not-allowed; pointer-events: none; }
    .more { width: 36px; height: 36px; border: 1px solid #C8C7CC; border-radius: 4px; background: #fff; cursor: pointer; color: #555; display: inline-flex; align-items: center; justify-content: center; }
    .more:hover, .more[aria-expanded="true"] { background: #F2F6FC; }
    .menu .danger, .menu .danger .material-icons { color: #CC2929; }
    .wk-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; max-width: 880px; margin-bottom: 24px; }
    .mpick { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
    .mpick select { appearance: none; border: 0; background: none; font: inherit; font-size: 20px; line-height: 28px; font-weight: 500; color: #1A1B24; padding: 0 26px 0 0; cursor: pointer; }
    .mpick .material-icons { position: absolute; right: 0; pointer-events: none; color: #6B778C; }
    .mpick select:focus-visible { outline: 2px solid #0053CC; border-radius: 4px; }
    .wk-line { margin-top: 4px; color: #555; }
    .ln-warn { color: #B35E0B; font-weight: 500; } .ln-ok { color: #1F8940; font-weight: 500; }
    .wk-sec { max-width: 880px; margin-bottom: 28px; }
    .sec-h { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: flex; gap: 8px; }
    .sec-h .muted { font-weight: 400; }
    .tabs-l { display: flex; gap: 24px; }
    .tabs { justify-content: space-between; align-items: center; }
    .tabs { display: flex; gap: 24px; border-bottom: 1px solid #DFE4EC; margin: 12px 0 24px; }
    .tabs button { background: none; border: 0; font: inherit; color: #555; padding: 10px 0; cursor: pointer; box-shadow: inset 0 -2px 0 transparent; }
    .tabs button.on { color: #0053CC; box-shadow: inset 0 -2px 0 #0053CC; font-weight: 500; }
    .card { border: 1px solid #DFE4EC; border-radius: 8px; padding: 16px; margin-bottom: 16px; max-width: 880px; }
    .sum { display: flex; gap: 12px; align-items: flex-start; }
    .sum .material-icons { font-size: 24px; }
    .sum h3 { margin: 0; font-size: 16px; font-weight: 500; }
    .sum ul { margin: 6px 0 0; padding-left: 18px; color: #555; }
    .sum li { margin: 2px 0; }
    .sum.blocked { background: #FFF7F0; border-color: #F3D2B3; } .sum.blocked > .material-icons { color: #CB7515; }
    .sum.ready { background: #F1F9F3; border-color: #BFE3C8; } .sum.ready > .material-icons { color: #1F8940; }
    .sum.closed > .material-icons { color: #6B778C; }
    .chk-h { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .chk-h h2 { font-size: 16px; font-weight: 500; margin: 0; }
    .bar { flex: 0 0 120px; height: 6px; border-radius: 3px; background: #EFF1F5; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #1F8940; }
    .chk { border-bottom: 1px solid #EFF1F5; }
    .chk summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
    .chk summary::-webkit-details-marker { display: none; }
    .chk .ic { font-size: 20px; }
    .ic.pass { color: #1F8940; } .ic.fail { color: #CC2929; } .ic.warn { color: #CB7515; } .ic.wait { color: #B4BBCB; }
    .chk .nm { width: 180px; font-weight: 500; }
    .chk .stt { flex: 1; color: #555; }
    .chk .exp { color: #6B778C; font-size: 20px; transition: transform .15s; }
    .chk[open] .exp { transform: rotate(180deg); }
    .chk .det { padding: 0 0 12px 32px; color: #6B778C; }
    textarea.note { width: 100%; min-height: 72px; border: 1px solid #C8C7CC; border-radius: 4px; padding: 8px; font: inherit; resize: vertical; }
    .hist summary { cursor: pointer; color: #6B778C; list-style: none; }
    .hist summary::-webkit-details-marker { display: none; }
    .hist table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .hist td { padding: 6px 8px 6px 0; border-top: 1px solid #EFF1F5; vertical-align: top; }
    .hist td:first-child { color: #6B778C; white-space: nowrap; width: 130px; }
    .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; max-width: 880px; }
    .form label { display: flex; flex-direction: column; gap: 4px; color: #555; font-size: 13px; }
    .form .full { grid-column: 1 / -1; }
    .form input, .form textarea { font: inherit; font-size: 14px; color: #1A1B24; }
    .kv { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; margin: 0; }
    .kv dt { color: #6B778C; } .kv dd { margin: 0; }
    tr.rowlink { cursor: pointer; } tr.rowlink:hover td { background: #F7F8FA; }
    #stateSeg.hide { visibility: hidden; }
    /* ── v7 onboarding: portrait cards + client directory ── */
    .shell-hide .p-top, .shell-hide .p-body { display: none; }
    .ob { display: none; min-height: calc(100vh - var(--proto-bar-h)); background: #fff; }
    .shell-hide .ob { display: block; }
    .ob-in { max-width: 1040px; margin: 0 auto; padding: 32px 40px 48px; }
    .ob-in.review-fit {
      height: calc(100vh - 50px);
      display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0;
    }
    .ob-back-slot { height: 28px; margin: 0 0 8px; display: flex; align-items: center; flex: 0 0 28px; }
    .ob-in.review-fit > h1, .ob-in.review-fit > .welcome-copy, .ob-in.review-fit > .lead, .review-foot { flex: 0 0 auto; }
    .ob h1 { font-size: 32px; line-height: 40px; font-weight: 500; margin: 0 0 12px; text-align: left; }
    .ob .lead, .ob .welcome-copy { color: #1A1B24; text-align: left; margin: 0 0 20px; max-width: 720px; font-size: 16px; line-height: 24px; }
    .ob-cards { display: grid; gap: 20px; width: 100%; margin: 0; }
    .ob-cards.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .ob-cards.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .ob-card {
      position: relative;
      display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
      min-height: 328px; width: 100%; text-align: left;
      padding: 32px 24px 28px; background: #fff; border: 1px solid #DFE4EC; border-radius: 12px;
      cursor: pointer; font: inherit; color: inherit;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .ob-card:hover { border-color: #0053CC; background: #F7FAFF; box-shadow: 0 8px 24px rgba(0, 83, 204, .08); }
    .ob-card:focus { outline: none; }
    .ob-card:focus-visible { outline: 2px solid #003E99; outline-offset: 3px; }
    .ob-card:active { background: #E7F0FC; }
    .ob-card.selected { border-color: #0053CC; background: #F2F6FC; box-shadow: inset 0 0 0 1px #0053CC; }
    .ob-card.selected:hover { background: #E7F0FC; }
    .ob-card .ob-ico {
      width: 56px; height: 56px; border-radius: 14px; background: #F2F6FC; color: #0053CC;
      display: inline-flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; overflow: hidden;
    }
    .ob-card.selected .ob-ico { background: #fff; }
    .ob-card .ob-check { position: absolute; top: 16px; right: 16px; font-size: 22px; color: transparent; }

  </style>
</head>
<body>
  <div class="proto-bar">

      <button data-m="firm">Firm workspace</button>

    <div class="seg hide" id="stateSeg" title="Client page state">

  </div>

<script>
(function () {
  /* ───────── Data ───────── */
  const FIRM = { id: 'firm', name: 'WLS Labs', firmId: '1793300370' };
  const CLIENTS = [
    { id: 'c1',  name: 'Bluebird Bakery',          ledger: 'QuickBooks Online', pay: 'Stripe, Square',  books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c2',  name: 'Cedar & Pine Interiors',   ledger: 'Xero',              pay: 'Shopify, PayPal', books: ['yellow', '6 uncategorized'],   month: 'Oct 2026', setup: true },
    { id: 'c3',  name: 'Delta Freight LLC',        ledger: 'QuickBooks Online', pay: 'Stripe',          books: ['red', '3 failed syncs'],       month: 'Sep 2026', setup: true },
    { id: 'c4',  name: 'Evergreen Landscaping',    ledger: 'QuickBooks Online', pay: 'Square',          books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c5',  name: 'Fable Coffee Roasters',    ledger: 'Xero',              pay: 'Shopify',         books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c6',  name: 'Granite Peak Dental',      ledger: null,                pay: null,              books: ['grey', 'Not set up'],          month: null, setup: false },
    { id: 'c7',  name: 'Harbor Street Books',      ledger: 'QuickBooks Online', pay: 'Amazon, Shopify', books: ['yellow', '12 unreconciled'],   month: 'Oct 2026', setup: true },
    { id: 'c8',  name: 'Ironwood Fitness',         ledger: 'QuickBooks Online', pay: 'Stripe',          books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c9',  name: 'Juniper Yoga Studio',      ledger: null,                pay: 'Stripe',          books: ['grey', 'Not set up'],          month: null, setup: false },
    { id: 'c10', name: 'Kestrel Analytics',        ledger: 'Xero',              pay: 'Stripe',          books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c11', name: 'Lumen Dental Lab',         ledger: 'QuickBooks Online', pay: 'PayPal',          books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c12', name: 'Maple & Main Florist',     ledger: 'QuickBooks Online', pay: 'Square',          books: ['yellow', '4 uncategorized'],   month: 'Oct 2026', setup: true },
    { id: 'c13', name: 'Northgate Auto Repair',    ledger: null,                pay: null,              books: ['grey', 'Not set up'],          month: null, setup: false }
  ];
  function demoClients() {
    return CLIENTS.map((c) => Object.assign({}, c)).concat([{ id: 'c14', name: 'Oakridge Pottery', pending: true, ledger: null, pay: null, books: ['grey', 'Pending'], month: null }]);
  }
  const SCENARIOS = {
    'firm':   { firm: true,  clients: demoClients(), own: [{ id: 'o1', name: 'WLS Labs Books' }] },
  };
  const PALETTE = ['#0053CC', '#1F8940', '#CB7515', '#310BB0', '#3C4EAC', '#CC2929', '#0E7C86', '#8A4FBF'];
  const FIRM_NAV = [
    ['dashboard', 'dashboard', 'Dashboard'],
    ['clients', 'people', 'Clients'],
    ['colleagues', 'groups', 'Colleagues'],
    ['billing', 'receipt_long', 'Billing and licenses'],
    ['firmsettings', 'settings', 'Firm settings']
  ];
  const ORG_NAV = [
    ['dashboard', 'dashboard', 'Dashboard'], ['mapping', 'account_tree', 'Mapping'],
    ['summaries', 'summarize', 'Summaries'], ['reconciliation', 'fact_check', 'Reconciliation'],
    ['products', 'inventory_2', 'Products and services'], ['analytics', 'insights', 'Analytics'],
    ['revrec', 'timeline', 'Revenue recognition'], ['settings', 'settings', 'Settings']
  ];
  const TOP_PAGES = {
    how: ['live_help', 'How it works?'], notifications: ['notifications_none', 'Notifications'],
    helpcenter: ['menu_book', 'Help center'], support: ['chat_bubble_outline', 'Contact support'],
    orgsettings: ['tune', 'Organization settings'], activity: ['history', 'Activity log'],
    profile: ['person_outline', 'User profile'], orglist: ['list', 'List of organizations']
  };
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform);

  /* ───────── State ───────── */
  let scenario = 'firm';
  let st = null;          // { ctx: 'firm'|'org', orgId, page, clientId, recent: [] }
  let kbIndex = -1;
  let cdState = 'blocked';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const initials = (n) => n.replace(/&/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const color = (id) => { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
  const av = (o, sm) => o.id === 'firm'
    ? `<span class="av firm${sm ? ' sm' : ''}">${initials(o.name)}</span>`
    : `<span class="av${sm ? ' sm' : ''}" style="background:${color(o.id)}">${initials(o.name)}</span>`;

  /* ───────── v7: Onboarding ─────────
     Import sources are simulated design proposals. No OAuth, sign-in, or live books.
     QuickBooks sample = customers on the firm's own company, not a QBOA client directory.
  */
  const EXTRA = [
    { id: 'c15', name: 'Pinecrest Realty' },
    { id: 'c16', name: 'Quill & Ink Agency' },
    { id: 'c17', name: 'Riverbend Cafe' },
    { id: 'c18', name: 'Summit Peak Advisors' },
    { id: 'c19', name: 'Tidewater Outfitters' }
  ];
  const FORMER_IDS = new Set(EXTRA.map((c) => c.id));
  const IMPORT_POOL = CLIENTS.concat(EXTRA).map((c) => ({ id: c.id, name: c.name, former: FORMER_IDS.has(c.id) }));
  const SETUP_STEPS = [
    ['books', 'Connect books'],
    ['integrations', 'Connect integrations'],
    ['mode', 'Select mode'],
    ['import', 'Import data']
  ];

  let mode = 'firm'; // 'onboarding' | 'firm'
  let ob = null;

  function defaultOb() {
    return {
      step: 'role', role: null, roleChosen: false, roleNote: '', otherOpen: false,
      firmChoice: null, firmChosen: false, source: null, firmName: '', firmTouched: false,
      connectedName: '', directoryReady: false, pendingEntries: [], nameFrom: 'import',
      selected: Object.fromEntries(IMPORT_POOL.map((c) => [c.id, !c.former])),
      q: '', manual: [], manualMsg: '', setupStep: 'books', setupClientId: null
    };
  }
  function loadOb() {
    try {
      const raw = localStorage.getItem('fcs-ob-v1');
      if (raw) {
        const v = JSON.parse(raw);
        if (v && v.step) {
          ob = Object.assign(defaultOb(), v);
          if (!Array.isArray(ob.manual)) ob.manual = [];
          IMPORT_POOL.forEach((c) => { if (typeof ob.selected[c.id] !== 'boolean') ob.selected[c.id] = !c.former; });
          if (!v.roleChosen) ob.role = null;
          if (!v.firmChosen) ob.firmChoice = null;
          return;
        }
      }
    } catch (e) {}
    ob = defaultOb();
  }
  function saveOb() { try { localStorage.setItem('fcs-ob-v1', JSON.stringify(ob)); } catch (e) {} }

  function isSetup(c) { return !!(c && c.setup); }
  function firmClients() { return sc().clients.filter((c) => !c.pending); }
  function setupCount() { return firmClients().filter(isSetup).length; }

  function goOnboarding(step) {
    mode = 'onboarding';
    if (step) ob.step = step;
    saveOb();
    document.body.classList.add('shell-hide');
    renderMode();
    renderOb();
  }
  function persistDirectory() {
    try {
      localStorage.setItem('fcs-dir-v1', JSON.stringify({
        ready: !!(ob && ob.directoryReady),
        name: FIRM.name,
        clients: SCENARIOS.firm.clients
      }));
    } catch (e) {}
  }
  function restoreDirectory() {
    try {
      const raw = localStorage.getItem('fcs-dir-v1');
      if (!raw) return;
      const v = JSON.parse(raw);
      if (v && v.ready && Array.isArray(v.clients)) {
        SCENARIOS.firm.clients = v.clients;
        if (v.name) FIRM.name = v.name;
        if (ob) ob.directoryReady = true;
      }
    } catch (e) {}
  }
  function goWorkspace(page, clientId) {
    mode = 'firm';
    document.body.classList.remove('shell-hide');
    if (!(ob && ob.directoryReady)) {
      SCENARIOS.firm.clients = demoClients();
      FIRM.name = 'WLS Labs';
      try { localStorage.removeItem('fcs-dir-v1'); } catch (e) {}
      st = defaultState(); save();
    } else {
      FIRM.name = (ob && ob.firmName) || FIRM.name || 'WLS Labs';
      if (!st) { st = defaultState(); save(); }
    }
    goFirm(page || (setupCount() > 0 ? 'dashboard' : 'clients'), clientId);
    renderMode();
  }
  function restartOnboarding() {
    ob = defaultOb();
    saveOb();
    SCENARIOS.firm.clients = demoClients();
    FIRM.name = 'WLS Labs';
    try { localStorage.removeItem('fcs-dir-v1'); } catch (e) {}
    goOnboarding('role');
  }
  function finishOnboarding(entries) {
    const clients = (entries || []).map((c) => ({
      id: c.id, name: c.name, ledger: null, pay: null,
      books: ['grey', 'Not set up'], month: null, setup: false
    }));
    SCENARIOS.firm.clients = clients;
    FIRM.name = ob.firmName;
    ob.directoryReady = true;
    ob.step = 'done';
    st = { ctx: 'firm', page: 'clients', orgId: null, clientId: null, recent: [] };
    save(); saveOb(); persistDirectory();
    goWorkspace('clients');
  }

  function renderMode() {
    document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('active', b.dataset.m === mode));
    const onClient = mode === 'firm' && st && st.ctx === 'firm' && st.page === 'client' && st.clientId && findOrg(st.clientId) && !findOrg(st.clientId).pending;
    $('stateSeg').classList.toggle('hide', !onClient);
  }

  function obShell(inner, review) {
    return `<div class="ob-in${review ? ' review-fit' : ''}" data-step="${esc(ob.step || 'role')}">${inner}</div>`;
  }
  function backSlot(show) {
    return `<div class="ob-back-slot">${show ? '<button type="button" class="ob-back" id="obBack"><span class="material-icons">arrow_back</span>Back</button>' : ''}</div>`;
  }

      ob.manual.push({ id: 'm' + Math.random().toString(36).slice(2, 8), name });
      ob.manualMsg = '';
      saveOb(); renderOb();
      const again = $('manualName'); if (again) again.focus();
    };
    on('obAddName', addManual);
    if (manual) manual.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addManual(); } };
    document.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => {
      ob.manual = ob.manual.filter((c) => c.id !== b.dataset.rm);
      ob.manualMsg = ''; saveOb(); renderOb();
    });
    on('obManualDone', () => goFirmName(ob.manual || [], 'add'));
    const search = $('obSearch');
    if (search) search.oninput = () => {
      ob.q = search.value; saveOb(); renderOb();
      const n = $('obSearch'); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
    };
    const all = $('obAll');
    if (all) {
      const picked = IMPORT_POOL.filter((c) => ob.selected[c.id]).length;
      all.checked = picked === IMPORT_POOL.length;
      all.indeterminate = picked > 0 && picked < IMPORT_POOL.length;
      all.onchange = () => {
        IMPORT_POOL.forEach((c) => { ob.selected[c.id] = all.checked; });
        saveOb(); renderOb();
      };
    }
    document.querySelectorAll('[data-cid]').forEach((cb) => cb.onchange = () => {
      ob.selected[cb.dataset.cid] = cb.checked; saveOb(); renderOb();
    });
    on('obAdd', () => {
      goFirmName(IMPORT_POOL.filter((c) => ob.selected[c.id]).map((c) => ({ id: c.id, name: c.name })), 'review');
    });
    on('obSkipAdd', () => goFirmName([], 'review'));
  }

  function sc() { return SCENARIOS[scenario]; }
  function findOrg(id) { return sc().clients.find((c) => c.id === id) || sc().own.find((o) => o.id === id); }
  function isClient(id) { return sc().clients.some((c) => c.id === id); }

  function defaultState() {
    const s = sc();
    if (s.firm) return { ctx: 'firm', page: 'clients', orgId: null, clientId: null, recent: s.clients.slice(0, 4).map((c) => c.id) };
    return { ctx: 'org', page: 'dashboard', orgId: s.own[0].id, clientId: null, recent: [] };
  }
  function load() {
    try {
      const raw = localStorage.getItem('fcs-v1-' + scenario);
      if (raw) {
        const v = JSON.parse(raw);
        if (v && (v.ctx === 'firm' ? sc().firm : findOrg(v.orgId))) { st = v; return; }
      }
    } catch (e) {}
    st = defaultState();
  }
  function save() { try { localStorage.setItem('fcs-v1-' + scenario, JSON.stringify(st)); } catch (e) {} }

  /* ───────── Navigation ───────── */
  function goFirm(page, clientId) {
    if (page === 'client' && clientId !== st.clientId) st.tab = 'work';
    st.ctx = 'firm'; st.page = page || 'clients'; st.clientId = clientId || null;
    if (clientId) touchRecent(clientId);
    save(); render();
  }
  function goOrg(orgId, page) {
    st.ctx = 'org'; st.orgId = orgId; st.page = page || 'dashboard'; st.clientId = null;
    if (isClient(orgId)) touchRecent(orgId);
    save(); render();
  }
  function touchRecent(id) {
    st.recent = [id].concat((st.recent || []).filter((x) => x !== id)).slice(0, 4);
  }

  /* ───────── v4: Client details (firm side) ───────── */
  const PERIODS = ['Jul 2026', 'Aug 2026', 'Sep 2026', 'Oct 2026', 'Nov 2026'];
  const MONTH_FULL = { Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November' };
  const mName = (p) => MONTH_FULL[p.split(' ')[0]];
  function cdPeriod(c) { if (!st.period || !PERIODS.includes(st.period)) st.period = c.month || 'Oct 2026'; return st.period; }
  function cdChecks(c) {
    const m = mName(cdPeriod(c));
    const noLedger = !c.ledger && cdState === 'blocked';
    const ledger = c.ledger || 'QuickBooks Online';
    const ok = cdState !== 'blocked';
    const W = 'Waiting for accounting connection';
    return [
      { k: 'acc', nm: 'Accounting connection', s: noLedger ? 'fail' : 'pass',
        t: noLedger ? 'No accounting system connected' : 'Connected to ' + ledger,
        a: noLedger ? ['Connect ledger', 'settings'] : null,
        d: noLedger ? 'Syncs, mappings and reconciliation all need a connected ledger. Connect one in the client’s Settings.' : 'Last checked today.' },
      { k: 'syn', nm: 'Syncs', s: noLedger ? 'wait' : ok ? 'pass' : 'fail',
        t: noLedger ? W : ok ? 'All ' + m + ' syncs went through' : '16 syncs failed in ' + m,
        a: noLedger ? null : ok ? null : ['Review failed syncs', 'dashboard'],
        d: noLedger ? 'Checked once a ledger is connected.' : ok ? '2,318 transactions synced.' : '16 of 2,318 transactions failed. Fix or ignore them before closing.' },
      { k: 'map', nm: 'Mappings', s: noLedger ? 'wait' : 'pass',
        t: noLedger ? W : 'All payment sources are mapped',
        a: null,
        d: noLedger ? 'Checked once a ledger is connected.' : (c.pay || 'Stripe') + ' mapped to ' + ledger + ' accounts.' },
      { k: 'rec', nm: 'Reconciliation', s: noLedger ? 'wait' : ok ? 'pass' : 'warn',
        t: noLedger ? W : ok ? m + ' is reconciled' : 'We couldn’t read reconciliation results',
        a: noLedger ? null : ok ? null : ['Open reconciliation', 'reconciliation'],
        d: noLedger ? 'Checked once a ledger is connected.' : 'Transaction reconciliation is available for ' + ledger + '.' + (ok ? '' : ' Open Reconciliation to run it again.') }
    ];
  }
  const ICON = { pass: 'check_circle', fail: 'error', warn: 'warning', wait: 'schedule' };
  function cdHistory(c) {
    const p = cdPeriod(c); const mon = p.split(' ')[0];
    const rows = [[mon + ' 1, 09:00', 'Status changed: Not started → In progress'],
      [mon + ' 3, 02:14', c.ledger || cdState !== 'blocked' ? 'Sync finished: 412 transactions' : 'Sync skipped: no accounting connection']];
    if (cdState === 'blocked') rows.push([mon + ' 28, 18:40', 'Status changed: In progress → Blocked']);
    if (cdState === 'ready') rows.push([mon + ' 30, 10:05', 'Status changed: Blocked → Ready to close']);
    if (cdState === 'closed') rows.push([mon + ' 30, 10:05', 'Status changed: Blocked → Ready to close'], [mon + ' 30, 16:22', 'Status changed: Ready to close → Closed (Ignat Plot)']);
    return rows.reverse();
  }
  function renderPending(c) {
    return `<button class="crumb" id="crumbBack"><span class="material-icons">arrow_back</span>Clients</button>
      <div class="cd-top"><div class="cd-title"><h1>${esc(c.name)}</h1><span class="status status-yellow">Pending</span></div></div>
      <div class="empty"><span class="material-icons">how_to_reg</span><h2>${esc(c.name)} wants to connect</h2>

  function renderClientDetail() {
    const c = findOrg(st.clientId);
    if (c.pending) return renderPending(c);
    const list = sc().clients.filter((x) => !x.pending);
    const i = list.findIndex((x) => x.id === c.id);
    const p = cdPeriod(c); const m = mName(p);
    const checks = cdChecks(c);
    const passed = checks.filter((x) => x.s === 'pass').length;
    const blockers = checks.filter((x) => x.s === 'fail' || x.s === 'warn');
    const statusBadge = cdState === 'closed' ? ['grey', 'Closed'] : cdState === 'ready' ? ['green', 'Ready to close'] : ['yellow', 'Blocked'];
    const tip = blockers.length ? 'Can’t close ' + m + ': ' + blockers.map((b) => b.t.charAt(0).toLowerCase() + b.t.slice(1)).join('; ') + '.' : '';
    const primary = cdState === 'closed' ? '' :
      `<span class="tipwrap"${cdState === 'blocked' ? ` data-tip="${esc(tip)}"` : ''}><button class="btn" id="closeMonth"${cdState === 'blocked' ? ' disabled' : ''}>Close month</button></span>`;
    const tab = st.tab || 'work';
    let body = '';
    if (tab === 'work') {
      const line = cdState === 'blocked'
        ? `<span class="ln-warn">${blockers.length} blocker${blockers.length > 1 ? 's' : ''}</span> · ${blockers.map((b) => esc(b.t)).join(' · ')}`
        : cdState === 'ready' ? '<span class="ln-ok">Ready to close</span> · all checks passed'
        : `Closed by Ignat Plot on ${p.split(' ')[0]} 30, ${p.split(' ')[1]}`;
      const note = (st.notes || {})[c.id + '|' + p] || '';
      body = `
        <div class="wk-top">
          <div><label class="mpick"><select id="periodSel" aria-label="Month">${PERIODS.map((x) => `<option value="${x}"${x === p ? ' selected' : ''}>${mName(x)} ${x.split(' ')[1]}</option>`).join('')}</select><span class="material-icons">expand_more</span></label>
            <div class="wk-line">${line}</div></div>
          ${primary}
        </div>
        <div class="wk-sec">
          <div class="sec-h">Checks <span class="muted">${passed} of ${checks.length} passed</span></div>
          ${checks.map((x) => `<details class="chk"><summary><span class="material-icons ic ${x.s}">${ICON[x.s]}</span><span class="nm">${x.nm}</span><span class="stt">${esc(x.t)}</span>${x.a ? `<button class="linkish" data-fix="${x.a[1]}">${esc(x.a[0])}</button>` : ''}<span class="material-icons exp">expand_more</span></summary><div class="det">${esc(x.d)}</div></details>`).join('')}
        </div>
        <div class="wk-sec">
          <div class="sec-h">Notes</div>
          <textarea class="note" id="cdNote" placeholder="Notes for ${m}. Visible to your firm colleagues.">${esc(note)}</textarea>
        </div>
        <details class="wk-sec hist"><summary>History for ${m} (${cdHistory(c).length})</summary>
          <table>${cdHistory(c).map(([t, e]) => `<tr><td>${esc(t)}</td><td>${esc(e)}</td></tr>`).join('')}</table></details>`;
    } else if (tab === 'profile') {
      const f = (l, v, full) => `<label${full ? ' class="full"' : ''}>${l}<input type="text" value="${esc(v)}" /></label>`;
      body = `<div class="form">
        ${f('Client name', c.name)}${f('Contact person', 'Jordan Lee')}
        ${f('Email', 'jordan@' + c.name.toLowerCase().replace(/[^a-z]/g, '') + '.com')}${f('Phone', '+1 415 555 0134')}
        ${f('Business type', 'LLC')}${f('Accounting software', c.ledger || 'Not connected')}
        ${f('Fiscal year start', 'January')}${f('Tax ID', '84-1234567')}
        ${f('Address', '120 Market St, San Francisco, CA', true)}
        <label class="full">Notes<textarea class="note"></textarea></label>
        <div class="full"><button class="btn" id="saveProfile">Save</button></div></div>`;
    } else if (tab === 'billing') {
      body = `<div class="card"><dl class="kv"><dt>Plan</dt><dd>Pro, billed to ${esc(FIRM.name)}</dd><dt>Price</dt><dd>$110 / month</dd><dt>Next invoice</dt><dd>Dec 1, 2026</dd><dt>License</dt><dd>1 of 15 firm licenses</dd></dl></div>`;
    } else {
      body = `<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>
        <tr><td>Ignat Plot</td><td>ignat@wlslabs.com</td><td>Admin</td></tr>
        <tr><td>Dasha Ivanova</td><td>dasha@wlslabs.com</td><td>Accountant</td></tr></tbody></table></div>`;
    }
    const T = [['work', 'Work'], ['profile', 'Profile'], ['billing', 'Billing'], ['colleagues', 'Firm colleagues']];
    const pager = `<span class="pager"><button id="prevC" aria-label="Previous client"${i <= 0 ? ' disabled' : ''}><span class="material-icons">chevron_left</span></button>${i + 1} of ${list.length}<button id="nextC" aria-label="Next client"${i >= list.length - 1 ? ' disabled' : ''}><span class="material-icons">chevron_right</span></button></span>`;
    return `
      <button class="crumb" id="crumbBack"><span class="material-icons">arrow_back</span>Clients</button>
      <div class="cd-top">
        <div class="cd-title"><h1>${esc(c.name)}</h1><span class="status status-${statusBadge[0]}">${statusBadge[1]}</span></div>
        <div class="cd-actions">
          <button class="btn-text" data-open="${c.id}">Open in Synder</button>
          <span class="t-wrap"><button class="more" id="moreBtn" aria-label="More actions" aria-expanded="false"><span class="material-icons">more_horiz</span></button>
            <div class="menu" id="moreMenu"><button class="danger" id="removeBtn"><span class="material-icons">person_remove</span>Remove client</button></div></span>
        </div>
      </div>
      <div class="tabs"><div class="tabs-l">${T.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}</div>${pager}</div>
      ${body}`;

  function bindClientDetail() {
    const c = findOrg(st.clientId); const m = $('main');
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    on('acceptBtn', () => { c.pending = false; c.books = ['grey', 'Setup needed']; goFirm('client', c.id); });
    on('pendBack', () => goFirm('clients'));
    if (c.pending) return;
    const list = sc().clients.filter((x) => !x.pending); const i = list.indexOf(c);
    on('prevC', () => goFirm('client', list[i - 1].id));
    on('nextC', () => goFirm('client', list[i + 1].id));
    $('periodSel').onchange = (e) => { st.period = e.target.value; save(); renderMain(); };
    on('closeMonth', () => { cdState = 'closed'; render(); });
    on('moreBtn', () => toggleMenu('moreBtn', 'moreMenu'));
    on('removeBtn', () => { closeMenus(); openRemove(c); });
    on('saveProfile', (e) => { e.target.textContent = 'Saved'; });
    m.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { st.tab = b.dataset.tab; save(); renderMain(); });
    m.querySelectorAll('[data-fix]').forEach((b) => b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); goOrg(c.id, b.dataset.fix); });
    const n = $('cdNote');
    if (n) n.oninput = () => { st.notes = st.notes || {}; st.notes[c.id + '|' + st.period] = n.value; save(); };
  }
  function openRemove(c) {
    $('modal').innerHTML = `<h3>Remove ${esc(c.name)}?</h3>
      <p>${esc(FIRM.name)} loses access to ${esc(c.name)}’s books, and the client leaves your Clients list. Their Synder organization and data stay with them. To reconnect, they’d send a new request.</p>
      <div class="modal-actions"><button class="btn-outlined" id="cancelRm">Cancel</button><button class="btn" id="doRm" style="background:#CC2929">Remove client</button></div>`;
    $('scrim').classList.add('open');
    $('cancelRm').onclick = closeModal;
    $('doRm').onclick = () => { const arr = sc().clients; arr.splice(arr.indexOf(c), 1); st.recent = (st.recent || []).filter((x) => x !== c.id); closeModal(); goFirm('clients'); };
  }

  function renderDashboard() {
    const o = findOrg(st.orgId);
    const c = isClient(o.id) ? o : null;
    const kp = c && c.ledger
      ? [['Synced in October', c.books[0] === 'red' ? '1,204' : '2,318'], ['Failed syncs', c.books[0] === 'red' ? '3' : '0'], ['Unreconciled', c.books[1].includes('unreconciled') ? '12' : '0']]
      : [['Synced in October', '846'], ['Failed syncs', '0'], ['Unreconciled', '0']];
    if (c && !c.ledger) {
      return `<div class="ph"><div><h1>Dashboard</h1><div class="sub">${esc(o.name)}</div></div></div>
        <div class="empty"><span class="material-icons">link</span><h2>Connect a ledger</h2>
        <p>${esc(o.name)} has no accounting system connected, so nothing syncs yet.</p>
        <button class="btn" id="dashCta">Connect ledger</button>
        <button class="btn-text sec" id="dashSec">Back to ${esc(FIRM.name)}</button></div>`;
    }
    return `<div class="ph"><div><h1>Dashboard</h1><div class="sub">${esc(o.name)}</div></div></div>
      <div class="kpis">${kp.map(([l, v]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>`;
  }

  function renderCreateFirm() {
    return `<div class="ph"><div><h1>Create a Firm</h1></div></div>
      <div class="empty"><span class="material-icons">domain_add</span><h2>Work on your clients' books from one place</h2>
      <p>A Firm lets clients connect to you and gives your team one list of every client.</p>
      <button class="btn" id="cfCta">Create a Firm</button>
      <button class="btn-text sec" id="cfSec">Not now</button></div>`;
  }
  function renderCreateOrg() {
    return `<div class="ph"><div><h1>Create organization</h1></div></div>
      <div class="empty"><span class="material-icons">add_business</span><h2>New organization</h2>
      <p>Not built in this prototype. The new org would show up under My organizations.</p>
      <button class="btn" id="coCta">Back</button></div>`;
  }

  function renderMain() {
    let html;
    if (TOP_PAGES[st.page]) {
      html = placeholder(TOP_PAGES[st.page][1], st.ctx === 'firm' ? FIRM.name : findOrg(st.orgId).name);
    } else if (st.ctx === 'firm') {
      if (st.page === 'clients') html = renderClients();
      else if (st.page === 'client') html = renderClientDetail();
      else if (st.page === 'setup') html = renderClientSetup();
      else if (st.page === 'dashboard') html = renderFirmDashboard();
      else if (st.page === 'billing') html = renderBilling();
      else if (st.page === 'createorg') html = renderCreateOrg();
      else {
        const nav = FIRM_NAV.find((n) => n[0] === st.page);
        html = placeholder(nav ? nav[2] : st.page, FIRM.name);
      }
    } else {
      if (st.page === 'dashboard') html = renderDashboard();
      else if (st.page === 'createorg') html = renderCreateOrg();
      else html = placeholder(ORG_NAV.find((n) => n[0] === st.page)[2], findOrg(st.orgId).name);
    }
    $('main').innerHTML = html;
    const m = $('main');
    m.querySelectorAll('[data-detail]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); goFirm('client', b.dataset.detail); });
    m.querySelectorAll('[data-row]').forEach((tr) => tr.onclick = (e) => { if (!e.target.closest('button')) goFirm('client', tr.dataset.row); });
    m.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', (e) => e.stopPropagation()));
    if (st.ctx === 'firm' && st.page === 'client') bindClientDetail();
    m.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => goOrg(b.dataset.open));
    m.querySelectorAll('[data-setup]').forEach((b) => b.onclick = (e) => {
      e.stopPropagation();
      st.ctx = 'firm'; st.page = 'setup'; st.clientId = b.dataset.setup; st.setupStep = 'books'; save(); render();
    });
    m.querySelectorAll('[data-row]').forEach((tr) => {
      const c = findOrg(tr.dataset.row);
      if (c && !c.pending && !isSetup(c)) {
        // unset rows open setup instead of work details
        tr.onclick = (e) => {
          if (e.target.closest('button')) return;
          st.ctx = 'firm'; st.page = 'setup'; st.clientId = c.id; st.setupStep = 'books'; save(); render();
        };
      }
    });
    const s = $('clientSearch');
    if (s) s.oninput = () => { st._q = s.value; const pos = s.selectionStart; renderMain(); const n = $('clientSearch'); n.focus(); n.setSelectionRange(pos, pos); };
    const bind = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    bind('crumbBack', () => goFirm('clients'));
    bind('addClient', openAddClient);
    bind('emptyImport', () => { if (ob) ob.directoryReady = true; goOnboarding('import'); });
    bind('emptyLater', () => {});
    bind('dashCta', () => goOrg(st.orgId, 'settings'));
    bind('dashSec', () => goFirm('clients'));
    bind('dashGoClients', () => goFirm('clients'));
    bind('dashContinue', () => {
      const next = firmClients().find((c) => !isSetup(c));
      if (next) { st.ctx = 'firm'; st.page = 'setup'; st.clientId = next.id; st.setupStep = 'books'; save(); render(); }
      else goFirm('clients');
    });
    bind('setupHint', () => {
      const next = firmClients().find((c) => !isSetup(c));
      if (next) { st.ctx = 'firm'; st.page = 'setup'; st.clientId = next.id; st.setupStep = 'books'; save(); render(); }
    });
    bind('buyLic', () => { $('buyLic').textContent = 'Coming soon'; });
    bind('assignLic', () => { $('assignLic').textContent = 'Coming soon'; });
    m.querySelectorAll('[data-next]').forEach((b) => b.onclick = () => { st.setupStep = b.dataset.next; save(); renderMain(); });
    bind('setupBack', () => goFirm('clients'));
    bind('inviteOwner', () => { $('inviteOwner').textContent = 'Invite sent (stub)'; });
    bind('setupDone', () => {
      const c = findOrg(st.clientId);
      if (c) { c.setup = true; c.ledger = c.ledger || 'QuickBooks Online'; c.books = ['green', 'Healthy']; c.month = c.month || 'Oct 2026'; }
      goFirm('clients');
    });
    bind('coCta', () => { if (st.ctx === 'firm') goFirm('clients'); else goOrg(st.orgId, 'dashboard'); });
    const t = st.ctx === 'firm' ? (st.page === 'client' ? findOrg(st.clientId).name : FIRM.name) : findOrg(st.orgId).name;
    document.title = t + ' — Synder (Firm context switcher)';
  }

  /* ───────── Switcher popover ───────── */
  function popOpen() { return $('pop').classList.contains('open'); }
  function openPop() {
    $('pop').classList.add('open'); $('ctxTrigger').setAttribute('aria-expanded', 'true');
    $('popSearch').value = ''; kbIndex = -1; renderPop();
    const total = sc().clients.length + sc().own.length + (sc().firm ? 1 : 0);
    $('popSearchWrap').style.display = total > 5 ? '' : 'none';
    setTimeout(() => { if (total > 5) $('popSearch').focus(); else { kbIndex = 0; highlight(); } }, 0);
  }
  function closePop() { $('pop').classList.remove('open'); $('ctxTrigger').setAttribute('aria-expanded', 'false'); }

  function item(o, cap, current, action) {
    return `<button class="pop-item" data-act="${action}">${av(o, true)}<span class="t"><span class="n">${esc(o.name)}</span>${cap ? `<span class="c">${esc(cap)}</span>` : ''}</span>${current ? '<span class="material-icons check">check</span>' : ''}</button>`;
  }
  function renderPop() {
    const s = sc(); const q = $('popSearch').value.trim().toLowerCase();
    let html = '';
    if (s.firm && (!q || FIRM.name.toLowerCase().includes(q) || 'firm'.includes(q))) {
      html += `<div class="pop-sec">Firm</div>` + item(FIRM, 'Accounting firm', st.ctx === 'firm', 'firm');
    }
    if (s.firm) {
      const list = s.clients.filter((c) => !c.pending && (!q || c.name.toLowerCase().includes(q)));
      if (list.length) {
        html += `<div class="pop-sec">Clients</div>` +
          list.map((c) => item(c, null, st.ctx === 'org' && st.orgId === c.id, 'org:' + c.id)).join('');
      }
    }
    const own = s.own.filter((o) => !q || o.name.toLowerCase().includes(q));
    if (own.length) {
      html += `<div class="pop-sec">My organizations</div>` + own.map((o) => item(o, null, st.ctx === 'org' && st.orgId === o.id, 'org:' + o.id)).join('');
    }
    if (!html) html = `<div class="pop-empty">Nothing matches “${esc(q)}”.</div>`;
    $('popList').innerHTML = html;
    $('popFoot').innerHTML =
      `<button data-act="createorg"><span class="material-icons">add</span>Create organization</button>` +
      '';
    $('pop').querySelectorAll('[data-act]').forEach((b) => b.onclick = () => act(b.dataset.act));
  }
  function act(a) {
    closePop();
    if (a === 'firm') goFirm(setupCount() > 0 ? 'dashboard' : 'clients');
    else if (a === 'allclients') { st._q = ''; goFirm('clients'); }
    else if (a.startsWith('org:')) goOrg(a.slice(4));
    else if (a === 'createorg') { st.page = 'createorg'; save(); render(); }
    else if (a === 'createfirm') { st.ctx = 'org'; st.page = 'createfirm'; save(); render(); }
    $('ctxTrigger').focus();
  }
  function focusables() { return Array.from($('pop').querySelectorAll('[data-act]')); }
  function highlight() {
    const f = focusables(); f.forEach((el, i) => el.classList.toggle('kb', i === kbIndex));
    if (f[kbIndex]) f[kbIndex].scrollIntoView({ block: 'nearest' });
  }

  $('ctxTrigger').onclick = () => popOpen() ? closePop() : openPop();
  $('popSearch').oninput = () => { kbIndex = 0; renderPop(); highlight(); };
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); popOpen() ? closePop() : openPop(); return; }
    if ($('scrim').classList.contains('open') && e.key === 'Escape') { closeModal(); return; }
    if (!popOpen()) return;
    const f = focusables();
    if (e.key === 'Escape') { closePop(); $('ctxTrigger').focus(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); kbIndex = Math.min(f.length - 1, kbIndex + 1); highlight(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); kbIndex = Math.max(0, kbIndex - 1); highlight(); }
    else if (e.key === 'Enter' && f[kbIndex]) { e.preventDefault(); act(f[kbIndex].dataset.act); }
  });
  document.addEventListener('mousedown', (e) => {
    if (popOpen() && !e.target.closest('.ctx')) closePop();
  });

  /* ───────── Add client modal ───────── */
  function openAddClient() {
    $('modal').innerHTML = `<h3>Add client</h3>
      <p>Clients connect to your firm from their side. Share your Firm ID, then approve their request here in Clients.</p>
      <div class="idrow"><input type="text" readonly value="${FIRM.firmId}" aria-label="Firm ID" /><button class="btn-outlined" id="copyId">Copy</button></div>
      <div class="modal-actions"><button class="btn" id="doneModal">Done</button></div>`;
    $('scrim').classList.add('open');
    $('copyId').onclick = () => { try { navigator.clipboard.writeText(FIRM.firmId); } catch (e) {} $('copyId').textContent = 'Copied'; };
    $('doneModal').onclick = closeModal;
  }
  function closeModal() { $('scrim').classList.remove('open'); }
  $('scrim').onclick = (e) => { if (e.target === $('scrim')) closeModal(); };

  /* ───────── Scenario / mode ───────── */
  function setScenario(s, fromCta) {
    const raw = String(s || '');
    const parts = raw.split('/');
    const head = parts[0];
    if (head === 'onboarding') {
      loadOb();
      if (parts[1]) ob.step = parts[1];
      goOnboarding(ob.step || 'role');
      return;
    }
    scenario = SCENARIOS[head] ? head : 'firm';
    load();
    if (parts[1] === 'setup' && parts[2] && findOrg(parts[2])) {
      st.ctx = 'firm'; st.page = 'setup'; st.clientId = parts[2]; st.setupStep = parts[3] || 'books';
    } else if (parts[1] && sc().firm && findOrg(parts[1]) && isClient(parts[1])) {
      st.ctx = 'firm'; st.page = 'client'; st.clientId = parts[1]; st.tab = 'work';
    }
    if (fromCta) { st = defaultState(); save(); }
    mode = 'firm';
    document.body.classList.remove('shell-hide');
    closePop(); render();
  }
  window.addEventListener('hashchange', () => setScenario(location.hash.slice(1)));

  function render() {
    if (mode === 'onboarding') { renderMode(); renderOb(); return; }
    renderTrigger(); renderNav(); renderMain(); renderUserMenu();
    renderMode();
    document.querySelectorAll('#stateSeg button').forEach((b) => b.classList.toggle('active', b.dataset.cs === cdState));
    let h = '#' + scenario;
    if (st.ctx === 'firm' && st.page === 'setup' && st.clientId) h += '/setup/' + st.clientId;
    else if (st.ctx === 'firm' && st.page === 'client' && st.clientId) h += '/' + st.clientId;
    if (location.hash !== h) history.replaceState(null, '', h);
  }
  document.querySelectorAll('#stateSeg button').forEach((b) => b.onclick = () => { cdState = b.dataset.cs; render(); });
  document.querySelectorAll('#modeSeg button').forEach((b) => b.onclick = () => {
    if (b.dataset.m === 'onboarding') restartOnboarding();
    else goWorkspace(setupCount() > 0 ? 'dashboard' : 'clients');
  });

  /* ───────── Top bar menus ───────── */
  function goTop(page) { closeMenus(); st.page = page; st.clientId = null; save(); render(); }
  function renderUserMenu() {
    const items = [];
    if (sc().firm) items.push(['myfirm', 'domain', 'My firm']);
    items.push(['orgsettings', 'tune', 'Organization settings'], ['activity', 'history', 'Activity log'],
      ['profile', 'person_outline', 'User profile'], ['orglist', 'list', 'List of organizations']);
    $('userMenu').innerHTML = `<div class="who"><b>Ignat Plot</b><span>ignat@wlslabs.com</span></div>` +
      items.map(([k, ic, l]) => `<button data-um="${k}"><span class="material-icons">${ic}</span>${l}</button>`).join('') +
      `<div class="div"></div><button data-um="logout"><span class="material-icons">logout</span>Log out</button>`;
    $('userMenu').querySelectorAll('[data-um]').forEach((b) => b.onclick = () => {
      const k = b.dataset.um;
      if (k === 'myfirm') { closeMenus(); goFirm(setupCount() > 0 ? 'dashboard' : 'clients'); }
      else if (k === 'logout') { closeMenus(); openLogout(); }
      else goTop(k);
    });
  }
  function openLogout() {
    $('modal').innerHTML = `<h3>Log out</h3><p>This prototype keeps you signed in, so you can keep exploring.</p>
      <div class="modal-actions"><button class="btn" id="doneModal">OK</button></div>`;
    $('scrim').classList.add('open'); $('doneModal').onclick = closeModal;
  }
  function closeMenus() {
    const mm = $('moreMenu'); if (mm) { mm.classList.remove('open'); $('moreBtn').setAttribute('aria-expanded', 'false'); }
    ['helpMenu', 'userMenu'].forEach((id) => $(id).classList.remove('open'));
    ['helpBtn', 'userBtn'].forEach((id) => $(id).setAttribute('aria-expanded', 'false'));
  }
  function toggleMenu(btn, menu) {
    const open = !$(menu).classList.contains('open'); closeMenus(); closePop();
    if (open) { $(menu).classList.add('open'); $(btn).setAttribute('aria-expanded', 'true'); }
  }
  $('helpBtn').onclick = () => toggleMenu('helpBtn', 'helpMenu');
  $('userBtn').onclick = () => toggleMenu('userBtn', 'userMenu');
  document.querySelectorAll('[data-top]').forEach((b) => b.onclick = () => goTop(b.dataset.top));
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('.t-wrap')) closeMenus(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });

  $('kbdHint').textContent = isMac ? '⌘K' : 'Ctrl K';
  loadOb();
  restoreDirectory();
  const boot = (location.hash || '#firm').slice(1);
  if (boot.split('/')[0] === 'onboarding' || (!localStorage.getItem('fcs-ob-v1') && boot.split('/')[0] !== 'firm')) {
    // Prefer explicit hash; otherwise stay on firm workspace for this prototype
  }
  setScenario(boot || 'firm');
})();
</script>
</body>
</html>
