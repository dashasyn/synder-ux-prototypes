<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joy sparkles — Synder UX prototype</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --blue: #0053cc;
      --blue-hover: #0042a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
    }

    /* Dark top variant bar — name + variants only (no online/offline) */
    .proto-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: #111827;
      color: #f9fafb;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
    }
    .proto-bar .brand {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0.9;
    }
    .proto-bar .variants {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .proto-bar .tab {
      background: #0053cc;
      border: 1px solid transparent;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: default;
    }

    .stage {
      min-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      max-width: 36ch;
    }

    .burst-btn {
      position: relative;
      appearance: none;
      border: none;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 83, 204, 0.25);
      transition: background 0.15s ease, transform 0.12s ease;
    }
    .burst-btn:hover { background: var(--blue-hover); }
    .burst-btn:active { transform: scale(0.97); }
    .burst-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    /* Sparkle burst layer — pointer-events none so clicks pass through */
    .spark-burst {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 30;
    }
    .spark {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--size, 8px);
      height: var(--size, 8px);
      margin: calc(var(--size, 8px) / -2) 0 0 calc(var(--size, 8px) / -2);
      background: var(--color, #ffd166);
      border-radius: 2px;
      opacity: 0;
      transform: translate(0, 0) rotate(0deg) scale(0.4);
      animation: spark-fly var(--dur, 1s) var(--delay, 0ms) ease-out forwards;
      will-change: transform, opacity;
    }
    .spark.star {
      background: transparent;
      box-shadow: none;
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%,
        79% 91%, 50% 70%, 21% 91%, 32% 57%,
        2% 35%, 39% 35%
      );
      background: var(--color, #ffd166);
    }
    .spark.dot {
      border-radius: 50%;
    }
    .spark.diamond {
      border-radius: 2px;
      transform: translate(0, 0) rotate(45deg) scale(0.4);
      animation-name: spark-fly-diamond;
    }

    @keyframes spark-fly {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg) scale(0.35);
      }
      12% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 0.18), calc(var(--dy) * 0.18)) rotate(40deg) scale(1.05);
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) rotate(180deg) scale(0.2);
      }
    }
    @keyframes spark-fly-diamond {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(45deg) scale(0.35);
      }
      12% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 0.18), calc(var(--dy) * 0.18)) rotate(70deg) scale(1.05);
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) rotate(200deg) scale(0.2);
      }
    }

    /* Reduced motion: soft button flash, no particles */
    @media (prefers-reduced-motion: reduce) {
      .burst-btn { transition: none; }
      .burst-btn.flash {
        animation: btn-flash 0.45s ease;
      }
      @keyframes btn-flash {
        0%, 100% { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
        40% { box-shadow: 0 0 0 6px rgba(0, 83, 204, 0.28), 0 0 24px rgba(255, 209, 102, 0.55); }
      }
      .spark { animation: none !important; display: none !important; }
    }
  </style>
</head>
<body>
  <div class="proto-bar" role="banner">
    <span class="brand">Joy sparkles</span>
    <div class="variants" role="tablist" aria-label="Prototype variants">
      <span class="tab" role="tab" aria-selected="true">Burst</span>
    </div>
  </div>

  <main class="stage">
    <button type="button" class="burst-btn" id="burstBtn" aria-describedby="hint">
      Celebrate
    </button>
    <p class="hint" id="hint">Click for a short CSS sparkle burst (~1s). No Lottie — pure CSS + a few lines of JS.</p>
  </main>

  <script>
    (function () {
      var btn = document.getElementById("burstBtn");
      var stage = document.querySelector(".stage");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var COLORS = ["#FFD166", "#EF476F", "#06D6A0", "#118AB2", "#F4A261", "#E9C46A", "#FFFFFF", "#90E0EF"];
      var SHAPES = ["star", "dot", "diamond"];
      var COUNT = 28;
      var DURATION_MS = 1000;

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function burst(clientX, clientY) {
        if (reduce) {
          btn.classList.remove("flash");
          void btn.offsetWidth;
          btn.classList.add("flash");
          return;
        }

        var rect = stage.getBoundingClientRect();
        var originX = clientX - rect.left;
        var originY = clientY - rect.top;

        var layer = document.createElement("div");
        layer.className = "spark-burst";
        layer.style.left = originX + "px";
        layer.style.top = originY + "px";
        layer.setAttribute("aria-hidden", "true");

        for (var i = 0; i < COUNT; i++) {
          var el = document.createElement("span");
          var angle = (Math.PI * 2 * i) / COUNT + rand(-0.2, 0.2);
          var dist = rand(48, 130);
          var size = rand(5, 12);
          var shape = SHAPES[i % SHAPES.length];
          el.className = "spark " + shape;
          el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
          el.style.setProperty("--dy", Math.sin(angle) * dist + "px");
          el.style.setProperty("--size", size + "px");
          el.style.setProperty("--color", COLORS[i % COLORS.length]);
          el.style.setProperty("--delay", Math.round(rand(0, 80)) + "ms");
          el.style.setProperty("--dur", rand(0.85, 1.15) + "s");
          layer.appendChild(el);
        }

        stage.appendChild(layer);
        window.setTimeout(function () {
          if (layer.parentNode) layer.parentNode.removeChild(layer);
        }, DURATION_MS + 200);
      }

      btn.addEventListener("click", function (e) {
        var r = btn.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2);
      });
    })();
  </script>
</body>
</html>
