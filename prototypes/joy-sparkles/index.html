<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joy sparkles — Synder UX prototype</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --blue: #0053cc;
      --blue-hover: #0042a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
    }

    /* Dark top variant bar — name + variants only (no online/offline) */
    .proto-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: #111827;
      color: #f9fafb;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
    }
    .proto-bar .brand {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0.9;
    }
    .proto-bar .variants {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .proto-bar .tab {
      background: #0053cc;
      border: 1px solid transparent;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: default;
    }

    .stage {
      min-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 20px;
      position: relative;
    }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      max-width: 40ch;
    }

    .burst-btn {
      position: relative;
      appearance: none;
      border: none;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 83, 204, 0.25);
      transition: background 0.15s ease, transform 0.12s ease;
    }
    .burst-btn:hover { background: var(--blue-hover); }
    .burst-btn:active { transform: scale(0.97); }
    .burst-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    /* Full-viewport fall layer */
    .spark-fall {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      overflow: hidden;
    }
    .spark {
      position: absolute;
      left: var(--x, 50%);
      top: var(--y, -12px);
      width: var(--size, 8px);
      height: var(--size, 8px);
      margin-left: calc(var(--size, 8px) / -2);
      background: var(--color, #ffd166);
      border-radius: 2px;
      opacity: 0;
      transform: translate(0, 0) rotate(0deg);
      /* ease-in = gravity-ish acceleration while falling */
      animation: spark-fall var(--dur, 1.1s) var(--delay, 0ms) cubic-bezier(0.33, 0, 0.67, 0.4) forwards;
      will-change: transform, opacity;
    }
    .spark.star {
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%,
        79% 91%, 50% 70%, 21% 91%, 32% 57%,
        2% 35%, 39% 35%
      );
    }
    .spark.dot { border-radius: 50%; }
    .spark.diamond {
      border-radius: 2px;
      animation-name: spark-fall-diamond;
    }

    @keyframes spark-fall {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg) scale(0.6);
      }
      8% {
        opacity: 1;
        transform: translate(calc(var(--drift) * 0.1), 0) rotate(20deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--drift), var(--fall)) rotate(var(--spin)) scale(0.75);
      }
    }
    @keyframes spark-fall-diamond {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(45deg) scale(0.6);
      }
      8% {
        opacity: 1;
        transform: translate(calc(var(--drift) * 0.1), 0) rotate(55deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--drift), var(--fall)) rotate(calc(45deg + var(--spin))) scale(0.75);
      }
    }

    /* Reduced motion: soft button flash, no particles */
    @media (prefers-reduced-motion: reduce) {
      .burst-btn { transition: none; }
      .burst-btn.flash {
        animation: btn-flash 0.45s ease;
      }
      @keyframes btn-flash {
        0%, 100% { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
        40% { box-shadow: 0 0 0 6px rgba(0, 83, 204, 0.28), 0 0 24px rgba(255, 209, 102, 0.55); }
      }
      .spark { animation: none !important; display: none !important; }
    }
  </style>
</head>
<body>
  <div class="proto-bar" role="banner">
    <span class="brand">Joy sparkles</span>
    <div class="variants" role="tablist" aria-label="Prototype variants">
      <span class="tab" role="tab" aria-selected="true">Fall</span>
    </div>
  </div>

  <main class="stage">
    <button type="button" class="burst-btn" id="burstBtn" aria-describedby="hint">
      Celebrate
    </button>
    <p class="hint" id="hint">Click to drop sparkles from the top — they fall and fade out. No Lottie — pure CSS + a few lines of JS.</p>
  </main>

  <script>
    (function () {
      var btn = document.getElementById("burstBtn");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var COLORS = ["#FFD166", "#EF476F", "#06D6A0", "#118AB2", "#F4A261", "#E9C46A", "#FFFFFF", "#90E0EF"];
      var SHAPES = ["star", "dot", "diamond"];
      var COUNT = 36;
      var DURATION_MS = 1400;

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function rain() {
        if (reduce) {
          btn.classList.remove("flash");
          void btn.offsetWidth;
          btn.classList.add("flash");
          return;
        }

        var layer = document.createElement("div");
        layer.className = "spark-fall";
        layer.setAttribute("aria-hidden", "true");

        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var maxDelay = 0;

        for (var i = 0; i < COUNT; i++) {
          var el = document.createElement("span");
          var size = rand(5, 12);
          var shape = SHAPES[i % SHAPES.length];
          var delay = Math.round(rand(0, 220));
          var dur = rand(0.95, 1.35);
          maxDelay = Math.max(maxDelay, delay + dur * 1000);

          el.className = "spark " + shape;
          el.style.setProperty("--x", rand(4, 96) + "%");
          el.style.setProperty("--y", rand(-18, 28) + "px");
          el.style.setProperty("--fall", rand(vh * 0.55, vh * 0.92) + "px");
          el.style.setProperty("--drift", rand(-48, 48) + "px");
          el.style.setProperty("--spin", Math.round(rand(120, 320)) + "deg");
          el.style.setProperty("--size", size + "px");
          el.style.setProperty("--color", COLORS[i % COLORS.length]);
          el.style.setProperty("--delay", delay + "ms");
          el.style.setProperty("--dur", dur + "s");
          layer.appendChild(el);
        }

        document.body.appendChild(layer);
        window.setTimeout(function () {
          if (layer.parentNode) layer.parentNode.removeChild(layer);
        }, maxDelay + 80);
      }

      btn.addEventListener("click", function () {
        rain();
      });
    })();
  </script>
</body>
</html>
