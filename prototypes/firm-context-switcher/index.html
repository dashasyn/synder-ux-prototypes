  <title>Firm context switcher — Synder</title>
  <!--
    v4: restructured firm-side Client details (Work/Profile/Billing/Firm colleagues), dev state toggle, pending client page. Deep link: #firm/c3
    Firm context switcher v2 (Ignat, Nov 4 2026): live top bar (Balance, How it works?, bell, help, user menu with My firm on top)
    - One context switcher top-left of the sidebar (replaces firm section + "CLIENT WORKSPACE" org dropdown).
    - One sidebar; contents swap fully per context (Firm nav vs Org nav). No top tabs.
    - v10: practice or business first, then practice sign-up, Clients home, import, optional pre-assessment. No firm dashboard in this experiment.
    - v8: explicit role choice, neutral Create/Join, full client switcher, left-aligned directory welcome.
    - v7: portrait role and firm cards, client-directory welcome, then a simulated QuickBooks / Xero / CSV import. Firm user only.
    - v6: firm onboarding (#onboarding), client list import, firm Dashboard + setup progress. Firm user only.
    - Ctrl/Cmd+K opens the switcher; arrows + Enter + Esc work inside.
    - Last context remembered per scenario in localStorage.
  -->

:root { --proto-bar-h: 48px; }
* { box-sizing: border-box; }

.seg button {

/* Falling sparkles — exact styles from prototypes/joy-sparkles/index.html */
.spark-fall {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      overflow: hidden;
    }
.spark {
      position: absolute;
      left: var(--x, 50%);
      top: var(--y, -12px);
      width: var(--size, 8px);
      height: var(--size, 8px);
      margin-left: calc(var(--size, 8px) / -2);
      background: var(--color, #ffd166);
      border-radius: 2px;
      opacity: 0;
      transform: translate(0, 0) rotate(0deg);
      animation: spark-fall var(--dur, 0.9s) var(--delay, 0ms) cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      will-change: transform, opacity;
    }
.spark.star {
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%,
        79% 91%, 50% 70%, 21% 91%, 32% 57%,
        2% 35%, 39% 35%
      );
    }
.spark.dot { border-radius: 50%; }
.spark.diamond {
      border-radius: 2px;
      animation-name: spark-fall-diamond;
    }
@keyframes spark-fall {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg) scale(0.6);
      }
8% {
        opacity: 1;
        transform: translate(calc(var(--drift) * 0.1), 0) rotate(20deg) scale(1);
      }
100% {
        opacity: 0;
        transform: translate(var(--drift), var(--fall)) rotate(var(--spin)) scale(0.75);
      }
}
@keyframes spark-fall-diamond {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(45deg) scale(0.6);
      }
8% {
        opacity: 1;
        transform: translate(calc(var(--drift) * 0.1), 0) rotate(55deg) scale(1);
      }
100% {
        opacity: 0;
        transform: translate(var(--drift), var(--fall)) rotate(calc(45deg + var(--spin))) scale(0.75);
      }
}
@media (prefers-reduced-motion: reduce) {
      .spark { animation: none !important; display: none !important; }
}

<script>
(function () {
  /* ───────── Data ───────── */
  const FIRM = { id: 'firm', name: 'WLS Labs', firmId: '1793300370' };
  const CLIENTS = [
    { id: 'c1',  name: 'Bluebird Bakery',          ledger: 'QuickBooks Online', pay: 'Stripe, Square',  books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c2',  name: 'Cedar & Pine Interiors',   ledger: 'Xero',              pay: 'Shopify, PayPal', books: ['yellow', '6 uncategorized'],   month: 'Oct 2026', setup: true },
    { id: 'c3',  name: 'Delta Freight LLC',        ledger: 'QuickBooks Online', pay: 'Stripe',          books: ['red', '3 failed syncs'],       month: 'Sep 2026', setup: true },
    { id: 'c4',  name: 'Evergreen Landscaping',    ledger: 'QuickBooks Online', pay: 'Square',          books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c5',  name: 'Fable Coffee Roasters',    ledger: 'Xero',              pay: 'Shopify',         books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c6',  name: 'Granite Peak Dental',      ledger: null,                pay: null,              books: ['grey', 'Not set up'],          month: null, setup: false },
    { id: 'c7',  name: 'Harbor Street Books',      ledger: 'QuickBooks Online', pay: 'Amazon, Shopify', books: ['yellow', 'Needs review'],       month: 'Oct 2026', setup: true },
    { id: 'c8',  name: 'Ironwood Fitness',         ledger: 'QuickBooks Online', pay: 'Stripe',          books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c9',  name: 'Juniper Yoga Studio',      ledger: null,                pay: 'Stripe',          books: ['grey', 'Not set up'],          month: null, setup: false },
    { id: 'c10', name: 'Kestrel Analytics',        ledger: 'Xero',              pay: 'Stripe',          books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c11', name: 'Lumen Dental Lab',         ledger: 'QuickBooks Online', pay: 'PayPal',          books: ['green', 'Healthy'],            month: 'Oct 2026', setup: true },
    { id: 'c12', name: 'Maple & Main Florist',     ledger: 'QuickBooks Online', pay: 'Square',          books: ['yellow', '4 uncategorized'],   month: 'Oct 2026', setup: true },
    { id: 'c13', name: 'Northgate Auto Repair',    ledger: null,                pay: null,              books: ['grey', 'Not set up'],          month: null, setup: false }
  ];
  const SCENARIOS = {
    'firm':   { firm: true,  clients: [], own: [] },
  };
  const FIRM_NAV = [
    ['clients', 'people', 'Clients'],
    ['monitoring', 'monitor_heart', 'Monitoring'],
    ['monthclose', 'event_note', 'Month close'],
    ['colleagues', 'groups', 'Colleagues'],
    ['billing', 'receipt_long', 'Billing and licenses'],
    ['firmsettings', 'settings', 'Firm settings']
  ];
  const ORG_NAV = [
    ['dashboard', 'dashboard', 'Dashboard'], ['mapping', 'account_tree', 'Mapping'],
    ['summaries', 'summarize', 'Summaries'], ['reconciliation', 'fact_check', 'Reconciliation'],
    ['products', 'inventory_2', 'Products and services'], ['analytics', 'insights', 'Analytics'],
    ['revrec', 'timeline', 'Revenue recognition'], ['settings', 'settings', 'Settings']
  ];
  const TOP_PAGES = {
    how: ['live_help', 'How it works?'], notifications: ['notifications_none', 'Notifications'],
    helpcenter: ['menu_book', 'Help center'], support: ['chat_bubble_outline', 'Contact support'],
    orgsettings: ['tune', 'Organization settings'], activity: ['history', 'Activity log'],
    profile: ['person_outline', 'User profile'], orglist: ['list', 'List of organizations']
  };
  /* ───────── State ───────── */
  let scenario = 'firm';
  let st = null;          // { ctx: 'firm'|'org', orgId, page, clientId, recent: [] }
  let kbIndex = -1;
  let celebrateOnClients = false;
  const SHOW_STORY = false; /* Parked: set true to bring back the How Synder works overlay. */
  let booksToken = 0;

  const $ = (id) => document.getElementById(id);
  function fieldError(input, msg) {
    if (!input) return;
    input.classList.add('error');
    input.setAttribute('aria-invalid', 'true');
    const box = input.closest('.form-field') || input.parentElement;
    let err = box.querySelector('.form-error-msg');
    if (!err) {
      err = document.createElement('p');
      err.className = 'form-error-msg';
      box.appendChild(err);
    }
    err.hidden = false;
    err.textContent = msg || 'Required';
  }
  function fieldClear(input) {
    if (!input) return;
    input.classList.remove('error');
    input.removeAttribute('aria-invalid');
    const box = input.closest('.form-field') || input.parentElement;
    const err = box && box.querySelector('.form-error-msg');
    if (err) err.hidden = true;
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const initials = (n) => n.replace(/&/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const av = (o, sm) => `<span class="avatar${sm ? ' avatar-sm' : ''}">${initials(o.name)}</span>`;

  /* ───────── v7: Onboarding ─────────
     Import sources are simulated design proposals. No OAuth, sign-in, or live books.
     QuickBooks sample = customers on the firm's own QuickBooks company.
  */
  const EXTRA = [
    { id: 'c15', name: 'Pinecrest Realty' },
    { id: 'c16', name: 'Quill & Ink Agency' },
    { id: 'c17', name: 'Riverbend Cafe' },
    { id: 'c18', name: 'Summit Peak Advisors' },
    { id: 'c19', name: 'Tidewater Outfitters' }
  ];
  const FORMER_IDS = new Set(EXTRA.map((c) => c.id));
  const IMPORT_POOL = CLIENTS.concat(EXTRA).map((c) => ({ id: c.id, name: c.name, former: FORMER_IDS.has(c.id) }));
  const SETUP_STEPS = [
    ['books', 'Connect books'],
    ['integrations', 'Connect integrations'],
    ['mode', 'Select mode'],
    ['import', 'Import data']
  ];

  let mode = 'firm'; // 'onboarding' | 'firm'
  let clientVariant = 'v1';
  (function readClientVariant() {
    const q = new URL(location.href).searchParams.get('client');
    if (q === 'v1' || q === 'v2') clientVariant = q;
    else {
      try {
        const saved = localStorage.getItem('fcs-client-variant');
        if (saved === 'v1' || saved === 'v2') clientVariant = saved;
      } catch (e) {}
    }
  })();
  function writeLocation(hash, push) {
    const url = new URL(location.href);
    url.searchParams.delete('btn');
    url.searchParams.set('client', clientVariant === 'v2' ? 'v2' : 'v1');
    if (typeof st !== 'undefined' && st && st.page === 'clientdetail' && st.v2Fix) url.searchParams.set('month', workYearNum() + '-' + String(workMonthNum()).padStart(2, '0'));
    else url.searchParams.delete('month');
    const next = url.pathname + url.search + (hash || '');
    if (location.pathname + location.search + location.hash === next) return;
    if (push) history.pushState(null, '', next);
    else history.replaceState(null, '', next);
  }
  let ob = null;
  let obHashStep = null;

  function defaultOb() {
    return {
      step: 'home', variant: 'new', use: null, useChosen: false, marketplace: false, loginFrom: '', firmBooks: '',
      role: null, roleChosen: false, roleNote: '', otherOpen: false,
      firmChoice: null, firmChosen: false, source: null, firmName: '', firmTouched: false,
      connectedName: '', directoryReady: false, banner: '', pendingEntries: [], nameFrom: 'import',
      selected: Object.fromEntries(IMPORT_POOL.map((c) => [c.id, true])),
      q: '', manual: [], manualMsg: '', setupStep: 'books', setupClientId: null,
      storySeen: false, storyPending: false,
      welcomeSeen: false, welcomePending: false
    };
  }
  function loadOb() {
    try {
      const raw = localStorage.getItem('fcs-ob-v10');
      if (raw) {
        const v = JSON.parse(raw);
        if (v && v.step) {
          ob = Object.assign(defaultOb(), v);
          if (!Array.isArray(ob.manual)) ob.manual = [];
          IMPORT_POOL.forEach((c) => { if (typeof ob.selected[c.id] !== 'boolean') ob.selected[c.id] = true; });
          if (!v.roleChosen) ob.role = null;
          if (!v.firmChosen) ob.firmChoice = null;
          return;
        }
      }
    } catch (e) {}
    ob = defaultOb();
  }
  function saveOb() { try { localStorage.setItem('fcs-ob-v10', JSON.stringify(ob)); } catch (e) {} }

  function isSetup(c) { return !!(c && c.setup); }
  function firmClients() { return sc().clients.filter((c) => !c.pending); }
  function setupCount() { return firmClients().filter(isSetup).length; }

  function goOnboarding(step) {
    mode = 'onboarding';
    if (step) ob.step = step;
    saveOb();
    document.body.classList.add('shell-hide');
    renderMode();
    renderOb();
  }
  function persistDirectory() {
    try {
      localStorage.setItem('fcs-dir-v10', JSON.stringify({
        ready: !!(ob && ob.directoryReady),
        name: FIRM.name,
        clients: SCENARIOS.firm.clients
      }));
    } catch (e) {}
  }
  function firmOwnOrg() {
    return [{ id: 'o1', name: 'WLS Labs Books' }];
  }
  function applyOwnOrg() {
    SCENARIOS.firm.own = (ob && ob.variant === 'existing') ? firmOwnOrg() : [];
  }
  function restoreDirectory() {
    try {
      const raw = localStorage.getItem('fcs-dir-v10');
      if (!raw) return;
      const v = JSON.parse(raw);
      if (v && v.ready && Array.isArray(v.clients)) {
        SCENARIOS.firm.clients = v.clients;
        if (v.name) FIRM.name = v.name;
        if (ob) ob.directoryReady = true;
      }
    } catch (e) {}
    applyOwnOrg();
  }
  function goWorkspace(page, clientId) {
    mode = 'firm';
    document.body.classList.remove('shell-hide');
    if (!(ob && ob.directoryReady)) {
      SCENARIOS.firm.clients = [];
      applyOwnOrg();

  function bindOb() {
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    const backMap = {
      login: 'signup',
      import: 'signup', add: 'import', sources: 'import',
      firmname: 'signup', review: 'sources', connecting: 'sources'
    };
    on('obBack', () => {
      readFirmName();
      if (ob.step === 'login' && ob.loginFrom === 'role') return;
      if (ob.step === 'firmname') { goOnboarding(ob.nameFrom || 'import'); return; }
      if (ob.step === 'login') { goOnboarding(ob.loginFrom === 'home' ? 'home' : 'signup'); return; }
      const dest = backMap[ob.step];
      if (!dest || dest === 'entry') return;
      goOnboarding(dest);
    });
    ['suName', 'suEmail', 'suPass', 'suFirm'].forEach((id) => {
      const el = $(id);
      if (!el) return;
      el.oninput = () => {
        fieldClear(el);
        if (id === 'suName') ob.userName = el.value;
        if (id === 'suEmail') ob.userEmail = el.value;
        if (id === 'suPass') ob.demoPass = el.value;
        if (id === 'suFirm') ob.firmName = el.value;
      };
    });
    on('obSignup', () => {
      const name = $('suName'), email = $('suEmail'), pass = $('suPass'), firm = $('suFirm');
      let bad = false;
      [name, email, pass, firm].forEach((el) => fieldClear(el));
      if (!name || !name.value.trim()) { fieldError(name, 'Required'); bad = true; }
      if (!email || !email.value.trim()) { fieldError(email, 'Required'); bad = true; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { fieldError(email, 'Enter a valid email'); bad = true; }
      if (!pass || !pass.value) { fieldError(pass, 'Required'); bad = true; }
      else if (pass.value.length < 8) { fieldError(pass, 'Use at least 8 characters'); bad = true; }
      if (!firm || !firm.value.trim()) { fieldError(firm, 'Required'); bad = true; }
      if (bad) return;
      ob.userName = name.value.trim();
      ob.userEmail = email.value.trim();
      ob.demoPass = pass.value;
      ob.firmName = firm.value.trim();
      ob.firmTouched = true;
      ob.marketplace = false;
      ob.use = 'practice';
      ob.useChosen = true;
      enterNewFirm();
    });
    on('obLogin', () => {
      ob.loginFrom = 'signup';
      ob.variant = 'existing';
      if (!ob.firmName) ob.firmName = 'WLS Labs';
      goOnboarding('login');
    });
    on('homeSignup', () => goOnboarding('entry'));
    on('homeLogin', () => { ob.loginFrom = 'home'; goOnboarding('login'); });
    const loginReady = () => {
      fieldClear($('liEmail'));
      fieldClear($('liPass'));
    };
    ['liEmail', 'liPass'].forEach((id) => { const el = $(id); if (el) el.oninput = loginReady; });
    on('liSubmit', () => {
      const e = $('liEmail'), p = $('liPass');
      let bad = false;
      fieldClear(e); fieldClear(p);
      if (!e || !e.value.trim()) { fieldError(e, 'Required'); bad = true; }
      if (!p || !p.value) { fieldError(p, 'Required'); bad = true; }
      if (bad) return;
      ob.userEmail = e.value.trim();
      finishExistingLogin();
    });
    on('liSignup', () => {
      ob.variant = 'new';
      saveOb();
      goOnboarding('signup');
    });
    document.querySelectorAll('.kit-choice[data-use]').forEach((card) => card.onclick = () => {
      const use = card.dataset.use;
      if (use !== 'practice' && use !== 'business') return;
      ob.use = use;
      ob.useChosen = true;
      if (use === 'business') {
        ob.loginFrom = 'role';
        ob.userEmail = 'ignat@wlslabs.com';
        ob.demoPass = 'Bookkeeping1';
        saveOb();
        goOnboarding('login');
        return;
      }
      saveOb();
      goOnboarding('signup');
    });
    document.querySelectorAll('[data-social]').forEach((b) => b.onclick = (e) => {
      e.stopPropagation();
      finishExistingLogin();
    });
    const showDemo = () => {
      let modal = document.getElementById('demoModal');
      if (modal) modal.remove();
      modal = document.createElement('div');
      modal.id = 'demoModal';
      modal.className = 'modal-bg show';
      modal.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="demoTitle"><div class="modal-header" id="demoTitle">Book a demo</div><div class="modal-body"><p class="text-body2">Thanks. A Synder specialist will email you to set a time.</p></div><div class="modal-footer"><button type="button" class="btn-outlined" id="demoCancel">Cancel</button></div></div>`;
      document.body.appendChild(modal);
      const close = () => modal.remove();
      modal.querySelector('#demoCancel').onclick = close;
      modal.onclick = (e) => { if (e.target === modal) close(); };
    };
    on('homeDemo', showDemo);
    on('homeDemoNav', showDemo);
    document.querySelectorAll('[data-role]').forEach((b) => b.onclick = () => {
      ob.role = b.dataset.role;
      ob.roleChosen = true;
      ob.otherOpen = false;
      saveOb();
      renderOb();
    });
    on('obOtherOpen', () => {
      ob.otherOpen = true;
      ob.role = null;
      ob.roleChosen = false;
      saveOb();
      renderOb();
      const field = $('roleNote'); if (field) field.focus();
    });
    const note = $('roleNote');
    const next = $('obRoleNext');
    if (note && next) note.oninput = () => {
      ob.roleNote = note.value;
      saveOb();
    };
    on('obRoleNext', () => {
      if (ob.otherOpen) {
        const text = (($('roleNote') && $('roleNote').value) || ob.roleNote || '').trim();
        if (!text) { fieldError($('roleNote'), 'Required'); return; }
        ob.roleNote = text;
        ob.role = 'other';
        ob.roleChosen = true;
        goOnboarding('other');
        return;
      }
      if (!ob.roleChosen) { const box = document.querySelector('.ob-actions'); if (box && !document.getElementById('roleNeed')) { const p = document.createElement('p'); p.id = 'roleNeed'; p.className = 'form-error-msg'; p.textContent = 'Required'; box.before(p); } return; }
      if (ob.role === 'firm') goOnboarding('firmchoice');
      else if (ob.role === 'inhouse' || ob.role === 'owner') goOnboarding(ob.role);
    });
    document.querySelectorAll('[data-choice]').forEach((b) => b.onclick = () => {
      ob.firmChoice = b.dataset.choice;
      ob.firmChosen = true;
      saveOb();
      renderOb();
    });
    on('obFirmNext', () => {
      if (!ob.firmChosen) { const box = document.querySelector('.ob-actions'); if (box && !document.getElementById('firmNeed')) { const p = document.createElement('p'); p.id = 'firmNeed'; p.className = 'form-error-msg'; p.textContent = 'Required'; box.before(p); } return; }
      if (ob.firmChoice === 'create') goOnboarding('import');
    });
    document.querySelectorAll('[data-path]').forEach((b) => b.onclick = () => {
      readFirmName();
      if (b.dataset.path === 'add') goOnboarding('add');
      else goOnboarding('sources');
    });
    document.querySelectorAll('[data-src]').forEach((b) => b.onclick = () => {
      ob.source = b.dataset.src;
      if (ob.source === 'qbo' || ob.source === 'qboa' || ob.source === 'xero') {
        ob.connectedName = 'WLS Labs';
        goOnboarding('connecting');
      } else {
        ob.connectedName = '';
        goOnboarding('review');
      }
    });
    on('obNameNext', () => {
      const input = $('firmNameIn');
      const name = input ? input.value.trim() : readFirmName();
      if (!name) { fieldError(input, 'Required'); return; }
      fieldClear(input);
      ob.firmName = name;
      ob.firmTouched = true;
      if (ob.nameFrom === 'signup') { enterNewFirm(); return; }
      finishOnboarding(ob.pendingEntries || []);
    });
    on('obOtherCta', () => goWorkspace('clients'));
    on('obToFirm', () => goWorkspace('clients'));
    on('obRestart', () => restartOnboarding());
    on('obSkipList', () => {
      ob.source = 'skip';
      ob.connectedName = '';
      if (!ob.firmTouched) ob.firmName = '';
      goFirmName([], 'import');
    });
    const firmIn = $('firmNameIn');
    if (firmIn) firmIn.oninput = () => {
      fieldClear(firmIn);
      ob.firmTouched = true;
      ob.firmName = firmIn.value;
      saveOb();
    };
    const manual = $('manualName');
    const addManual = () => {
      const name = (manual && manual.value || '').trim();
      ob.manualDraft = '';
      if (!name) { ob.manualMsg = 'Enter a client name.'; saveOb(); renderOb(); const again = $('manualName'); if (again) again.focus(); return; }
      if ((ob.manual || []).some((c) => c.name.toLowerCase() === name.toLowerCase())) {
        ob.manualMsg = 'That name is already on the directory.'; saveOb(); renderOb(); const again = $('manualName'); if (again) again.focus(); return;
      }
      ob.manual.push({ id: 'm' + Math.random().toString(36).slice(2, 8), name });
      ob.manualMsg = '';
      saveOb(); renderOb();
      const again = $('manualName'); if (again) again.focus();
    };
    on('obAddName', addManual);
    if (manual) manual.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addManual(); } };
    document.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => {
      ob.manual = ob.manual.filter((c) => c.id !== b.dataset.rm);
      ob.manualMsg = ''; saveOb(); renderOb();
    });
    on('obManualDone', () => goFirmName(ob.manual || [], 'add'));
    const search = $('obSearch');
    if (search) search.oninput = () => {
      ob.q = search.value; saveOb(); renderOb();
      const n = $('obSearch'); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
    };
    const all = $('obAll');
    if (all) {
      const picked = IMPORT_POOL.filter((c) => ob.selected[c.id]).length;
      all.checked = picked === IMPORT_POOL.length;
      all.indeterminate = picked > 0 && picked < IMPORT_POOL.length;
      all.onchange = () => {
        IMPORT_POOL.forEach((c) => { ob.selected[c.id] = all.checked; });
        saveOb(); renderOb();
      };
    }
    document.querySelectorAll('[data-cid]').forEach((cb) => cb.onchange = () => {
      ob.selected[cb.dataset.cid] = cb.checked; saveOb(); renderOb();
    });
    on('obAdd', () => {
      goFirmName(IMPORT_POOL.filter((c) => ob.selected[c.id]).map((c) => ({ id: c.id, name: c.name })), 'review');
    });
    on('obSkipAdd', () => goFirmName([], 'review'));
  }

  function held(c, id) {

      row.qty = Math.max(0, (row.qty || 0) + dir);
    } else if (parts[1] === 'pack' && dir < 0 && (card.pack || 0) <= 1 && licenseBook.family === parts[0]) {

  function draftFits(family, card) {

    (card.rules || []).forEach((row) => { if (row.id && row.qty) next.rules[row.id] = (next.rules[row.id] || 0) + row.qty; });
    (card.inv || []).forEach((row) => { if (row.id && row.qty) next.inv[row.id] = (next.inv[row.id] || 0) + row.qty; });
    const used = licenseUsedMap();
    if (next.ess < used.ess || next.pro < used.pro || next.max < used.max || next.users < used.users || next.rev < used.rev) return false;
    if (Object.keys(used.rules).some((id) => (next.rules[id] || 0) < used.rules[id])) return false;
    if (Object.keys(used.inv).some((id) => (next.inv[id] || 0) < used.inv[id])) return false;

    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); popOpen() ? closePop() : openPop(); }
  };
  $('popSearch').oninput = () => { kbIndex = 0; renderPop(); highlight(); };
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('storyModal')) {
      if (e.key === 'Escape') { e.preventDefault(); closeStory(false); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); storyGo(storyIndex + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); storyGo(storyIndex - 1); }
      return;
    }
    const demoOpen = document.getElementById('demoModal');
    if (demoOpen && e.key === 'Escape') { e.preventDefault(); demoOpen.remove(); return; }
    const needOpen = document.getElementById('needConnect');
    if (needOpen && e.key === 'Escape') { e.preventDefault(); needOpen.remove(); return; }
    const bizStop = document.getElementById('bizStop');
    if (bizStop && e.key === 'Escape') { e.preventDefault(); const btn = document.getElementById('bizStopCancel'); if (btn) btn.click(); return; }
    if (e.key === 'Escape' && document.getElementById('diagnoseSheet')) { e.preventDefault(); document.getElementById('diagnoseSheet').remove(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); popOpen() ? closePop() : openPop(); return; }
    if ($('scrim').classList.contains('open') && e.key === 'Escape') { closeModal(); return; }
    if (!popOpen()) return;
    const f = focusables();
    if (e.key === 'Escape') { closePop(); $('ctxTrigger').focus(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); kbIndex = Math.min(f.length - 1, kbIndex + 1); highlight(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); kbIndex = Math.max(0, kbIndex - 1); highlight(); }
    else if (e.key === 'Enter' && f[kbIndex]) { e.preventDefault(); act(f[kbIndex].dataset.act); }
  });
  document.addEventListener('mousedown', (e) => {
    if (popOpen() && !e.target.closest('#ctxTrigger')) closePop();
    if (!e.target.closest('.row-menu')) {

  });

    if (!c) return;
    month = month || closeMonthNum();
    year = year || closeYearNum();
    const { modal, close } = dialogShell('Reopen ' + esc(closeMonthName(month)) + ' ' + year + '?', '<p class="text-body2">Synder will re-check this month before it can be closed again.</p>', '<button type="button" class="btn-outlined" data-cancel>Cancel</button><button type="button" class="btn" id="reopenSave">Reopen</button>');
    modal.querySelector('#reopenSave').onclick = () => {
      applyReopen(c, month, year);
      close();
      render();
    };
  }
  function clearV10Storage() {
    const drop = (store) => {
      const keys = [];
      for (let i = 0; i < store.length; i++) {
        const k = store.key(i);
        if (k && k.indexOf('v10') !== -1 && k.indexOf('fcs-') === 0) keys.push(k);
      }
      keys.forEach((k) => store.removeItem(k));
    };
    try { drop(localStorage); } catch (e) {}
    try { drop(sessionStorage); } catch (e) {}
  }
  function resetPrototype() {
    const variant = (ob && ob.variant === 'existing') ? 'existing' : 'new';
    closePop(); closeModal(); closeMenus();
    clearV10Storage();
    if (variant === 'existing') {
      enterExisting();
    } else {
      restartOnboarding();
    }
  }
  $('protoReset').onclick = resetPrototype;

  /* ───────── Top bar menus ───────── */
  function goTop(page) { closeMenus(); st.page = page; st.clientId = null; save(); render(); }
  function renderUserMenu() {
    const items = [];
    const inOrg = !!(st && st.ctx === 'org');
    if (inOrg && sc().firm) items.push(['myfirm', 'domain', 'Clients']);
    if (inOrg) items.push(['orgsettings', 'tune', 'Organization settings'], ['activity', 'history', 'Activity log']);
    items.push(['profile', 'person_outline', 'User profile'], ['orglist', 'list', 'List of organizations']);
    $('userMenu').innerHTML = `<div class="dropdown-item"><span class="text-body2"><span class="text-bold">Ignat Plot</span><br><span class="text-secondary">ignat@wlslabs.com</span></span></div>` +
      items.map(([k, ic, l]) => `<button type="button" class="dropdown-item" data-um="${k}"><span class="material-icons">${ic}</span>${l}</button>`).join('') +
      `<div class="dropdown-divider"></div><button type="button" class="dropdown-item" data-um="logout"><span class="material-icons">logout</span>Log out</button>`;
    $('userMenu').querySelectorAll('[data-um]').forEach((b) => b.onclick = () => {
      const k = b.dataset.um;
      if (k === 'myfirm') { closeMenus(); goFirm('clients'); }
      else if (k === 'logout') { closeMenus(); openLogout(); }
      else goTop(k);
    });
  }
  function openLogout() {
    $('modal').innerHTML = `<h3>Log out</h3><p>This prototype keeps you signed in, so you can keep exploring.</p>
      <div class="modal-actions"><button class="btn" id="doneModal">OK</button></div>`;
    $('scrim').classList.add('open'); $('doneModal').onclick = closeModal;
  }
  function closeMenus() {
    const mm = $('moreMenu'); if (mm) { mm.classList.remove('open'); $('moreBtn').setAttribute('aria-expanded', 'false'); }
    ['helpMenu', 'userMenu'].forEach((id) => { const el = $(id); if (el) el.classList.remove('show'); });
    ['helpBtn', 'userBtn'].forEach((id) => $(id).setAttribute('aria-expanded', 'false'));
  }
  function toggleMenu(btn, menu) {
    const open = !$(menu).classList.contains('show'); closeMenus(); closePop();
    if (open) { $(menu).classList.add('show'); $(btn).setAttribute('aria-expanded', 'true'); }
  }
  $('connectAi').onclick = (e) => {
    e.preventDefault();
    const { modal, close } = dialogShell('Connect AI assistant', '<p class="text-body2">Connect the assistant to this firm. It suggests fixes from the health checks.</p>', '<button type="button" class="btn-outlined" data-cancel>Cancel</button><button type="button" class="btn" id="aiConnect">Connect</button>');
    modal.querySelector('#aiConnect').onclick = () => { close(); showKitToast('AI assistant connected'); };
  };
  $('helpBtn').onclick = () => toggleMenu('helpBtn', 'helpMenu');
  $('userBtn').onclick = () => toggleMenu('userBtn', 'userMenu');
  document.querySelectorAll('[data-top]').forEach((b) => b.onclick = () => goTop(b.dataset.top));
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('#helpMenu') && !e.target.closest('#userMenu') && !e.target.closest('#helpBtn') && !e.target.closest('#userBtn')) closeMenus(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });

  loadOb();
  restoreDirectory();
  writeLocation(location.hash);
  const boot = (location.hash || '#firm').slice(1);
  if (boot.split('/')[0] === 'onboarding' || (!localStorage.getItem('fcs-ob-v10') && boot.split('/')[0] !== 'firm')) {
    // Prefer explicit hash; otherwise stay on firm workspace for this prototype
  }
  setScenario(boot || 'firm');
})();
</script>
</body>
</html>
