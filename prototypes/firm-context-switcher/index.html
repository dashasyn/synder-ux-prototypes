<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firm context switcher — Synder</title>
  <!--
    v4: restructured firm-side Client details (Work/Profile/Billing/Firm colleagues), dev state toggle, pending client page. Deep link: #firm/c3
    Firm context switcher v2 (Ignat, Nov 4 2026): live top bar (Balance, How it works?, bell, help, user menu with My firm on top)
    - One context switcher top-left of the sidebar (replaces firm section + "CLIENT WORKSPACE" org dropdown).
    - One sidebar; contents swap fully per context (Firm nav vs Org nav). No top tabs.
    - v10: practice or business first, then practice sign-up, Clients home, import, optional pre-assessment. No firm dashboard in this experiment.
    - v8: explicit role choice, neutral Create/Join, full client switcher, left-aligned directory welcome.
    - v7: portrait role and firm cards, client-directory welcome, then a simulated QuickBooks / Xero / CSV import. Firm user only.
    - v6: firm onboarding (#onboarding), client list import, firm Dashboard + setup progress. Firm user only.
    - Ctrl/Cmd+K opens the switcher; arrows + Enter + Esc work inside.
    - Last context remembered per scenario in localStorage.
  -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://dashasyn.github.io/synder-prototypes/ui-kit/synder-ui-kit.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    :root { --proto-bar-h: 48px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; line-height: 20px; color: var(--text-primary, #1A1B24); background: #fff;
    }

    /* ── Dark prototype bar (name + variant switcher only) ── */
    .proto-bar {
      position: sticky; top: 0; z-index: 300;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      min-height: var(--proto-bar-h); padding: 8px 16px;
      background: #111827; color: #F9FAFB;
    }
    .proto-bar .brand { font-size: 14px; font-weight: 500; letter-spacing: .02em; opacity: .92; white-space: nowrap; }
    .proto-bar .spacer { flex: 1; }
    .seg { display: inline-flex; background: rgba(255,255,255,.06); border-radius: 6px; padding: 2px; gap: 2px; }
    .seg button {
      appearance: none; border: none; background: transparent; color: #9CA3AF;
      font: inherit; font-size: 14px; font-weight: 500; height: 30px; padding: 0 10px;
      border-radius: 4px; cursor: pointer; white-space: nowrap;
    }
    .seg button:hover { color: #fff; background: rgba(255,255,255,.08); }
    .seg button.active { background: #0053CC; color: #fff; }
    .proto-reset {
      appearance: none; border: none; background: none; margin-left: 4px;
      color: #9CA3AF; font: inherit; font-size: 13px; font-weight: 400; line-height: 20px;
      padding: 4px 2px; cursor: pointer;
    }
    .proto-reset:hover { color: #fff; text-decoration: underline; }
    .proto-reset:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 4px; }

    /* ── Marketing home (rough synder.com) ── */
    .shell-hide .ob:has(.home) { background: #002658; }
    .home { min-height: calc(100vh - var(--proto-bar-h)); background: linear-gradient(#002658 72%, #1c1f23); color: #fff; }
    .home-ann { background: #06256e; color: #fff; text-align: center; font-size: 13px; line-height: 20px; padding: 6px 16px; cursor: default; }
    .home-nav { display: flex; align-items: center; gap: 20px; padding: 16px 28px 8px; }
    .home-logo { height: 28px; width: auto; display: block; }
    .home-menu { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
    .home-inert { color: #fff; font-size: 15px; line-height: 22px; cursor: default; }
    .home-nav-end { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .home-search { font-size: 22px; color: #fff; cursor: default; }
    .home-login, .home-fill, .home-outline { font-family: inherit; }
    .home-login { appearance: none; background: none; border: 0; color: #fff; font-size: 15px; font-weight: 500; line-height: 22px; padding: 8px 4px; cursor: pointer; }
    .home-login:hover { text-decoration: underline; }
    .home-fill { appearance: none; border: 0; background: #00feb2; color: #01204f; border-radius: 8px; padding: 11px 20px; font-size: 16px; font-weight: 500; line-height: 20px; cursor: pointer; }
    .home-fill:hover { background: #68ffd2; }
    .home-fill.home-inert, .home-outline { cursor: default; }
    .home-fill.home-inert:hover { background: #00feb2; }
    .home-outline { appearance: none; background: transparent; color: #fff; border: 1px solid #fff; border-radius: 8px; padding: 10px 16px; font-size: 16px; font-weight: 500; line-height: 20px; }
    .home-login:focus-visible, .home-fill:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .home-hero { text-align: center; padding: 56px 24px 28px; }
    .ob .home-hero h1 { color: #fff; text-align: center; font-size: 44px; line-height: 52px; font-weight: 600; margin: 0 auto 24px; max-width: 920px; }
    .home-points { list-style: none; margin: 0 0 28px; padding: 0; color: #fff; font-size: 18px; line-height: 28px; }
    .home-trial { margin: 12px 0 0; color: rgba(255,255,255,.75); font-size: 14px; line-height: 20px; }
    .home-stat { text-align: center; padding: 12px 24px 56px; font-size: 22px; line-height: 30px; font-weight: 500; }

    /* ── Product shell ── */
    .p-top {
      height: 56px; background: #fff; border-bottom: 1px solid #C8C7CC;
      display: flex; align-items: center; justify-content: flex-end;
      gap: 16px; padding: 0 20px 0 10px;
      position: sticky; top: var(--proto-bar-h); z-index: 30;
    }
    .t-balance { font-size: 14px; line-height: 20px; color: #1A1B24; padding: 2px 0; box-shadow: inset 0 -2px 0 #0053CC; cursor: default; }
    .t-balance b { color: #0053CC; font-weight: 600; }
    .t-how { font-size: 14px; color: #0053CC; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
    .t-how:hover { text-decoration: underline; }
    .t-wrap { position: relative; }
    .t-ico {
      position: relative; height: 32px; min-width: 32px; border-radius: 6px; padding: 0 4px;
      display: inline-flex; align-items: center; justify-content: center; gap: 0;
      color: #0053CC; background: transparent; border: none; cursor: pointer; font-family: inherit;
    }
    .t-ico:hover, .t-ico[aria-expanded="true"] { background: #F2F6FC; }
    .t-ico .material-icons { font-size: 22px; }
    .t-ico .chev { font-size: 18px; opacity: .7; }
    .t-badge {
      position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 8px; background: #CC2929; color: #fff; font-size: 11px; line-height: 16px; font-weight: 500;
    }
    .menu {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 220px;
      background: #fff; border: 1px solid #DFE4EC; border-radius: var(--radius-sm); padding: 6px 0;
      box-shadow: 0 8px 24px rgba(26,27,36,.14); display: none;
    }
    .menu.open { display: block; }
    .menu button {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 16px;
      background: none; border: none; cursor: pointer; font: inherit; font-size: 14px; color: #1A1B24; text-align: left;
    }
    .menu button:hover { background: #F2F6FC; }
    .menu .material-icons { font-size: 20px; color: #6B778C; }
    .menu .div { height: 1px; background: #EFF1F5; margin: 6px 0; }
    .menu .who { padding: 8px 16px 10px; border-bottom: 1px solid #EFF1F5; margin-bottom: 6px; }
    .menu .who b { display: block; font-weight: 500; }
    .menu .who span { color: #6B778C; }
    .p-body { display: flex; min-height: calc(100vh - var(--proto-bar-h) - 56px); }
    .p-side {
      position: sticky; top: calc(var(--proto-bar-h) + 56px);
      height: calc(100vh - var(--proto-bar-h) - 56px);
      display: flex; flex-direction: column; flex-shrink: 0;
      background: var(--bg-sidebar);
    }
    .p-side .sidebar { height: 100%; overflow-y: auto; }
    /* Kit sidebar items are anchors. These are buttons, so clear the browser's black outset border and keep only the kit's 1px bottom divider. */
    .p-side button.sidebar-item {
      appearance: none;
      border: 0;
      border-bottom: 1px solid var(--color-sidebar-divider);
      background-color: transparent;
      box-shadow: none;
      font: inherit;
      text-align: left;
      width: 100%;
    }
    .p-side button.sidebar-item:hover { background-color: var(--color-sidebar-hover); }
    .p-side button.sidebar-item.active,
    .p-side button.sidebar-item.active:hover { background-color: var(--color-sidebar-active); color: var(--color-white); }
    .p-side button.sidebar-item.active .material-icons { color: var(--color-white); }
    .p-side button.sidebar-item:focus,
    .p-side button.sidebar-item:focus-visible { outline: none; }
    .p-main { flex: 1; min-width: 0; padding: var(--space-6) var(--space-8) var(--space-10); }

    /* ── Context switcher trigger ── */
    .ctx { position: relative; flex: 0 0 228px; width: 228px; height: 40px; display: flex; align-items: center; }
    .t-left { display: flex; align-items: center; gap: 12px; margin-right: auto; height: 40px; }
    .t-left #backChip:empty { display: none; }
    .ctx-trigger {
      width: 100%; display: flex; align-items: center; gap: 10px;
      height: 40px; padding: 0 8px; border: 0; border-radius: 6px;
      background: transparent; cursor: pointer; text-align: left; font: inherit; color: inherit;
    }
    .ctx-trigger:hover { background: #F2F6FC; }
    .ctx-trigger[aria-expanded="true"] { background: #F2F6FC; box-shadow: inset 0 0 0 1px #DFE4EC; }
    .ctx-trigger:focus-visible { outline: 2px solid #0053CC; outline-offset: 0; }
    .ctx-trigger .av { width: 28px; height: 28px; font-size: 12px; }
    .ctx-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .ctx-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctx-cap { font-size: 12px; line-height: 16px; color: #6B778C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctx-trigger .material-icons { font-size: 20px; color: #6B778C; }

    .av {
      width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 500; letter-spacing: .02em;
    }
    .av.firm { border-radius: var(--radius-sm); background: #1A1B24; }
    .av.sm { width: 24px; height: 24px; font-size: 11px; }
    .av.sm.firm { border-radius: 6px; }

    .back-chip {
      display: inline-flex; align-items: center; gap: 4px; margin: 0; height: 28px;
      padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #6B778C;
      text-decoration: none; cursor: pointer; background: none; border: none; font-family: inherit;
    }
    .back-chip:hover { color: #0053CC; background: #F2F6FC; }
    .back-chip .material-icons { font-size: 16px; }

    /* ── Switcher popover ── */
    .pop {
      position: absolute; left: 0; top: calc(100% + 8px); z-index: 60;
      width: 300px; background: #fff; border: 1px solid #DFE4EC; border-radius: var(--radius-sm);
      box-shadow: 0 8px 24px rgba(26,27,36,.14); display: none; overflow: hidden;
    }
    .pop.open { display: block; }
    .pop-search { padding: 10px; border-bottom: 1px solid #EFF1F5; position: relative; }
    .pop-search input { height: 36px; padding-right: 56px; }
    .kbd {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      font-size: 12px; color: #6B778C; border: 1px solid #DFE4EC; border-radius: 4px; padding: 0 5px; background: #F7F8FA;
    }
    .pop-list { max-height: 320px; overflow-y: auto; padding: 4px 0; }
    #popFirm { border-bottom: 1px solid var(--border-default); }
    .pop-sec { padding: 10px 14px 4px; font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: #6B778C; }
    .pop-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 7px 14px; background: none; border: none; cursor: pointer; text-align: left;
      font: inherit; color: #1A1B24;
    }
    .pop-item:hover, .pop-item.kb { background: #F2F6FC; }
    .pop-item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .pop-item .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pop-item .c { font-size: 12px; line-height: 16px; color: #6B778C; }
    .pop-item .check { font-size: 18px; color: #0053CC; }
    .pop-link {
      display: block; width: 100%; padding: 7px 14px 7px 48px; background: none; border: none;
      text-align: left; cursor: pointer; font: inherit; color: #0053CC;
    }
    .pop-link:hover, .pop-link.kb { background: #F2F6FC; }
    .pop-empty { padding: 16px 14px; color: #6B778C; }
    .pop-foot { border-top: 1px solid #EFF1F5; padding: 6px 0; }
    .pop-foot button {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 14px;
      background: none; border: none; cursor: pointer; font: inherit; color: #6B778C; text-align: left;
    }
    .pop-foot button:hover, .pop-foot button.kb { background: #F7F8FA; color: #1A1B24; }
    .pop-foot .material-icons { font-size: 18px; width: 24px; text-align: center; }

    .nav, #nav { flex: 1; }

    /* ── Main content ── */
    .ph { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
    .ph-actions { display: flex; align-items: center; gap: var(--space-3); }
    .crumb {
      display: inline-flex; align-items: center; gap: 4px; color: #0053CC; cursor: pointer;
      background: none; border: none; font: inherit; padding: 0; margin-bottom: 8px;
    }
    .crumb:hover { text-decoration: underline; }
    .crumb .material-icons { font-size: 18px; }
    .toolbar { display: flex; gap: var(--space-2); margin: 0 0 var(--space-4); }
    .toolbar input { max-width: 320px; }
    .linkish { cursor: pointer; background: none; border: none; font: inherit; padding: 0; text-align: left; }
    .linkish:hover { text-decoration: underline; }
    .client-cell { display: flex; align-items: center; gap: var(--space-2); }

    .section-h { font-size: 20px; line-height: 28px; font-weight: 400; margin: 8px 0 12px; }
    .empty { text-align: center; padding: 56px 24px; max-width: 460px; margin: 0 auto; }
    .proto-stub { min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--space-8); }
    .empty .material-icons { font-size: 40px; color: #B4BBCB; }
    .empty h2 { font-size: 20px; line-height: 28px; font-weight: 500; margin: 12px 0 6px; }
    .empty p { color: #6B778C; margin: 0 0 20px; }
    .empty .sec { display: block; margin: 12px auto 0; }

    .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; max-width: 840px; }
    .kpi { border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 16px; }
    .kpi .l { color: #6B778C; }
    .kpi .v { font-size: 28px; line-height: 36px; margin-top: 4px; }

    /* ── Modal ── */
    .scrim { position: fixed; inset: 0; background: rgba(26,27,36,.4); z-index: 400; display: none; align-items: center; justify-content: center; }
    .scrim.open { display: flex; }
    .scrim > .modal { width: min(560px, calc(100vw - 32px)); max-width: 560px; }
    .idrow { display: flex; gap: 8px; }
    .idrow input { font-size: 16px; letter-spacing: .04em; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
    /* ── v4 client details ── */
    .cd-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
    .cd-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .cd-title h1 { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cd-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .pager { display: inline-flex; align-items: center; gap: 2px; color: #6B778C; font-size: 13px; white-space: nowrap; }
    .pager button { width: 28px; height: 28px; border: 0; background: none; border-radius: 4px; cursor: pointer; color: #6B778C; display: inline-flex; align-items: center; justify-content: center; }
    .pager button:hover:not(:disabled) { background: #F2F6FC; color: #0053CC; }
    .pager button:disabled { opacity: .35; cursor: default; }
    .period { height: 36px; border: 1px solid #C8C7CC; border-radius: 4px; padding: 0 8px; font: inherit; background: #fff; }
    .tipwrap[data-tip]:hover::after {
      content: attr(data-tip); position: absolute; right: 0; top: calc(100% + 6px); z-index: 70; width: 260px;
      background: #1A1B24; color: #fff; font-size: 13px; line-height: 18px; padding: 8px 10px; border-radius: 6px; white-space: normal;
    }
    .tipwrap { position: relative; display: inline-flex; }
    .more:hover, .more[aria-expanded="true"] { background: #F2F6FC; }
    .menu .danger, .menu .danger .material-icons { color: #CC2929; }
    .wk-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; max-width: 880px; margin-bottom: 24px; }
    .mpick { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
    .mpick select { appearance: none; border: 0; background: none; font: inherit; font-size: 20px; line-height: 28px; font-weight: 500; color: #1A1B24; padding: 0 26px 0 0; cursor: pointer; }
    .mpick .material-icons { position: absolute; right: 0; pointer-events: none; color: #6B778C; }
    .mpick select:focus-visible { outline: 2px solid #0053CC; border-radius: 4px; }
    .wk-line { margin-top: 4px; color: var(--text-secondary); }
    .ln-warn { color: #B35E0B; font-weight: 500; } .ln-ok { color: #1F8940; font-weight: 500; }
    .wk-sec { max-width: 880px; margin-bottom: 28px; }
    .sec-h { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: flex; gap: 8px; }
    .sec-h .muted { font-weight: 400; }
    .tabs-l { display: flex; gap: 24px; }
    .tabs { justify-content: space-between; align-items: center; }
    .tabs { display: flex; gap: 24px; border-bottom: 1px solid #DFE4EC; margin: 12px 0 24px; }
    .tabs button { background: none; border: 0; cursor: pointer; }
    .card { border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 16px; max-width: 880px; }
    .sum { display: flex; gap: 12px; align-items: flex-start; }
    .sum .material-icons { font-size: 24px; }
    .sum h3 { margin: 0; font-size: 16px; font-weight: 500; }
    .sum ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-secondary); }
    .sum li { margin: 2px 0; }
    .sum.blocked { background: #FFF7F0; border-color: #F3D2B3; } .sum.blocked > .material-icons { color: #CB7515; }
    .sum.ready { background: #F1F9F3; border-color: #BFE3C8; } .sum.ready > .material-icons { color: #1F8940; }
    .sum.closed > .material-icons { color: #6B778C; }
    .chk-h { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .chk-h h2 { font-size: 16px; font-weight: 500; margin: 0; }
    .bar { flex: 0 0 120px; height: 6px; border-radius: 3px; background: #EFF1F5; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #1F8940; }
    .chk { border-bottom: 1px solid #EFF1F5; }
    .chk summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
    .chk summary::-webkit-details-marker { display: none; }
    .chk .ic { font-size: 20px; }
    .ic.pass { color: #1F8940; } .ic.fail { color: #CC2929; } .ic.warn { color: #CB7515; } .ic.wait { color: #B4BBCB; }
    .chk .nm { width: 180px; font-weight: 500; }
    .chk .stt { flex: 1; color: var(--text-secondary); }
    .chk .exp { color: #6B778C; font-size: 20px; transition: transform .15s; }
    .chk[open] .exp { transform: rotate(180deg); }
    .chk .det { padding: 0 0 12px 32px; color: #6B778C; }
    textarea.note { width: 100%; min-height: 72px; border: 1px solid #C8C7CC; border-radius: 4px; padding: 8px; font: inherit; resize: vertical; }
    .hist summary { cursor: pointer; color: #6B778C; list-style: none; }
    .hist summary::-webkit-details-marker { display: none; }
    .hist table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .hist td { padding: 6px 8px 6px 0; border-top: 1px solid #EFF1F5; vertical-align: top; }
    .hist td:first-child { color: #6B778C; white-space: nowrap; width: 130px; }
    .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; max-width: 880px; }
    .form label { display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 13px; }
    .form .full { grid-column: 1 / -1; }
    .form input, .form textarea { font: inherit; font-size: 14px; color: #1A1B24; }
    .kv { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; margin: 0; }
    .kv dt { color: #6B778C; } .kv dd { margin: 0; }
    #stateSeg.hide { visibility: hidden; }
    /* ── v7 onboarding: portrait cards + client directory ── */
    .shell-hide .p-top, .shell-hide .p-body { display: none; }
    .ob { display: none; min-height: calc(100vh - var(--proto-bar-h)); background: var(--bg-page); }
    .shell-hide .ob { display: block; }
    .ob-in { max-width: 1040px; margin: 0 auto; padding: var(--space-8) var(--space-8) var(--space-10); }
    .ob-in.review-fit {
      height: calc(100vh - 50px);

    .ob-table-wrap th, .ob-table-wrap td { padding: 12px 14px; border-bottom: 1px solid #EFF1F5; text-align: left; font-size: 14px; line-height: 20px; }
    .ob-table-wrap th { font-weight: 500; color: #6B778C; }
    .ob-table-wrap tr:last-child td { border-bottom: 0; }
    .ob-table-wrap input[type=checkbox] { width: 16px; height: 16px; }
    .setup-bar { display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: #F2F6FC; border: 1px solid #D6E4F7; border-radius: var(--radius-sm); margin-bottom: 20px; max-width: 880px; }
    .setup-bar .bar { flex: 1; height: 8px; background: #DFE4EC; border-radius: 4px; overflow: hidden; }
    .setup-bar .bar i { display: block; height: 100%; background: #0053CC; }
    .setup-bar b { white-space: nowrap; }
    .issues { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 880px; margin: 16px 0 24px; }
    .issue { border: 1px solid #DFE4EC; border-radius: var(--radius-sm); padding: 14px; }
    .issue .n { font-size: 24px; line-height: 32px; }
    .issue .l { color: #6B778C; font-size: 13px; }
    .stepper { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .stepper span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; font-size: 13px; color: #6B778C; background: #F7F8FA; }
    .stepper span.on { background: var(--color-primary-5); color: var(--color-primary); font-weight: 400; }
    .stepper span.done { color: #1F8940; }
    .draft-tag { display: inline-block; font-size: 12px; color: #CB7515; background: #FFF7F0; border: 1px solid #F3D2B3; border-radius: 4px; padding: 2px 6px; margin-left: 8px; vertical-align: middle; }

    /* Falling sparkles — exact styles from prototypes/joy-sparkles/index.html */
    .spark-fall {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      overflow: hidden;
    }
    .spark {
      position: absolute;
      left: var(--x, 50%);
      top: var(--y, -12px);
      width: var(--size, 8px);
      height: var(--size, 8px);
      margin-left: calc(var(--size, 8px) / -2);
      background: var(--color, #ffd166);
      border-radius: 2px;
      opacity: 0;
      transform: translate(0, 0) rotate(0deg);
      animation: spark-fall var(--dur, 0.9s) var(--delay, 0ms) cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      will-change: transform, opacity;
    }
    .spark.star {
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%,
        79% 91%, 50% 70%, 21% 91%, 32% 57%,
        2% 35%, 39% 35%
      );
    }
    .spark.dot { border-radius: 50%; }
    .spark.diamond {
      border-radius: 2px;
      animation-name: spark-fall-diamond;
    }
    @keyframes spark-fall {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg) scale(0.6);
      }
      8% {
        opacity: 1;
        transform: translate(calc(var(--drift) * 0.1), 0) rotate(20deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--drift), var(--fall)) rotate(var(--spin)) scale(0.75);
      }
    }
    @keyframes spark-fall-diamond {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(45deg) scale(0.6);
      }
      8% {
        opacity: 1;
        transform: translate(calc(var(--drift) * 0.1), 0) rotate(55deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--drift), var(--fall)) rotate(calc(45deg + var(--spin))) scale(0.75);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .spark { animation: none !important; display: none !important; }
    }
  </style>

        <img class="auth-logo" src="synder-logo.svg" alt="Synder" />
        <div class="box box--white auth-card">
          <h1 class="text-h1">Name your firm</h1>
          <p class="text-body1">Your team will see this name. It is not taken from a client.</p>
          <div class="form-field"><label class="form-label form-label-required" for="firmNameIn">Firm name</label><input class="input" id="firmNameIn" autocomplete="organization" value="${esc((ob.firmName || '').trim() || 'Northwind Bookkeeping')}" /></div>
          <button type="button" class="btn" id="obNameNext">Create firm</button>
        </div>
        </div>
        </div>`);
    } else if (step === 'review') {
      const q = (ob.q || '').toLowerCase();
      const list = IMPORT_POOL.filter((c) => !q || c.name.toLowerCase().includes(q));
      const n = IMPORT_POOL.filter((c) => ob.selected[c.id]).length;
      html = obShell(`
        ${backSlot(true)}
        <h1>Choose who to keep</h1>
        <p class="welcome-copy">${reviewCopy()}</p>
        <div class="review-scroll">
          <div class="toolbar" style="margin-bottom:12px"><input type="search" class="input-search" id="obSearch" placeholder="Search clients" value="${esc(ob.q || '')}" aria-label="Search clients" /></div>
          <div class="ob-table-wrap"><table>
            <thead><tr><th style="width:40px"><input type="checkbox" id="obAll" aria-label="Select all names" /></th><th>Client</th><th>In this sample</th></tr></thead>
            <tbody>${list.map((c) => `<tr><td><input type="checkbox" data-cid="${c.id}" aria-label="${esc(c.name)}"${ob.selected[c.id] ? ' checked' : ''} /></td>
              <td><div class="client-cell">${av(c, true)}${esc(c.name)}</div></td>
              <td class="${c.former ? 'sample-former' : 'sample-current'}">${c.former ? 'Former client' : 'Current client'}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No names match that search.</td></tr>'}</tbody>
          </table></div>
        </div>
        <div class="review-foot">
          <button type="button" class="btn" id="obAdd">${n ? `Add ${n} client${n === 1 ? '' : 's'}` : 'Add clients'}</button>
          <button type="button" class="ob-quiet" id="obSkipAdd">Continue without these names</button>
        </div>`, true);
    } else if (step === 'joinok') {
      html = obShell(`
        ${backSlot(true)}
        <h1>Request sent</h1>
        <p class="lead">We’ll email you when your firm admin accepts.</p>
        <div class="ob-actions"><button type="button" class="btn" id="obToFirm">Preview firm workspace</button>
        <button type="button" class="btn-text sec" id="obRestart">Restart onboarding</button></div>`);
    } else {
      html = obShell(`${backSlot(false)}<h1>That step isn’t in this prototype</h1><div class="ob-actions"><button type="button" class="btn" id="obRestart">Back to start</button></div>`);
    }
    $('ob').innerHTML = html;
    bindOb();
    const existingLogin = ob && ob.variant === 'existing' && step === 'login';
    const h = existingLogin
      ? '#existing'
      : (step === 'home' ? '#home' : (step === 'entry' ? '#onboarding/entry' : '#onboarding/' + step));
    if (location.hash !== h) writeLocation(h, obHashStep && obHashStep !== step && !existingLogin);
    obHashStep = step;
    document.title = 'Onboarding — Synder (Firm context switcher)';
  }
  function bindOb() {
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    const backMap = {
      login: 'signup', join: 'signup', joinok: 'join',
      import: 'signup', add: 'import', sources: 'import',
      firmname: 'signup', review: 'sources', connecting: 'sources'
    };
    on('obBack', () => {
      readFirmName();
      if (ob.step === 'login' && ob.loginFrom === 'role') return;
      if (ob.step === 'firmname') { goOnboarding(ob.nameFrom || 'import'); return; }
      if (ob.step === 'login') { goOnboarding(ob.loginFrom === 'home' ? 'home' : 'signup'); return; }
      const dest = backMap[ob.step];
      if (!dest || dest === 'entry') return;
      goOnboarding(dest);
    });
    ['suName', 'suEmail', 'suPass', 'suFirm'].forEach((id) => {
      const el = $(id);
      if (!el) return;
      el.oninput = () => {
        fieldClear(el);
        if (id === 'suName') ob.userName = el.value;
        if (id === 'suEmail') ob.userEmail = el.value;
        if (id === 'suPass') ob.demoPass = el.value;
        if (id === 'suFirm') ob.firmName = el.value;
      };
    });
    on('obSignup', () => {
      const name = $('suName'), email = $('suEmail'), pass = $('suPass'), firm = $('suFirm');
      let bad = false;
      [name, email, pass, firm].forEach((el) => fieldClear(el));
      if (!name || !name.value.trim()) { fieldError(name, 'Required'); bad = true; }
      if (!email || !email.value.trim()) { fieldError(email, 'Required'); bad = true; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { fieldError(email, 'Enter a valid email'); bad = true; }
      if (!pass || !pass.value) { fieldError(pass, 'Required'); bad = true; }
      else if (pass.value.length < 8) { fieldError(pass, 'Use at least 8 characters'); bad = true; }
      if (!firm || !firm.value.trim()) { fieldError(firm, 'Required'); bad = true; }
      if (bad) return;
      ob.userName = name.value.trim();
      ob.userEmail = email.value.trim();
      ob.demoPass = pass.value;
      ob.firmName = firm.value.trim();
      ob.firmTouched = true;
      ob.marketplace = false;
      ob.use = 'practice';
      ob.useChosen = true;
      enterNewFirm();
    });
    on('obLogin', () => {
      ob.loginFrom = 'signup';
      ob.variant = 'existing';
      if (!ob.firmName) ob.firmName = 'WLS Labs';
      goOnboarding('login');
    });
    on('homeSignup', () => goOnboarding('entry'));
    on('homeLogin', () => { ob.loginFrom = 'home'; goOnboarding('login'); });
    const loginReady = () => {
      fieldClear($('liEmail'));
      fieldClear($('liPass'));
    };
    ['liEmail', 'liPass'].forEach((id) => { const el = $(id); if (el) el.oninput = loginReady; });
    on('liSubmit', () => {
      const e = $('liEmail'), p = $('liPass');
      let bad = false;
      fieldClear(e); fieldClear(p);
      if (!e || !e.value.trim()) { fieldError(e, 'Required'); bad = true; }
      if (!p || !p.value) { fieldError(p, 'Required'); bad = true; }
      if (bad) return;
      ob.userEmail = e.value.trim();
      finishExistingLogin();
    });
    on('liSignup', () => {
      ob.variant = 'new';
      saveOb();
      goOnboarding('signup');
    });
    document.querySelectorAll('.kit-choice[data-use]').forEach((card) => card.onclick = () => {
      const use = card.dataset.use;
      if (use !== 'practice' && use !== 'business') return;
      ob.use = use;
      ob.useChosen = true;
      if (use === 'business') {
        ob.loginFrom = 'role';
        ob.userEmail = 'ignat@wlslabs.com';
        ob.demoPass = 'Bookkeeping1';
        saveOb();
        goOnboarding('login');
        return;
      }
      saveOb();
      goOnboarding('signup');
    });
    document.querySelectorAll('[data-social]').forEach((b) => b.onclick = (e) => {
      e.stopPropagation();
      finishExistingLogin();
    });
    on('obJoinInfo', () => { const modal = $('joinModal'); if (modal) modal.classList.add('show'); });
    const closeJoin = () => { const modal = $('joinModal'); if (modal) modal.classList.remove('show'); };
    on('joinGotIt', closeJoin);
    on('joinOk', closeJoin);
    ['joinModal'].forEach((id) => {
      const modal = $(id);
      if (modal) modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('show'); };
    });
    const joinIn = $('firmIdIn');
    on('obRequest', () => {
      const input = $('firmIdIn');
      const err = $('joinReqError');
      if (!input || !input.value.trim()) { if (err) err.hidden = false; if (input) input.focus(); return; }
      if (err) err.hidden = true;
      goOnboarding('joinok');
    });
    const showDemo = () => {
      let modal = document.getElementById('demoModal');
      if (modal) modal.remove();
      modal = document.createElement('div');
      modal.id = 'demoModal';
      modal.className = 'modal-bg show';
      modal.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="demoTitle"><div class="modal-header" id="demoTitle">Book a demo</div><div class="modal-body"><p class="text-body2">Thanks. A Synder specialist will email you to set a time.</p></div><div class="modal-footer"><button type="button" class="btn-outlined" id="demoCancel">Cancel</button></div></div>`;
      document.body.appendChild(modal);
      const close = () => modal.remove();
      modal.querySelector('#demoCancel').onclick = close;
      modal.onclick = (e) => { if (e.target === modal) close(); };
    };
    on('homeDemo', showDemo);
    on('homeDemoNav', showDemo);
    document.querySelectorAll('[data-role]').forEach((b) => b.onclick = () => {
      ob.role = b.dataset.role;
      ob.roleChosen = true;
      ob.otherOpen = false;
      saveOb();
      renderOb();
    });
    on('obOtherOpen', () => {
      ob.otherOpen = true;
      ob.role = null;
      ob.roleChosen = false;
      saveOb();
      renderOb();
      const field = $('roleNote'); if (field) field.focus();
    });
    const note = $('roleNote');
    const next = $('obRoleNext');
    if (note && next) note.oninput = () => {
      ob.roleNote = note.value;
      saveOb();
    };
    on('obRoleNext', () => {
      if (ob.otherOpen) {
        const text = (($('roleNote') && $('roleNote').value) || ob.roleNote || '').trim();
        if (!text) { fieldError($('roleNote'), 'Required'); return; }
        ob.roleNote = text;
        ob.role = 'other';
        ob.roleChosen = true;
        goOnboarding('other');
        return;
      }
      if (!ob.roleChosen) { const box = document.querySelector('.ob-actions'); if (box && !document.getElementById('roleNeed')) { const p = document.createElement('p'); p.id = 'roleNeed'; p.className = 'form-error-msg'; p.textContent = 'Required'; box.before(p); } return; }
      if (ob.role === 'firm') goOnboarding('firmchoice');
      else if (ob.role === 'inhouse' || ob.role === 'owner') goOnboarding(ob.role);
    });
    document.querySelectorAll('[data-choice]').forEach((b) => b.onclick = () => {
      ob.firmChoice = b.dataset.choice;
      ob.firmChosen = true;
      saveOb();
      renderOb();
    });
    on('obFirmNext', () => {
      if (!ob.firmChosen) { const box = document.querySelector('.ob-actions'); if (box && !document.getElementById('firmNeed')) { const p = document.createElement('p'); p.id = 'firmNeed'; p.className = 'form-error-msg'; p.textContent = 'Required'; box.before(p); } return; }
      if (ob.firmChoice === 'create') goOnboarding('import');
      else if (ob.firmChoice === 'join') goOnboarding('join');
    });
    document.querySelectorAll('[data-path]').forEach((b) => b.onclick = () => {
      readFirmName();
      if (b.dataset.path === 'add') goOnboarding('add');
      else goOnboarding('sources');
    });
    document.querySelectorAll('[data-src]').forEach((b) => b.onclick = () => {
      ob.source = b.dataset.src;
      if (ob.source === 'qbo' || ob.source === 'qboa' || ob.source === 'xero') {
        ob.connectedName = 'WLS Labs';
        goOnboarding('connecting');
      } else {
        ob.connectedName = '';
        goOnboarding('review');
      }
    });
    on('obNameNext', () => {
      const input = $('firmNameIn');
      const name = input ? input.value.trim() : readFirmName();
      if (!name) { fieldError(input, 'Required'); return; }
      fieldClear(input);
      ob.firmName = name;
      ob.firmTouched = true;
      if (ob.nameFrom === 'signup') { enterNewFirm(); return; }
      finishOnboarding(ob.pendingEntries || []);
    });
    on('obRequest', () => goOnboarding('joinok'));
    on('obOtherCta', () => goWorkspace('clients'));
    on('obToFirm', () => goWorkspace('clients'));
    on('obRestart', () => restartOnboarding());
    on('obSkipList', () => {
      ob.source = 'skip';
      ob.connectedName = '';
      if (!ob.firmTouched) ob.firmName = '';
      goFirmName([], 'import');
    });
    const firmIn = $('firmNameIn');
    if (firmIn) firmIn.oninput = () => {
      fieldClear(firmIn);
      ob.firmTouched = true;
      ob.firmName = firmIn.value;
      saveOb();
    };
    const manual = $('manualName');
    const addManual = () => {
      const name = (manual && manual.value || '').trim();
      ob.manualDraft = '';
      if (!name) { ob.manualMsg = 'Enter a client name.'; saveOb(); renderOb(); const again = $('manualName'); if (again) again.focus(); return; }
      if ((ob.manual || []).some((c) => c.name.toLowerCase() === name.toLowerCase())) {
        ob.manualMsg = 'That name is already on the directory.'; saveOb(); renderOb(); const again = $('manualName'); if (again) again.focus(); return;
      }
      ob.manual.push({ id: 'm' + Math.random().toString(36).slice(2, 8), name });
      ob.manualMsg = '';
      saveOb(); renderOb();
      const again = $('manualName'); if (again) again.focus();
    };
    on('obAddName', addManual);
    if (manual) manual.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addManual(); } };
    document.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => {
      ob.manual = ob.manual.filter((c) => c.id !== b.dataset.rm);
      ob.manualMsg = ''; saveOb(); renderOb();
    });
    on('obManualDone', () => goFirmName(ob.manual || [], 'add'));
    const search = $('obSearch');
    if (search) search.oninput = () => {
      ob.q = search.value; saveOb(); renderOb();
      const n = $('obSearch'); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
    };
    const all = $('obAll');
    if (all) {
      const picked = IMPORT_POOL.filter((c) => ob.selected[c.id]).length;
      all.checked = picked === IMPORT_POOL.length;
      all.indeterminate = picked > 0 && picked < IMPORT_POOL.length;
      all.onchange = () => {
        IMPORT_POOL.forEach((c) => { ob.selected[c.id] = all.checked; });
        saveOb(); renderOb();
      };
    }
    document.querySelectorAll('[data-cid]').forEach((cb) => cb.onchange = () => {
      ob.selected[cb.dataset.cid] = cb.checked; saveOb(); renderOb();
    });
    on('obAdd', () => {
      goFirmName(IMPORT_POOL.filter((c) => ob.selected[c.id]).map((c) => ({ id: c.id, name: c.name })), 'review');
    });
    on('obSkipAdd', () => goFirmName([], 'review'));
  }

  /* Firm dashboard + billing + client setup */
  function renderFirmDashboard() {
    const list = firmClients();
    const done = setupCount();
    const need = list.length - done;
    if (done === 0) {
      return `<div class="ph"><div><h1>Dashboard</h1></div></div>
        <div class="empty"><span class="material-icons">checklist</span>
          <h2>Set up your first client</h2>
          <p>Your firm list is ready. Connect books on a client to unlock the firm overview.</p>
          <button class="btn" id="dashGoClients">Go to Clients</button></div>`;
    }
    const counts = statusCounts(list);
    return `<div class="ph"><div><h1>Dashboard</h1><div class="sub">${esc(FIRM.name)}</div></div>
      <div class="ph-actions"><button class="btn" id="dashContinue">Continue setup</button></div></div>
      <div class="setup-bar"><b>${done} of ${list.length} clients set up</b>
        <span class="bar"><i style="width:${list.length ? done / list.length * 100 : 0}%"></i></span>
        <span class="muted">${need} still need setup</span></div>
      <h2 class="section-h">Clients</h2>
      <div class="issues">
        <div class="issue"><div class="n">${counts.all}</div><div class="l">All clients</div></div>
        <div class="issue"><div class="n">${counts.issues}</div><div class="l">Issues found</div></div>
        <div class="issue"><div class="n">${counts.lost}</div><div class="l">Connection lost</div></div>
        <div class="issue"><div class="n">${counts.waiting}</div><div class="l">Waiting for owner</div></div>
        <div class="issue"><div class="n">${counts.off}</div><div class="l">Not set up</div></div>
      </div>`;
  }
  function renderBilling() {
    return `<div class="flow-narrow page-stack">
      <h1 class="text-h1">License-Based Pricing</h1>
      <p class="text-body1">Licenses give you access to unlimited integrations, syncs, rules, a dedicated Synder Specialist, and more at a fixed fee per client.</p>
      <p class="text-body1">Book a call to learn more about how license-based pricing works…</p>
      <div><button type="button" class="btn" id="bookCall">Book a call</button></div>
    </div>`;
  }
  function renderClientSetup() {
    const c = findOrg(st.clientId);
    if (!c) return placeholder('Client setup');
    const step = st.setupStep || 'books';
    const idx = SETUP_STEPS.findIndex((s) => s[0] === step);
    const stepr = SETUP_STEPS.map(([k, l], i) =>
      `<span class="${k === step ? 'on' : (i < idx ? 'done' : '')}">${i < idx ? '✓ ' : ''}${l}</span>`).join('');
    const bodies = {
      books: `<div class="empty"><span class="material-icons">account_balance</span>
        <h2>Connect books <span class="draft-tag">details pending</span></h2>
        <p>Connect QuickBooks Online or Xero for ${esc(c.name)}. Exact fields coming from the demo.</p>
        <button class="btn" data-next="integrations">Continue</button>
        <button class="btn-text sec" id="setupBack">Back to Clients</button></div>`,
      integrations: `<div class="empty"><span class="material-icons">hub</span>
        <h2>Connect integrations <span class="draft-tag">details pending</span></h2>
        <p>Shopify, Stripe and others. Or invite the account owner to connect them.</p>
        <button class="btn" data-next="mode">Continue</button>
        <button class="btn-text sec" data-next="books">Back</button>
        <button class="ob-quiet" id="inviteOwner">Invite account owner</button></div>`,
      mode: `<div class="empty"><span class="material-icons">tune</span>
        <h2>Select mode <span class="draft-tag">details pending</span></h2>
        <p>Mode options aren’t locked yet. We won’t show client data until a mode is chosen.</p>
        <button class="btn" data-next="import">Continue</button>
        <button class="btn-text sec" data-next="integrations">Back</button></div>`,
      import: `<div class="empty"><span class="material-icons">download</span>
        <h2>Import data <span class="draft-tag">details pending</span></h2>
        <p>Pull history once books and mode are set. Stub only.</p>
        <button class="btn" id="setupDone">Finish setup</button>
        <button class="btn-text sec" data-next="mode">Back</button></div>`
    };
    return `<button class="crumb" id="crumbBack"><span class="material-icons">arrow_back</span>Clients</button>
      <div class="ph"><div><h1>Set up ${esc(c.name)}</h1></div></div>
      <div class="stepper">${stepr}</div>
      ${bodies[step] || bodies.books}`;
  }

  function sc() { return SCENARIOS[scenario]; }
  function findOrg(id) { return sc().clients.find((c) => c.id === id) || sc().own.find((o) => o.id === id); }
  function isClient(id) { return sc().clients.some((c) => c.id === id); }

  function defaultState() {
    const s = sc();
    if (s.firm) return { ctx: 'firm', page: 'clients', orgId: null, clientId: null, recent: s.clients.slice(0, 4).map((c) => c.id) };
    return { ctx: 'org', page: 'dashboard', orgId: s.own[0].id, clientId: null, recent: [] };
  }
  function load() {
    try {
      const raw = localStorage.getItem('fcs-v10-' + scenario);
      if (raw) {
        const v = JSON.parse(raw);
        if (v && (v.ctx === 'firm' ? sc().firm : findOrg(v.orgId))) { st = v; return; }
      }
    } catch (e) {}
    st = defaultState();
  }
  function save() { try { localStorage.setItem('fcs-v10-' + scenario, JSON.stringify(st)); } catch (e) {} }

  /* ───────── Navigation ───────── */
  function goFirm(page, clientId) {
    if (page === 'client' && clientId !== st.clientId) st.tab = 'work';
    st.ctx = 'firm'; st.page = page || 'clients'; st.clientId = clientId || null;
    if (clientId) touchRecent(clientId);
    save(); render();
  }
  function bindOpenRow(tr, open) {
    tr.onclick = (e) => {
      if (e.target.closest('button, a, input, select, label, .dropdown-menu')) return;
      open();
    };
    tr.onkeydown = (e) => {
      if (e.target !== tr || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      open();
    };
  }
  function openDetails(id) {
    st.ctx = 'firm';
    st.page = 'clientdetail';
    st.clientId = id;
    st.detailTab = 'work';
    st.profileEdit = false;
    st.orgId = null;
    save();
    render();
  }
  function openClient(id, page) {
    const c = findOrg(id);
    if (c && isClient(id) && clientView(c).key === 'off') {
      if (!st || st.ctx !== 'firm' || mode === 'onboarding') {
        st = st || { ctx: 'firm', page: 'clients', orgId: null, clientId: null, recent: [] };
        st.ctx = 'firm'; st.page = 'clients'; st.clientId = null; st.orgId = null;
        mode = 'firm';
        document.body.classList.remove('shell-hide');
        save(); render();
      }
      showNeedConnect(c);
      return;
    }
    st.ctx = 'org'; st.orgId = id; st.clientId = id; st.page = page || 'dashboard';
    if (isClient(id)) touchRecent(id);
    save(); render();
  }
  function showNeedConnect(c) {
    const old = document.getElementById('needConnect');
    if (old) old.remove();
    const modal = document.createElement('div');
    modal.id = 'needConnect';
    modal.className = 'modal-bg show';
    modal.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="needTitle">
      <div class="modal-header" id="needTitle">Connect client</div>
      <div class="modal-body"><p class="text-body2">Connect accounting and integrations to start working with ${esc(c.name)}.</p></div>
      <div class="modal-footer"><button type="button" class="btn-outlined" id="needCancel">Cancel</button><button type="button" class="btn" id="needGo">Connect client</button></div>
    </div>`;
    document.body.appendChild(modal);
    const close = () => modal.remove();
    modal.querySelector('#needCancel').onclick = close;
    modal.onclick = (e) => { if (e.target === modal) close(); };
    modal.querySelector('#needGo').onclick = () => {
      close();
      clearLink();
      st.connectStep = 'details';
      st.connectPick = { accounting: [], sales: [], pay: [] };
      goFirm('clientconnect', c.id);
    };
  }
  function goOrg(orgId, page) {
    if (isClient(orgId)) { openClient(orgId, page === 'dashboard' ? 'dashboard' : page); return; }
    st.ctx = 'org'; st.orgId = orgId; st.page = page || 'dashboard'; st.clientId = null;
    save(); render();
  }
  function touchRecent(id) {
    st.recent = [id].concat((st.recent || []).filter((x) => x !== id)).slice(0, 4);
  }

  /* ───────── Render: trigger + back chip ───────── */
  function renderTrigger() {
    if (st.ctx !== 'firm' && !findOrg(st.orgId)) {
      st.ctx = 'firm'; st.orgId = null; st.clientId = null;
      if (st.page === 'dashboard') st.page = 'clients';
    }
    let name, cap, obj;

  function preTableRows(story, tab) {
    const n = story.counts[tab] || 0;

    const rows = [];
    for (let i = 0; i < n; i++) {
      if (tab === 'books' && i < 3) {
        rows.push({ date: 'Oct ' + [12, 15, 18][i] + ', 2026', desc: platform + ' payout', left: [1540, 1420, 1250][i], right: null });
        continue;
      }
      if (tab === 'differs' && i === 0) {
        rows.push({ date: 'Oct 20, 2026', desc: platform + ' fee', left: -612.4, right: 612.4 });
        continue;
      }
      if (tab === 'differs' && i === 1) {
        rows.push({ date: 'Oct 22, 2026', desc: 'Refund', left: -89, right: -178 });
        continue;
      }
      const day = (i % 28) + 1;
      const amt = Math.round((40 + (i * 17) % 800) * 100) / 100;
      const date = 'Oct ' + day + ', 2026';
      if (tab === 'matched') rows.push({ date, desc: 'Card payment', left: amt, right: amt });

  function bindReviewFirm() {
    const search = $('obSearch');
    if (search) search.oninput = () => {
      ob.q = search.value; saveOb(); renderMain();
      const n = $('obSearch'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    };
    const all = $('obAll');
    if (all) {
      const q = (ob.q || '').toLowerCase();
      const rows = IMPORT_POOL.filter((c) => (!q || c.name.toLowerCase().includes(q)) && !alreadyInFirm(c));
      const picked = rows.filter((c) => ob.selected[c.id] === true).length;
      all.checked = rows.length > 0 && picked === rows.length;
      all.indeterminate = picked > 0 && picked < rows.length;
      all.onchange = () => {
        const query = (ob.q || '').toLowerCase();
        IMPORT_POOL.filter((c) => !query || c.name.toLowerCase().includes(query)).forEach((c) => { if (!alreadyInFirm(c)) ob.selected[c.id] = all.checked; });
        saveOb();
        renderMain();
      };
    }
    document.querySelectorAll('[data-cid]').forEach((cb) => cb.onchange = () => {
      if (cb.dataset.have === '1') { cb.checked = false; const err = $('pickError'); if (err) { err.hidden = false; err.textContent = 'Already in your firm'; } return; }
      ob.selected[cb.dataset.cid] = cb.checked; saveOb(); renderMain();
    });
    const add = $('obAdd');
    if (add) add.onclick = () => {
      const chosen = IMPORT_POOL.filter((c) => ob.selected[c.id] === true && !alreadyInFirm(c));
      const err = $('pickError');
      if (!chosen.length) { if (err) err.hidden = false; return; }
      if (err) err.hidden = true;
      addImported(chosen.map((c) => ({ id: c.id, name: c.name })));
    };
    const cancel = $('reviewCancel');
    if (cancel) cancel.onclick = () => { if (ob) { ob.picker = false; saveOb(); } goFirm('clients'); };
  }

    document.body.appendChild(modal);
    const close = () => modal.remove();
    modal.onclick = (e) => { if (e.target === modal) close(); };

    if (cancel) cancel.onclick = close;

        st.page = 'colleagues';

    }

          st.page = 'clienthealth';
        } else if (parts[2] === 'pre-assessment') {
          st.page = 'preassess';
        } else {
          st.page = 'clientdetail';
          st.detailTab = parts[2] === 'billing' || parts[2] === 'colleagues' ? parts[2] : 'work';
        }
        closePop();
        render();
        return;
      }
      goFirm('clients');
      return;
    }
    if (head === 'client' && parts[1]) {
      scenario = 'firm';
      load();
      if (!(ob && ob.directoryReady)) { goOnboarding('home'); return; }
      mode = 'firm';
      document.body.classList.remove('shell-hide');
      if (findOrg(parts[1]) && isClient(parts[1])) {
        const page = parts[2] || 'dashboard';
        openClient(parts[1], page);
        return;
      }
      goFirm('clients');
      return;
    }
    if (head === 'existing') { enterExisting(); return; }
    if (head === 'home' || head === 'start') { goOnboarding('home'); return; }
    if (head === 'onboarding') {
      loadOb();
      const step = parts[1] || 'entry';
      const toFirm = { import: 'import', sources: 'import', review: 'review', add: 'addone' };
      if (toFirm[step] && ob.directoryReady) {

        document.body.classList.remove('shell-hide');

      const next = map[step] || step;
      ob.step = ['entry', 'signup', 'login', 'join', 'joinok'].includes(next) ? next : 'entry';
      goOnboarding(ob.step);

        <p class="text-subtitle1">${esc(s.kicker)}</p>
        <h2 class="text-h2" id="storyTitle">${esc(s.title)}</h2>
        <p class="text-body1">${esc(s.body)}</p>
        <div class="story-chips">${chips}</div>
        <p class="text-caption">Step ${storyIndex + 1} of ${STORY.length}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-outlined" id="storyBack"${storyIndex === 0 ? ' hidden' : ''}>Back</button>
        <button type="button" class="btn" id="storyNext">${last ? 'Connect your first client' : 'Next'}</button>
      </div>
    </div>`;
    const box = modal.querySelector('.story-modal');
    modal.querySelector('#storySkip').onclick = () => closeStory(false);
    modal.querySelector('#storyBack').onclick = () => storyGo(storyIndex - 1);
    modal.querySelector('#storyNext').onclick = () => storyGo(storyIndex + 1);
    modal.querySelector('#storyHitBack').onclick = () => storyGo(storyIndex - 1);
    modal.querySelector('#storyHitNext').onclick = () => storyGo(storyIndex + 1);
    if (!reduce) {
      const fill = modal.querySelector('.story-fill.is-run');
      if (fill) requestAnimationFrame(() => { fill.style.width = '100%'; });
      armStory(5000, !last);
      box.addEventListener('mouseenter', () => {
        if (!storyTimer) return;
        storyRemain = Math.max(200, storyDeadline - Date.now());
        stopStoryTimer();
        const live = modal.querySelector('.story-fill.is-run');
        if (live) {
          const pct = storyFillPct(live);
          live.style.transition = 'none';
          live.style.width = pct + '%';
        }
      });
      box.addEventListener('mouseleave', () => {
        if (storyTimer || storyReduce()) return;
        const live = modal.querySelector('.story-fill.is-run');
        if (live) {
          live.style.transition = `width ${storyRemain}ms linear`;
          requestAnimationFrame(() => { live.style.width = '100%'; });
        }
        armStory(storyRemain, storyIndex < STORY.length - 1);
      });
      if (box.matches(':hover')) box.dispatchEvent(new MouseEvent('mouseenter'));
    }
  }
  function rainSparkles(done) {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { if (done) done(); return; }
    var COLORS = ["#FFFFFF", "#FFF6C2", "#FFE45C", "#9AD0FF", "#7EE0FF", "#B9F6CA", "#FFD6E8"];
    var SHAPES = ["star", "dot", "diamond"];
    var COUNT = 240;
    function rand(min, max) {
      return min + Math.random() * (max - min);
    }
    var layer = document.createElement("div");
    layer.className = "spark-fall";
    layer.setAttribute("aria-hidden", "true");
    var vh = window.innerHeight;
    var maxDelay = 0;
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement("span");
      var second = i >= 160;
      var size = second ? rand(2.5, 5) : rand(3, 7);
      var shape = SHAPES[i % SHAPES.length];
      var delay = second ? Math.round(rand(950, 1300)) : Math.round(rand(0, 320));
      var dur = second ? rand(0.55, 0.8) : rand(0.75, 1.1);
      maxDelay = Math.max(maxDelay, delay + dur * 1000);
      el.className = "spark " + shape;
      el.style.setProperty("--x", rand(8, 92) + "%");
      el.style.setProperty("--y", rand(-24, 8) + "px");
      el.style.setProperty("--fall", rand(vh * 0.22, vh * 0.48) + "px");
      el.style.setProperty("--drift", rand(-90, 90) + "px");
      el.style.setProperty("--spin", Math.round(rand(120, 320)) + "deg");
      el.style.setProperty("--size", size + "px");
      el.style.setProperty("--color", COLORS[i % COLORS.length]);
      el.style.setProperty("--delay", delay + "ms");
      el.style.setProperty("--dur", dur + "s");
      layer.appendChild(el);
    }
    document.body.appendChild(layer);
    window.setTimeout(function () {
      if (layer.parentNode) layer.parentNode.removeChild(layer);
      if (done) done();
    }, maxDelay + 80);
  }
  document.querySelectorAll('#modeSeg button').forEach((b) => b.onclick = () => {
    if (b.dataset.m === 'existing') enterExisting();
    else restartOnboarding();
  });
  function clearV10Storage() {
    const drop = (store) => {
      const keys = [];
      for (let i = 0; i < store.length; i++) {
        const k = store.key(i);
        if (k && k.indexOf('v10') !== -1 && k.indexOf('fcs-') === 0) keys.push(k);
      }
      keys.forEach((k) => store.removeItem(k));
    };
    try { drop(localStorage); } catch (e) {}
    try { drop(sessionStorage); } catch (e) {}
  }
  function resetPrototype() {
    const variant = (ob && ob.variant === 'existing') ? 'existing' : 'new';
    closePop(); closeModal(); closeMenus();
    clearV10Storage();
    if (variant === 'existing') {
      enterExisting();
    } else {
      restartOnboarding();
    }
  }
  $('protoReset').onclick = resetPrototype;

  /* ───────── Top bar menus ───────── */
  function goTop(page) { closeMenus(); st.page = page; st.clientId = null; save(); render(); }
  function renderUserMenu() {
    const items = [];
    if (sc().firm) items.push(['myfirm', 'domain', 'My firm']);
    items.push(['orgsettings', 'tune', 'Organization settings'], ['activity', 'history', 'Activity log'],
      ['profile', 'person_outline', 'User profile'], ['orglist', 'list', 'List of organizations']);
    $('userMenu').innerHTML = `<div class="who"><b>Ignat Plot</b><span>ignat@wlslabs.com</span></div>` +
      items.map(([k, ic, l]) => `<button data-um="${k}"><span class="material-icons">${ic}</span>${l}</button>`).join('') +
      `<div class="div"></div><button data-um="logout"><span class="material-icons">logout</span>Log out</button>`;
    $('userMenu').querySelectorAll('[data-um]').forEach((b) => b.onclick = () => {
      const k = b.dataset.um;
      if (k === 'myfirm') { closeMenus(); goFirm('clients'); }
      else if (k === 'logout') { closeMenus(); openLogout(); }
      else goTop(k);
    });
  }
  function openLogout() {
    $('modal').innerHTML = `<h3>Log out</h3><p>This prototype keeps you signed in, so you can keep exploring.</p>
      <div class="modal-actions"><button class="btn" id="doneModal">OK</button></div>`;
    $('scrim').classList.add('open'); $('doneModal').onclick = closeModal;
  }
  function closeMenus() {
    const mm = $('moreMenu'); if (mm) { mm.classList.remove('open'); $('moreBtn').setAttribute('aria-expanded', 'false'); }
    ['helpMenu', 'userMenu'].forEach((id) => $(id).classList.remove('open'));
    ['helpBtn', 'userBtn'].forEach((id) => $(id).setAttribute('aria-expanded', 'false'));
  }
  function toggleMenu(btn, menu) {
    const open = !$(menu).classList.contains('open'); closeMenus(); closePop();
    if (open) { $(menu).classList.add('open'); $(btn).setAttribute('aria-expanded', 'true'); }
  }
  $('helpBtn').onclick = () => toggleMenu('helpBtn', 'helpMenu');
  $('userBtn').onclick = () => toggleMenu('userBtn', 'userMenu');
  document.querySelectorAll('[data-top]').forEach((b) => b.onclick = () => goTop(b.dataset.top));
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('.t-wrap')) closeMenus(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });

  $('kbdHint').textContent = isMac ? '⌘K' : 'Ctrl K';
  loadOb();
  restoreDirectory();
  writeLocation(location.hash);
  const boot = (location.hash || '#firm').slice(1);
  if (boot.split('/')[0] === 'onboarding' || (!localStorage.getItem('fcs-ob-v10') && boot.split('/')[0] !== 'firm')) {
    // Prefer explicit hash; otherwise stay on firm workspace for this prototype
  }
  setScenario(boot || 'firm');
})();
</script>
</body>
