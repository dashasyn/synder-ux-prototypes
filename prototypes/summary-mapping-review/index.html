<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summary mapping review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
  :root {
    --primary: #0053CC;
    --primary-hover: #1A43A2;
    --nav: #007AFF;
    --border: #DFE4EC;
    --text: #1A1B24;
    --muted: #6B778C;
    --sidebar: #F6F6F6;
    --sidebar-text: #555555;
    --divider: #C8C7CC;
    --needs: #FFF1DD;
    --danger: #9A3412;
    --ok: #1F8940;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Roboto, Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 20px;
    color: var(--text);
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  button, input, select, textarea, option, legend, label { font-family: inherit; font-size: 14px; line-height: 20px; color: inherit; }
  h1, h2, p { margin: 0; }
  h1 { font-size: 28px; line-height: 32px; font-weight: 300; }
  h2 { font-size: 20px; line-height: 28px; font-weight: 400; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .proto-bar {
    flex: none; background: #1A1B24; color: #fff; min-height: 40px;
    display: flex; align-items: center; gap: 16px; padding: 4px 16px; font-size: 14px;
  }
  .proto-bar strong { font-size: 16px; font-weight: 500; }
  .proto-bar .sep { width: 1px; height: 20px; background: rgba(255,255,255,.3); }
  .variant { height: 32px; padding: 0 12px; border-radius: 4px; border: 0; background: var(--primary); color: #fff; font-size: 14px; }
  .shell { flex: 1; min-height: 0; display: flex; }
  .sidebar {
    width: 220px; flex: none; background: var(--sidebar); border-right: 1px solid var(--divider);
    color: var(--sidebar-text); overflow: auto; font-size: 14px;
  }
  .org { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--divider); color: var(--text); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #C2185B; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .nav-btn, .nav-sub {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 12px;
    border: 0; border-bottom: 1px solid var(--divider); background: transparent; color: var(--sidebar-text);
    text-align: left; font-size: 14px; text-decoration: none;
  }
  .nav-btn:hover, .nav-sub:hover { background: #D9D9D9; }
  .nav-btn.open { background: #D9D9D9; }
  .nav-sub { padding-left: 36px; border-bottom: 0; }
  .nav-sub[aria-current="page"] { background: var(--nav); color: #fff; }
  .nav-group { border-bottom: 1px solid var(--divider); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 48px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 16px;
    padding: 0 16px; border-bottom: 1px solid var(--divider);
  }
  .balance { font-size: 16px; color: var(--nav); border-bottom: 3px solid var(--nav); padding: 2px 0; }
  .top-link { background: none; border: 0; color: var(--nav); font-size: 16px; padding: 4px 0; }
  .icon-btn { width: 32px; height: 32px; border: 0; background: transparent; color: var(--nav); border-radius: 4px; }
  .content { flex: 1; overflow: auto; padding: 12px 16px 16px; }
  .page-head { margin-bottom: 8px; }
  .subtitle, .flow, .save-note { color: var(--muted); font-size: 14px; line-height: 20px; }
  .flow { margin-top: 2px; color: var(--text); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 4px; }
  .save-note { margin: 0 0 8px; max-width: 90ch; }
  .btn, .btn-outlined, .btn-text {
    height: 32px; padding: 4px 14px; border-radius: 4px; border: 1px solid transparent;
    background: var(--primary); color: #fff; font-size: 14px;
  }
  .btn:hover:not(:disabled) { background: var(--primary-hover); }
  .btn:disabled { background: #E8EBF0; color: #555; }
  .btn-outlined { background: #fff; color: var(--primary); border-color: var(--primary); }
  .btn-outlined:hover:not(:disabled) { background: rgba(0,83,204,.04); }
  .btn-outlined[aria-pressed="true"] { background: #E0EBFD; }
  .btn-text { background: none; border: 0; color: var(--primary); padding: 4px 8px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
  .filters label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
  .input, .select {
    height: 32px; border: 1px solid var(--border); border-radius: 4px; background: #fff;
    padding: 0 8px; color: var(--text); font-size: 14px;
  }
  .input:focus, .select:focus { border-color: var(--primary); outline: 2px solid rgba(0,83,204,.25); outline-offset: 0; }
  .search { width: 220px; }
  .card { border: 1px solid var(--border); border-radius: 4px; background: #fff; }
  .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); }
  .tabs button {
    height: 36px; padding: 0 12px; border: 0; background: transparent; color: var(--muted);
    border-bottom: 2px solid transparent; font-size: 14px; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
  .selbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 8px 10px; border-bottom: 1px solid var(--border); background: #F2F6FC; font-size: 14px;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 1180px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px; font-weight: 400; }
  th { height: 36px; background: #fff; }
  tr.needs td { background: var(--needs); }
  tr.account-unsaved td { box-shadow: inset 3px 0 0 var(--primary); }
  .status-needs { color: var(--danger); }
  .status-proposed { color: var(--muted); }
  .status-unsaved { color: var(--primary); }
  .status-confirmed { color: var(--ok); }
  .note { display: block; color: var(--muted); font-size: 14px; }
  .cell-error { display: block; color: #CC2929; margin-top: 4px; font-size: 14px; }
  .combo-input { width: 210px; }
  .dim-input { width: 150px; }
  .mark {
    width: 20px; height: 20px; border-radius: 4px; color: #fff; display: inline-flex;
    align-items: center; justify-content: center; font-size: 14px; margin-right: 6px;
  }
  .integ { display: inline-flex; align-items: center; white-space: nowrap; }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 12px; min-height: 40px; padding: 6px 10px; font-size: 14px; }
  #combo-pop {
    position: fixed; z-index: 40; background: #fff; border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 4px 16px rgba(26,27,36,.12); max-height: 240px; overflow: auto; padding: 4px 0;
  }
  #combo-pop[hidden] { display: none; }
  #combo-pop [role="option"] { padding: 8px 12px; font-size: 14px; cursor: pointer; }
  #combo-pop [role="option"][aria-selected="true"], #combo-pop [role="option"]:hover { background: #E0EBFD; }
  .empty-copy { padding: 12px; }
  .empty-copy strong, .empty-copy p { font-size: 14px; display: block; }
  .empty-copy p { color: var(--muted); margin-top: 4px; }
  .modal-back { position: fixed; inset: 0; background: rgba(26,27,36,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { background: #fff; width: 640px; max-width: 100%; max-height: calc(100vh - 48px); border-radius: 4px; display: flex; flex-direction: column; }
  .modal h2 { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-body { padding: 16px 20px; overflow: auto; }
  .modal-body p { margin-bottom: 8px; font-size: 14px; }
  .warn { background: #FFF1DD; border: 1px solid #E7C8A0; border-radius: 4px; padding: 8px 12px; margin: 8px 0; font-size: 14px; }
  .preview, .skipped { list-style: none; margin: 0 0 12px; padding: 0; max-height: 180px; overflow: auto; border: 1px solid var(--border); }
  .preview li, .skipped li { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
  .field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); margin-bottom: 8px; }
  .sim h1 { margin-bottom: 8px; }
  .sim p { margin-bottom: 16px; }
  .toast { position: fixed; right: 16px; bottom: 16px; z-index: 60; background: #1F8940; color: #fff; padding: 12px 16px; border-radius: 4px; font-size: 14px; display: none; }
  .toast.on { display: block; }
</style>
</head>
<body>
  <div class="proto-bar">
    <strong>Summary mapping review</strong>
    <span class="sep" aria-hidden="true"></span>
    <div role="group" aria-label="Variant">
      <button type="button" class="variant" aria-pressed="true">Single table</button>
    </div>
  </div>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="org"><span class="avatar">DS</span><span>DS_test_2_dasha</span></div>
      <button type="button" class="nav-btn" id="nav-dashboard">Dashboard</button>
      <div class="nav-group">
        <button type="button" class="nav-btn open" aria-expanded="true">Mapping</button>
        <a class="nav-sub" href="#mappings" id="nav-mappings" aria-current="page">Mappings list</a>
        <a class="nav-sub" href="#groups">Groups</a>
      </div>
      <button type="button" class="nav-btn" id="nav-summaries">Summaries</button>
      <button type="button" class="nav-btn">Reconciliation</button>
      <button type="button" class="nav-btn">Products and services</button>
      <button type="button" class="nav-btn">Settings</button>
    </nav>
    <div class="main">
      <header class="topbar">
        <span class="balance">Balance : 10000</span>
        <button type="button" class="top-link">How it works?</button>
        <button type="button" class="icon-btn" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></button>
        <button type="button" class="icon-btn" aria-label="Help"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7V14"/><path d="M12 17h.01"/></svg></button>
        <button type="button" class="icon-btn" aria-label="Account menu"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 4-4.5 7-4.5S17.5 16 19 19"/></svg></button>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div id="combo-pop" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var STORAGE = 'synder-summary-mapping-review-v2';
  var PER = 10;
  var LOCATIONS = ['Berlin', 'Stripe', 'Test'];
  var BANK_REASON = 'Bank accounts are entered by hand. Synder does not suggest an account for this row.';
  var EMPTY_REASON = 'No compatible account was proposed for this group.';
  var PLACEHOLDER = 'Search or start typing...';
  var INTEGRATIONS = [
    { id: 'stripe-1', provider: 'stripe', name: 'Test account_1 (Stripe)', mark: 'S', color: '#635bff' },
    { id: 'paypal-1', provider: 'paypal', name: 'Example Checkout (PayPal)', mark: 'P', color: '#003087' },
    { id: 'shopify-1', provider: 'shopify', name: 'Example Store (Shopify)', mark: 'S', color: '#5c8c3e' }
  ];
  var PROVIDER_ACCOUNTS = {
    stripe: { fees: 'stripe-fees', expenses: 'stripe-expenses', clearing: 'stripe-clearing', sales: 'stripe-sales' },
    paypal: { fees: 'paypal-fees', expenses: 'paypal-expenses', clearing: 'paypal-clearing', sales: 'paypal-sales' },
    shopify: { fees: 'shopify-fees', expenses: 'shopify-expenses', clearing: 'shopify-clearing', sales: 'shopify-sales' }
  };
  var ACCOUNTS = [
    { id: 'stripe-fees', name: 'Stripe fees', type: 'Expense' },
    { id: 'stripe-expenses', name: 'Stripe expenses', type: 'Expense' },
    { id: 'ar', name: 'Accounts Receivable (A/R)', type: 'Accounts Receivable' },
    { id: 'stripe-clearing', name: 'Stripe clearing (Synder)', type: 'Other Current Asset' },
    { id: 'fx', name: 'Exchange Gain or Loss', type: 'Other Expense' },
    { id: 'stripe-sales', name: 'Stripe sales', type: 'Income' },
    { id: 'paypal-fees', name: 'PayPal fees', type: 'Expense' },
    { id: 'paypal-expenses', name: 'PayPal expenses', type: 'Expense' },
    { id: 'paypal-clearing', name: 'PayPal clearing', type: 'Other Current Asset' },
    { id: 'paypal-sales', name: 'PayPal sales', type: 'Income' },
    { id: 'shopify-fees', name: 'Shopify fees', type: 'Expense' },
    { id: 'shopify-expenses', name: 'Shopify expenses', type: 'Expense' },
    { id: 'shopify-clearing', name: 'Shopify clearing', type: 'Other Current Asset' },
    { id: 'shopify-sales', name: 'Shopify sales', type: 'Income' },
    { id: 'sales-tax', name: 'Sales tax payable', type: 'Other Current Liability' },
    { id: 'shipping-income', name: 'Shipping income', type: 'Income' },
    { id: 'discounts', name: 'Discounts given', type: 'Income' },
    { id: 'inventory', name: 'Inventory Asset', type: 'Other Current Asset' },
    { id: 'cogs', name: 'Cost of Goods Sold', type: 'Cost of Goods Sold' },
    { id: 'gift-card', name: 'Gift card liability', type: 'Other Current Liability' },
    { id: 'customer-dep', name: 'Customer deposits', type: 'Other Current Liability' },
    { id: 'bad-debt', name: 'Bad debt expense', type: 'Expense' },
    { id: 'deferred', name: 'Deferred Revenue', type: 'Other Current Liability' },
    { id: 'unapplied', name: 'Unapplied cash payment income', type: 'Income' },
    { id: 'tips', name: 'Tips income', type: 'Income' },
    { id: 'gift-wrap', name: 'Gift wrap income', type: 'Income' },
    { id: 'subscriptions', name: 'Subscription income', type: 'Income' },
    { id: 'checking', name: 'Example checking', type: 'Bank' },
    { id: 'savings', name: 'Example savings', type: 'Bank' }
  ];
  var GROUPS = [
    g('transfers', 'Transfers to balance', 'Other Current Asset', ['Other Current Asset'], 'clearing'),
    g('chargebacks', 'Chargebacks', 'Expense', ['Expense'], 'expenses'),
    g('refunds', 'Refunds', 'Income', ['Income'], 'sales'),
    g('sales', 'Sales', 'Income', ['Income'], 'sales'),
    g('clearing', 'Clearing', 'Other Current Asset', ['Other Current Asset'], 'clearing'),
    g('expenses', 'Expenses', 'Expense', ['Expense'], 'expenses'),
    g('fees', 'Fees', 'Expense', ['Expense'], 'fees'),
    g('invoices', 'Invoices', 'Accounts Receivable', ['Accounts Receivable'], 'ar'),
    g('tax', 'Sales tax payable', 'Other Current Liability', ['Other Current Liability'], 'sales-tax'),
    g('shipping-income', 'Shipping income', 'Income', ['Income'], 'shipping-income'),
    g('discounts', 'Discounts', 'Income', ['Income'], 'discounts'),
    g('inventory', 'Inventory assets', 'Other Current Asset', ['Other Current Asset'], 'inventory'),
    g('cogs', 'Cost of Goods sold', 'Cost of Goods Sold', ['Cost of Goods Sold'], 'cogs'),
    g('gift', 'Gift card liability', 'Other Current Liability', ['Other Current Liability'], 'gift-card'),
    g('customer', 'Customer Balance', 'Other Current Liability', ['Other Current Liability'], 'customer-dep'),
    g('bad', 'Bad Debts', 'Expense', ['Expense'], 'bad-debt'),
    g('deferred', 'Deferred Revenue', 'Other Current Liability', ['Other Current Liability'], 'deferred'),
    g('shipping-fees', 'Shipping fees', 'Expense', ['Expense'], 'expenses'),
    g('unapplied', 'Unapplied cash payment income', 'Income', ['Income'], 'unapplied'),
    g('tips', 'Tips', 'Income', ['Income'], 'tips'),
    g('exchange', 'Exchange adjustments', 'Other Expense', ['Other Expense'], 'fx'),
    g('rounding', 'Rounding differences', 'Other Expense', ['Other Expense'], 'fx'),
    g('advertising', 'Advertising', 'Expense', ['Expense'], 'expenses'),
    g('commissions', 'Commissions', 'Expense', ['Expense'], 'fees'),
    g('wholesale', 'Wholesale sales', 'Income', ['Income'], 'sales'),
    g('giftwrap', 'Gift wrap', 'Income', ['Income'], 'gift-wrap'),
    g('subscriptions', 'Subscriptions', 'Income', ['Income'], 'subscriptions'),
    g('packaging', 'Packaging', 'Expense', ['Expense'], 'expenses'),
    g('withheld', 'Tax withheld by marketplace', 'Other Current Liability', ['Other Current Liability'], '', EMPTY_REASON),
    g('reserves', 'Balance Reserves', 'Other Current Asset', ['Other Current Asset'], '', EMPTY_REASON),
    g('stored', 'Stored Balances', 'Other Current Liability', ['Other Current Liability'], '', EMPTY_REASON),
    g('duties', 'Duties', 'Other Current Liability', ['Other Current Liability'], '', EMPTY_REASON),
    g('reserve-release', 'Reserve release', 'Other Current Asset', ['Other Current Asset'], '', EMPTY_REASON)
  ];
  var COMPANIONS = [
    { parent: 'sales', key: 'sales-ex1', name: 'Morning blend' },
    { parent: 'sales', key: 'sales-ex2', name: 'Weekend set' },
    { parent: 'sales', key: 'sales-ex3', name: 'Gift tin' },
    { parent: 'fees', key: 'fees-ex1', name: 'Card fee' },
    { parent: 'fees', key: 'fees-ex2', name: 'Cross-border fee' },
    { parent: 'refunds', key: 'refunds-ex1', name: 'Partial refund' },
    { parent: 'clearing', key: 'clearing-ex1', name: 'Payout in transit' }
  ];

  function g(key, name, subtype, types, suggest, reason) {
    return { key: key, name: name, subtype: subtype, types: types, suggest: suggest || '', reason: reason || '' };
  }
  function accountById(id) { return ACCOUNTS.filter(function (a) { return a.id === id; })[0] || null; }
  function accountName(id) { var a = accountById(id); return a ? a.name : ''; }
  function resolveSuggestion(token, provider) {
    if (!token) return '';
    if (PROVIDER_ACCOUNTS[provider] && PROVIDER_ACCOUNTS[provider][token]) return PROVIDER_ACCOUNTS[provider][token];
    return token;
  }
  function bankName(provider) {
    if (provider === 'stripe') return 'Stripe transfers';
    if (provider === 'paypal') return 'PayPal transfers';
    return 'Shopify payouts';
  }
  function firstCompatibleName(types, suggestion) {
    if (suggestion && accountById(suggestion) && types.indexOf(accountById(suggestion).type) >= 0) return accountName(suggestion);
    var found = ACCOUNTS.filter(function (a) { return types.indexOf(a.type) >= 0; })[0];
    return found ? found.name : '';
  }
  function isValid(row, accountId) {
    if (!accountId) return false;
    var account = accountById(accountId);
    return !!(account && row.types.indexOf(account.type) >= 0);
  }
  function makeRow(spec) {
    var suggestion = spec.manual ? '' : (spec.suggestion || '');
    return {
      id: spec.id, group: spec.group, subtype: spec.subtype, gateway: 'Online Sales',
      integrationId: spec.integrationId, integrationName: spec.integrationName, integIndex: spec.integIndex,
      mark: spec.mark, color: spec.color, types: spec.types, suggestion: suggestion, manual: !!spec.manual,
      reason: spec.reason || '', order: spec.order, okAccountName: firstCompatibleName(spec.types, suggestion),
      saved: { account: suggestion, location: '', className: '', confirmed: false },
      draft: { account: suggestion, location: '', className: '' }
    };
  }
  function buildRows() {
    var rows = [];
    INTEGRATIONS.forEach(function (integ, ii) {
      GROUPS.forEach(function (group, gi) {
        rows.push(makeRow({
          id: integ.id + ':' + group.key, group: group.name, subtype: group.subtype, types: group.types,
          suggestion: resolveSuggestion(group.suggest, integ.provider), reason: group.reason, manual: false,
          integrationId: integ.id, integrationName: integ.name, integIndex: ii, mark: integ.mark, color: integ.color, order: gi + 1
        }));
      });
      rows.push(makeRow({
        id: integ.id + ':bank', group: bankName(integ.provider), subtype: 'Bank', types: ['Bank'], suggestion: '',
        reason: BANK_REASON, manual: true, integrationId: integ.id, integrationName: integ.name, integIndex: ii,
        mark: integ.mark, color: integ.color, order: 800
      }));
      COMPANIONS.forEach(function (comp, ci) {
        var parent = GROUPS.filter(function (group) { return group.key === comp.parent; })[0];
        rows.push(makeRow({
          id: integ.id + ':' + comp.key, group: comp.name, subtype: parent.subtype, types: parent.types,
          suggestion: resolveSuggestion(parent.suggest, integ.provider), reason: '', manual: false,
          integrationId: integ.id, integrationName: integ.name, integIndex: ii, mark: integ.mark, color: integ.color, order: 5000 + ci
        }));
      });
    });
    return rows;
  }

  var ui = { combo: null };
  var S = null;
  function fresh() {
    return { rows: buildRows(), integration: 'all', status: 'all', group: 'all', q: '', missingOnly: false, page: 1, selected: {}, view: 'mappings', dialog: null };
  }
  function accountDirty(r) { return r.draft.account !== r.saved.account; }
  function dimsDirty(r) { return r.draft.location !== r.saved.location || r.draft.className !== r.saved.className; }
  function isPending(r) { return accountDirty(r) || dimsDirty(r); }
  function accountStatus(r) {
    if (!r.draft.account || !isValid(r, r.draft.account)) return { key: 'needs', label: 'Needs account' };
    if (accountDirty(r)) return { key: 'unsaved', label: 'Unsaved' };
    if (r.saved.confirmed) return { key: 'confirmed', label: 'Confirmed' };
    return { key: 'proposed', label: 'Proposed' };
  }
  function missingRows() { return S.rows.filter(function (r) { return accountStatus(r).key === 'needs'; }); }
  function canContinue() {
    return S.rows.every(function (r) {
      return r.saved.confirmed && isValid(r, r.saved.account) && r.draft.account === r.saved.account;
    });
  }
  function rowById(id) { return S.rows.filter(function (r) { return r.id === id; })[0]; }
  function isMapped(r) { return accountStatus(r).key === 'confirmed'; }
  function filteredRows() {
    var q = S.q.trim().toLowerCase();

    if (t.id === 'filter-status') { S.status = t.value; S.page = 1; render(); }
    else if (t.id === 'filter-group') { S.group = t.value; S.page = 1; render(); }
    else if (t.id === 'bulk-account') { S.dialog.accountId = t.value; render(); }
    else if (t.id === 'sel-page') {
      currentPage().forEach(function (r) { if (t.checked) S.selected[r.id] = true; else delete S.selected[r.id]; });
      render();
    } else if (t.dataset && t.dataset.select) {
      if (t.checked) S.selected[t.dataset.select] = true; else delete S.selected[t.dataset.select];
      render();
    }
  });
  document.getElementById('content').addEventListener('keydown', function (e) {
    var t = e.target;
    if (S.dialog && e.key === 'Escape') { S.dialog = null; render(); e.preventDefault(); return; }
    if (!t.dataset || !t.dataset.field) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var opening = !ui.combo || ui.combo.rowId !== t.dataset.rowId || ui.combo.field !== t.dataset.field;
      if (opening) ui.combo = { rowId: t.dataset.rowId, field: t.dataset.field, query: t.value || '', active: 0 };
      var options = optionsFor(rowById(t.dataset.rowId), t.dataset.field, ui.combo.query);
      if (!opening && options.length) {
        ui.combo.active += e.key === 'ArrowDown' ? 1 : -1;
        if (ui.combo.active < 0) ui.combo.active = options.length - 1;
        if (ui.combo.active >= options.length) ui.combo.active = 0;
      }
      t.setAttribute('aria-expanded', 'true');
      paintPop();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (!ui.combo) return;
      var list = optionsFor(rowById(ui.combo.rowId), ui.combo.field, ui.combo.query);
      if (list[ui.combo.active]) choose(ui.combo.rowId, ui.combo.field, list[ui.combo.active].value);
    } else if (e.key === 'Escape') {
      ui.combo = null; paintPop(); t.setAttribute('aria-expanded', 'false'); e.preventDefault();
    }
  });
  document.getElementById('content').addEventListener('click', function (e) {
    var t = e.target.closest('button, a');
    if (!t) return;
    if (t.id === 'save-mappings') { saveMappings(); render(); toast('Mappings saved. Blank accounts still need an account.'); }
    else if (t.id === 'discard') { discardAll(); render(); toast('Unsaved changes discarded'); }
    else if (t.id === 'reset-demo') { localStorage.removeItem(STORAGE); ui.combo = null; S = fresh(); persist(); render(); toast('Demo reset'); }
    else if (t.id === 'continue-btn') { if (canContinue()) { ui.combo = null; S.dialog = null; S.view = 'summaries'; render(); } }
    else if (t.id === 'missing-filter') { S.missingOnly = !S.missingOnly; S.page = 1; render(); }
    else if (t.id === 'reset-filters') { S.status = 'all'; S.group = 'all'; S.q = ''; S.missingOnly = false; S.integration = 'all'; S.page = 1; render(); }
    else if (t.id === 'change-account') { if (selectedIds().length) { ui.combo = null; S.dialog = { accountId: '', focus: true }; render(); } }
    else if (t.id === 'clear-selection') { S.selected = {}; render(); }
    else if (t.id === 'prev-page') { S.page -= 1; render(); }
    else if (t.id === 'next-page') { S.page += 1; render(); }
    else if (t.id === 'back-to-mappings') { S.view = 'mappings'; render(); }
    else if (t.id === 'bulk-cancel') { S.dialog = null; render(); }
    else if (t.id === 'bulk-stage') {
      var n = stageBulk(S.dialog.accountId);
      S.dialog = null;
      render();
      if (n) toast('Account change staged for ' + n + (n === 1 ? ' row. Save mappings to keep it.' : ' rows. Save mappings to keep it.'));
    } else if (t.dataset && t.dataset.revert) { revertRow(t.dataset.revert); render(); }
    else if (t.dataset && t.dataset.tab) { S.integration = t.dataset.tab; S.page = 1; render(); }
  });
  document.getElementById('content').addEventListener('scroll', function () { if (ui.combo) paintPop(); });
  document.getElementById('nav-summaries').addEventListener('click', function () { if (canContinue()) { S.view = 'summaries'; render(); } });
  document.getElementById('nav-mappings').addEventListener('click', function (e) { e.preventDefault(); S.view = 'mappings'; render(); });
  document.getElementById('nav-dashboard').addEventListener('click', function () { S.view = 'mappings'; render(); });
  load();
  persist();
  render();
})();
</script>
</body>
</html>
