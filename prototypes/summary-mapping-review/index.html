<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summary mapping review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
  :root {
    --primary: #0053CC;
    --primary-hover: #1A43A2;
    --nav: #007AFF;
    --border: #DFE4EC;
    --text: #1A1B24;
    --muted: #6B778C;
    --sidebar: #F6F6F6;
    --sidebar-text: #555555;
    --divider: #C8C7CC;
    --needs: #FFF1DD;
    --danger: #9A3412;
    --ok: #1F8940;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Roboto, Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 20px;
    color: var(--text);
    background: #fff;
    display: flex;
    flex-direction: column;
    min-width: 1280px;
  }
  button, input, select, textarea, option, legend, label { font-family: inherit; font-size: 14px; line-height: 20px; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 28px; line-height: 36px; font-weight: 300; }
  h2 { font-size: 16px; line-height: 24px; font-weight: 700; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .proto-bar {
    flex: none;
    background: #1A1B24;
    color: #fff;
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    font-size: 14px;
  }
  .proto-bar strong { font-size: 16px; font-weight: 500; }
  .proto-bar .sep { width: 1px; height: 20px; background: rgba(255,255,255,.3); }
  .variant {
    height: 32px;
    padding: 0 12px;
    border-radius: 4px;
    border: 1px solid transparent;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
  }

  .shell { flex: 1; min-height: 0; display: flex; }
  .sidebar {
    width: 240px;
    flex: none;
    background: var(--sidebar);
    border-right: 1px solid var(--divider);
    color: var(--sidebar-text);
    overflow: auto;
    font-size: 14px;
  }
  .org {
    height: 56px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-bottom: 1px solid var(--divider);
    color: var(--text);
    font-size: 14px;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #C2185B; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; flex: none;
  }
  .nav-btn, .nav-sub {
    display: flex; align-items: center; gap: 10px;
    width: 100%; min-height: 42px; padding: 0 16px;
    border: 0; border-bottom: 1px solid var(--divider);
    background: transparent; color: var(--sidebar-text);
    text-align: left; font-size: 14px; text-decoration: none;
  }
  .nav-btn svg, .nav-sub svg { flex: none; }
  .nav-btn:hover, .nav-sub:hover { background: #D9D9D9; }
  .nav-btn.open { background: #D9D9D9; }
  .nav-sub { padding-left: 46px; border-bottom: 0; }
  .nav-sub[aria-current="page"], .nav-btn[aria-current="page"] { background: var(--nav); color: #fff; }
  .nav-group { border-bottom: 1px solid var(--divider); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 56px; flex: none;
    display: flex; align-items: center; justify-content: flex-end; gap: 24px;
    padding: 0 24px; border-bottom: 1px solid var(--divider); background: #fff;
  }
  .balance { font-size: 16px; color: var(--nav); border-bottom: 3px solid var(--nav); padding: 4px 0; }
  .top-link {
    background: none; border: 0; color: var(--nav); font-size: 16px; padding: 6px 0;
  }
  .icon-btn {
    width: 32px; height: 32px; border: 0; background: transparent; color: var(--nav);
    border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;
  }
  .content { flex: 1; overflow: auto; padding: 24px; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 14px; }
  .head-actions { display: flex; gap: 8px; align-items: center; }
  .reason { color: var(--muted); margin: 4px 0 12px; max-width: 70ch; }
  .reason.ready { color: var(--ok); }
  .btn {
    height: 32px; padding: 6px 19px; border-radius: 4px; border: 1px solid transparent;
    background: var(--primary); color: #fff; font-size: 14px; line-height: 20px;
  }
  .btn:hover:not(:disabled) { background: var(--primary-hover); }
  .btn:disabled { background: #E8EBF0; color: #555555; }
  .btn-outlined { background: #fff; color: var(--primary); border-color: var(--primary); }
  .btn-outlined:hover:not(:disabled) { background: rgba(0,83,204,.04); }
  .btn-text { background: none; border: 0; color: var(--primary); padding: 6px 8px; height: 32px; }
  .counters { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 12px; color: var(--muted); }
  .counters strong { color: var(--text); font-weight: 500; }
  .action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }
  .scopes { display: flex; gap: 16px; align-items: center; }
  .scopes label, .modes label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .panel {
    border: 1px solid var(--border); border-radius: 4px; padding: 16px; margin-bottom: 16px; background: #fff;
  }
  .panel h2 { margin-bottom: 4px; }
  .hint { color: var(--muted); margin-bottom: 12px; }
  .ex-list { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow: auto; border-top: 1px solid var(--border); }
  .ex-list li {
    display: grid; grid-template-columns: minmax(160px, 1.2fr) minmax(180px, 1.2fr) minmax(220px, 2fr) auto;
    gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .ex-reason { color: var(--danger); }
  .batch-toggle {
    width: 100%; text-align: left; background: #fff; border: 1px solid var(--border);
    border-radius: 4px; min-height: 40px; padding: 8px 12px; margin-bottom: 8px; font-size: 14px;
  }
  .batch {
    display: grid; grid-template-columns: minmax(180px, 1.4fr) minmax(180px, 1.2fr) auto auto;
    gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .batch-list { border: 1px solid var(--border); border-radius: 4px; margin: 0 0 8px; }
  .filters {
    background: #EFF1F5; border-radius: 4px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px 16px;
    align-items: flex-end; margin-bottom: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 180px; font-size: 14px; color: var(--muted); }
  .field.grow { flex: 1; min-width: 240px; }
  .input, .select {
    height: 32px; border: 1px solid var(--border); border-radius: 4px; background: #fff;
    padding: 0 8px; color: var(--text); width: 100%;
  }
  .input:focus, .select:focus { border-color: var(--primary); outline: 2px solid rgba(0,83,204,.25); outline-offset: 0; }
  .card { border: 1px solid var(--border); border-radius: 4px; background: #fff; }
  .tabs { display: flex; gap: 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabs button {
    height: 48px; padding: 0 16px; border: 0; background: transparent; color: var(--muted);
    border-bottom: 2px solid transparent; font-size: 14px; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 1280px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px; font-weight: 400; }
  th { height: 56px; color: var(--text); background: #fff; }
  td { height: 52px; background: #fff; }
  tr.needs td { background: var(--needs); }
  tr.pending td { box-shadow: inset 3px 0 0 var(--primary); }
  .state-needs { color: var(--danger); }
  .state-suggested { color: var(--primary); }
  .state-confirmed { color: var(--ok); }
  .pending-flag { display: block; color: var(--primary); }
  .note { display: block; color: var(--muted); }
  .cell-error { display: block; color: #CC2929; margin-top: 4px; }
  .combo-input { min-width: 200px; }
  .pager {
    display: flex; justify-content: flex-end; align-items: center; gap: 12px;
    min-height: 52px; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 14px;
  }
  .mark {
    width: 20px; height: 20px; border-radius: 4px; color: #fff; display: inline-flex;
    align-items: center; justify-content: center; font-size: 14px; margin-right: 8px;
  }
  .integ { display: inline-flex; align-items: center; white-space: nowrap; }
  #combo-pop {
    position: fixed; z-index: 40; background: #fff; border: 1px solid var(--border);
    border-radius: 4px; box-shadow: 0 4px 16px rgba(26,27,36,.12);
    max-height: 280px; overflow: auto; padding: 4px 0;
  }
  #combo-pop[hidden] { display: none; }
  #combo-pop [role="option"] { padding: 8px 12px; font-size: 14px; cursor: pointer; }
  #combo-pop [role="option"][aria-selected="true"], #combo-pop [role="option"]:hover { background: #E0EBFD; }
  .empty-copy { padding: 12px; }
  .empty-copy strong, .empty-copy p { font-size: 14px; display: block; }
  .empty-copy p { color: var(--muted); margin-top: 4px; }
  .modal-back {
    position: fixed; inset: 0; background: rgba(26,27,36,.45); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal {
    background: #fff; width: 720px; max-width: 100%; max-height: calc(100vh - 48px);
    border-radius: 4px; display: flex; flex-direction: column;
  }
  .modal h2 { padding: 16px 24px; border-bottom: 1px solid var(--border); font-size: 20px; line-height: 28px; font-weight: 400; }
  .modal-body { padding: 16px 24px; overflow: auto; }
  .modal-body p { margin-bottom: 8px; }
  .warn {
    background: #FFF1DD; border: 1px solid #E7C8A0; border-radius: 4px; padding: 8px 12px; margin: 8px 0;
  }
  .preview, .skipped { list-style: none; margin: 0 0 12px; padding: 0; max-height: 220px; overflow: auto; border: 1px solid var(--border); }
  .preview li, .skipped li { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--border); }
  .modes { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .sim { max-width: 640px; }
  .sim h1 { margin-bottom: 8px; }
  .sim p { margin-bottom: 16px; }
  .toast {
    position: fixed; right: 24px; bottom: 24px; z-index: 60; background: #1F8940; color: #fff;
    padding: 14px 16px; border-radius: 4px; font-size: 14px; display: none;
  }
  .toast.on { display: block; }
  .banner { background: #F2F6FC; border: 1px solid #C9D8F5; border-radius: 4px; padding: 12px 16px; margin-bottom: 16px; }
  .banner p { margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="proto-bar">
    <strong>Summary mapping review</strong>
    <span class="sep" aria-hidden="true"></span>
    <div role="group" aria-label="Variant">
      <button type="button" class="variant" aria-pressed="true">Review workspace</button>
    </div>
  </div>

  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="org"><span class="avatar">DS</span><span>DS_test_2_dasha</span></div>
      <button type="button" class="nav-btn" id="nav-dashboard">Dashboard</button>
      <div class="nav-group">
        <button type="button" class="nav-btn open" aria-expanded="true">Mapping</button>
        <a class="nav-sub" href="#mappings" id="nav-mappings" aria-current="page">Mappings list</a>
        <a class="nav-sub" href="#groups">Groups</a>
      </div>
      <button type="button" class="nav-btn" id="nav-summaries">Summaries</button>
      <button type="button" class="nav-btn">Reconciliation</button>
      <button type="button" class="nav-btn">Products and services</button>
      <button type="button" class="nav-btn">Settings</button>
    </nav>
    <div class="main">
      <header class="topbar">
        <span class="balance">Balance : 10000</span>
        <button type="button" class="top-link">How it works?</button>
        <button type="button" class="icon-btn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        </button>
        <button type="button" class="icon-btn" aria-label="Help">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7V14"/><path d="M12 17h.01"/></svg>
        </button>
        <button type="button" class="icon-btn" aria-label="Account menu">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 4-4.5 7-4.5S17.5 16 19 19"/></svg>
        </button>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div id="combo-pop" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var STORAGE = 'synder-summary-mapping-review-v1';
  var PER = 25;
  var LOCATIONS = ['Berlin', 'Stripe', 'Test'];
  var BANK_REASON = 'Bank accounts are entered by hand. Synder does not suggest an account for this row.';
  var EMPTY_REASON = 'No compatible account was proposed for this group.';
  var PLACEHOLDER = 'Search or start typing...';

  var INTEGRATIONS = [
    { id: 'stripe-1', provider: 'stripe', name: 'Test account_1 (Stripe)', mark: 'S', color: '#635bff' },
    { id: 'paypal-1', provider: 'paypal', name: 'Example Checkout (PayPal)', mark: 'P', color: '#003087' },
    { id: 'shopify-1', provider: 'shopify', name: 'Example Store (Shopify)', mark: 'S', color: '#5c8c3e' }
  ];
  var PROVIDER_ACCOUNTS = {
    stripe: { fees: 'stripe-fees', expenses: 'stripe-expenses', clearing: 'stripe-clearing', sales: 'stripe-sales' },
    paypal: { fees: 'paypal-fees', expenses: 'paypal-expenses', clearing: 'paypal-clearing', sales: 'paypal-sales' },
    shopify: { fees: 'shopify-fees', expenses: 'shopify-expenses', clearing: 'shopify-clearing', sales: 'shopify-sales' }
  };
  var ACCOUNTS = [
    { id: 'stripe-fees', name: 'Stripe fees', type: 'Expense' },
    { id: 'stripe-expenses', name: 'Stripe expenses', type: 'Expense' },
    { id: 'ar', name: 'Accounts Receivable (A/R)', type: 'Accounts Receivable' },
    { id: 'stripe-clearing', name: 'Stripe clearing (Synder)', type: 'Other Current Asset' },
    { id: 'fx', name: 'Exchange Gain or Loss', type: 'Other Expense' },
    { id: 'stripe-sales', name: 'Stripe sales', type: 'Income' },
    { id: 'paypal-fees', name: 'PayPal fees', type: 'Expense' },
    { id: 'paypal-expenses', name: 'PayPal expenses', type: 'Expense' },
    { id: 'paypal-clearing', name: 'PayPal clearing', type: 'Other Current Asset' },
    { id: 'paypal-sales', name: 'PayPal sales', type: 'Income' },
    { id: 'shopify-fees', name: 'Shopify fees', type: 'Expense' },
    { id: 'shopify-expenses', name: 'Shopify expenses', type: 'Expense' },
    { id: 'shopify-clearing', name: 'Shopify clearing', type: 'Other Current Asset' },
    { id: 'shopify-sales', name: 'Shopify sales', type: 'Income' },
    { id: 'sales-tax', name: 'Sales tax payable', type: 'Other Current Liability' },
    { id: 'shipping-income', name: 'Shipping income', type: 'Income' },
    { id: 'discounts', name: 'Discounts given', type: 'Income' },
    { id: 'inventory', name: 'Inventory Asset', type: 'Other Current Asset' },
    { id: 'cogs', name: 'Cost of Goods Sold', type: 'Cost of Goods Sold' },
    { id: 'gift-card', name: 'Gift card liability', type: 'Other Current Liability' },
    { id: 'customer-dep', name: 'Customer deposits', type: 'Other Current Liability' },
    { id: 'bad-debt', name: 'Bad debt expense', type: 'Expense' },
    { id: 'deferred', name: 'Deferred Revenue', type: 'Other Current Liability' },
    { id: 'unapplied', name: 'Unapplied cash payment income', type: 'Income' },
    { id: 'tips', name: 'Tips income', type: 'Income' },
    { id: 'gift-wrap', name: 'Gift wrap income', type: 'Income' },
    { id: 'subscriptions', name: 'Subscription income', type: 'Income' },
    { id: 'checking', name: 'Example checking', type: 'Bank' },
    { id: 'savings', name: 'Example savings', type: 'Bank' }
  ];

  /* First seven stay suggested so page 1 of the default sort includes Sales and Fees. */
  var GROUPS = [
    g('transfers', 'Transfers to balance', 'Other Current Asset', 'Move payouts into the clearing balance', ['Other Current Asset'], 'clearing'),
    g('chargebacks', 'Chargebacks', 'Expense', 'Record chargebacks', ['Expense'], 'expenses'),
    g('refunds', 'Refunds', 'Income', 'Record refunds', ['Income'], 'sales'),
    g('sales', 'Sales', 'Income', 'Record sales', ['Income'], 'sales'),
    g('clearing', 'Clearing', 'Other Current Asset', 'Hold processor clearing', ['Other Current Asset'], 'clearing'),
    g('expenses', 'Expenses', 'Expense', 'Record operating expenses', ['Expense'], 'expenses'),
    g('fees', 'Fees', 'Expense', 'Record processor fees', ['Expense'], 'fees'),
    g('invoices', 'Invoices', 'Accounts Receivable', 'Record invoices', ['Accounts Receivable'], 'ar'),
    g('tax', 'Sales tax payable', 'Other Current Liability', 'Record sales tax collected', ['Other Current Liability'], 'sales-tax'),
    g('shipping-income', 'Shipping income', 'Income', 'Record shipping charged to customers', ['Income'], 'shipping-income'),
    g('discounts', 'Discounts', 'Income', 'Record discounts', ['Income'], 'discounts'),
    g('inventory', 'Inventory assets', 'Other Current Asset', 'Record inventory assets', ['Other Current Asset'], 'inventory'),
    g('cogs', 'Cost of Goods sold', 'Cost of Goods Sold', 'Record cost of goods sold', ['Cost of Goods Sold'], 'cogs'),
    g('gift', 'Gift card liability', 'Other Current Liability', 'Record gift card liability', ['Other Current Liability'], 'gift-card'),
    g('customer', 'Customer Balance', 'Other Current Liability', 'Record customer balances', ['Other Current Liability'], 'customer-dep'),
    g('bad', 'Bad Debts', 'Expense', 'Record bad debts', ['Expense'], 'bad-debt'),
    g('deferred', 'Deferred Revenue', 'Other Current Liability', 'Record deferred revenue', ['Other Current Liability'], 'deferred'),
    g('shipping-fees', 'Shipping fees', 'Expense', 'Record shipping fees', ['Expense'], 'expenses'),
    g('unapplied', 'Unapplied cash payment income', 'Income', 'Record unapplied cash payments', ['Income'], 'unapplied'),
    g('tips', 'Tips', 'Income', 'Record tips', ['Income'], 'tips'),
    g('exchange', 'Exchange adjustments', 'Other Expense', 'Record currency differences', ['Other Expense'], 'fx'),
    g('rounding', 'Rounding differences', 'Other Expense', 'Record rounding differences', ['Other Expense'], 'fx'),
    g('advertising', 'Advertising', 'Expense', 'Record advertising', ['Expense'], 'expenses'),
    g('commissions', 'Commissions', 'Expense', 'Record commissions', ['Expense'], 'fees'),
    g('wholesale', 'Wholesale sales', 'Income', 'Record wholesale sales', ['Income'], 'sales'),
    g('giftwrap', 'Gift wrap', 'Income', 'Record gift wrap', ['Income'], 'gift-wrap'),
    g('subscriptions', 'Subscriptions', 'Income', 'Record subscriptions', ['Income'], 'subscriptions'),
    g('packaging', 'Packaging', 'Expense', 'Record packaging', ['Expense'], 'expenses'),
    g('withheld', 'Tax withheld by marketplace', 'Other Current Liability', 'Record tax withheld by the marketplace', ['Other Current Liability'], '', EMPTY_REASON),
    g('reserves', 'Balance Reserves', 'Other Current Asset', 'Record balance reserves', ['Other Current Asset'], '', EMPTY_REASON),
    g('stored', 'Stored Balances', 'Other Current Liability', 'Record stored balances', ['Other Current Liability'], '', EMPTY_REASON),
    g('duties', 'Duties', 'Other Current Liability', 'Record duties', ['Other Current Liability'], '', EMPTY_REASON),
    g('reserve-release', 'Reserve release', 'Other Current Asset', 'Record reserve releases', ['Other Current Asset'], '', EMPTY_REASON)
  ];
  var COMPANIONS = [
    { parent: 'sales', key: 'sales-ex1', name: 'Morning blend' },
    { parent: 'sales', key: 'sales-ex2', name: 'Weekend set' },
    { parent: 'sales', key: 'sales-ex3', name: 'Gift tin' },
    { parent: 'fees', key: 'fees-ex1', name: 'Card fee' },
    { parent: 'fees', key: 'fees-ex2', name: 'Cross-border fee' },
    { parent: 'refunds', key: 'refunds-ex1', name: 'Partial refund' },
    { parent: 'clearing', key: 'clearing-ex1', name: 'Payout in transit' }
  ];

  function g(key, name, subtype, purpose, types, suggest, reason) {
    return { key: key, name: name, subtype: subtype, purpose: purpose, types: types, suggest: suggest || '', reason: reason || '' };
  }
  function accountById(id) { return ACCOUNTS.filter(function (a) { return a.id === id; })[0] || null; }
  function accountName(id) { var a = accountById(id); return a ? a.name : ''; }
  function resolveSuggestion(token, provider) {
    if (!token) return '';
    if (PROVIDER_ACCOUNTS[provider] && PROVIDER_ACCOUNTS[provider][token]) return PROVIDER_ACCOUNTS[provider][token];
    return token;
  }
  function bankName(provider) {
    if (provider === 'stripe') return 'Stripe transfers';
    if (provider === 'paypal') return 'PayPal transfers';
    return 'Shopify payouts';
  }
  function batchKey(purpose, suggestion, integrationId) {
    if (!suggestion) return '';
    return purpose + '||' + suggestion + '||' + integrationId;
  }
  function firstCompatibleName(types, suggestion) {
    if (suggestion && accountById(suggestion) && types.indexOf(accountById(suggestion).type) >= 0) return accountName(suggestion);
    var found = ACCOUNTS.filter(function (a) { return types.indexOf(a.type) >= 0; })[0];
    return found ? found.name : '';
  }
  function makeRow(spec) {
    var suggestion = spec.manual ? '' : spec.suggestion;
    return {
      id: spec.id,
      group: spec.group,
      subtype: spec.subtype,
      gateway: 'Online Sales',

  function buildRows() {

  var ui = { combo: null };
  var S = null;

  function fresh() {

      page: 1,

  }
  function isPending(r) {
    return r.draft.account !== r.saved.account || r.draft.location !== r.saved.location || r.draft.className !== r.saved.className;
  }
  function isValid(row, accountId) {
    if (!accountId) return false;

  }
  function classify(r) {
    var pending = isPending(r);

  }
  function stateLabel(state) {

    return 'Confirmed';
  }
  function article(word) { return /^[aeiou]/i.test(word) ? 'an' : 'a'; }
  function invalidMessage(row) {
    if (!row.draft.account || isValid(row, row.draft.account)) return '';
    var account = accountById(row.draft.account);
    var need = row.types[0];

  }

  function counts() {

  }
  function blockReason() {

    if (c.needs === 0 && c.suggested === 0 && c.pending === 0) return '';
    if (c.confirmed === 0) return 'zero';
    if (c.needs > 0) return 'missing';
    if (c.suggested > 0) return 'unconfirmed';
    if (c.pending > 0) return 'pending';
    return 'missing';
  }
  function reasonText(code, c) {

    if (code === 'unconfirmed') return 'Continue to Summaries is unavailable. ' + c.suggested + (c.suggested === 1 ? ' account still needs' : ' accounts still need') + ' confirmation.';
    if (code === 'pending') return 'Continue to Summaries is unavailable while ' + c.pending + (c.pending === 1 ? ' edit is' : ' edits are') + ' pending. Save or discard them first.';
    return 'Every required account is confirmed. Empty class and location do not block summaries.';
  }
  function rowById(id) { return S.rows.filter(function (r) { return r.id === id; })[0]; }
  function mapped(r) { var info = classify(r); return info.state === 'confirmed' && !info.pending; }
  function resultsRows() {
    var q = S.q.trim().toLowerCase();
    return S.rows.filter(function (r) {
      if (S.integration !== 'all' && r.integrationId !== S.integration) return false;
      if (S.status === 'mapped' && !mapped(r)) return false;
      if (S.status === 'not' && mapped(r)) return false;
      if (S.group !== 'all' && r.group !== S.group) return false;
      if (S.gateway !== 'all' && r.gateway !== S.gateway) return false;
      if (q) {
        var blob = (r.group + ' ' + r.subtype + ' ' + r.integrationName + ' ' + r.purpose + ' ' + accountName(r.draft.account)).toLowerCase();
        if (blob.indexOf(q) < 0) return false;

    });
  }
  function seedMembers(key) { return S.rows.filter(function (r) { return r.batchKey === key; }); }
  function sortRows(list) {
    return list.slice().sort(function (a, b) {

      var rb = classify(b).state === 'needs' ? 0 : classify(b).state === 'suggested' ? 1 : 2;

  function tableRows() {

  function exactBatchMembers(key) {

  function isExactMember(r) {

  function scopeMeta() {

  function labelFor(mode, meta) {

    var errId = 'err-' + field + '-' + r.id.replace(/[^a-z0-9_-]/gi, '');
    if (invalid) described = ' aria-invalid="true" aria-describedby="' + errId + '"';
    var html = '<input class="input combo-input" data-field="' + field + '" data-row-id="' + esc(r.id) + '" data-combo-input="' + esc(r.id + ':' + field) + '" role="combobox" aria-autocomplete="list" aria-expanded="' + (open ? 'true' : 'false') + '" aria-controls="combo-pop" aria-label="' + esc(label) + '" placeholder="' + PLACEHOLDER + '" value="' + esc(shown) + '"' + described + '>';
    if (invalid) html += '<span class="cell-error" id="' + errId + '" role="alert">' + esc(invalid) + '</span>';
    return html;
  }

  function tableHtml(pages) {
    var slice = currentPage();
    var ids = slice.map(function (r) { return r.id; });
    var allChecked = ids.length > 0 && ids.every(function (id) { return S.selected[id]; });
    var html = '<div class="card"><div class="tabs" role="tablist" aria-label="Integration">';
    html += '<button type="button" role="tab" data-tab="all" aria-selected="' + (S.integration === 'all' ? 'true' : 'false') + '">All</button>';
    INTEGRATIONS.forEach(function (integ) {
      html += '<button type="button" role="tab" data-tab="' + integ.id + '" data-testid="tab-' + integ.id + '" aria-selected="' + (S.integration === integ.id ? 'true' : 'false') + '">' + esc(integ.name) + '</button>';
    });
    html += '</div><div class="table-wrap"><table aria-label="Mappings"><thead><tr>';
    html += '<th><input type="checkbox" id="sel-page" aria-label="Select all on page"' + (allChecked ? ' checked' : '') + '></th>';
    html += '<th>Group</th><th>Status</th><th>Account subtype</th><th>Payment gateway</th><th>Integration</th><th>Location</th><th>Class</th><th>Account</th>';
    html += '</tr></thead><tbody>';
    if (!slice.length) html += '<tr><td colspan="9">No groups match these filters.</td></tr>';
    slice.forEach(function (r) {
      var info = classify(r);
      var htmlRow = '<tr data-row-id="' + esc(r.id) + '" data-state="' + info.state + '" data-pending="' + (info.pending ? 'true' : 'false') + '" data-confirmed="' + (r.saved.confirmed ? 'true' : 'false') + '" data-manual="' + (r.manual ? 'true' : 'false') + '" data-account="' + esc(r.draft.account) + '" data-location="' + esc(r.draft.location) + '" data-class="" data-batch-key="' + esc(r.batchKey) + '" data-ok-account-name="' + esc(r.okAccountName) + '" data-types="' + esc(r.types.join('|')) + '" class="' + (info.state === 'needs' ? 'needs' : '') + (info.pending ? ' pending' : '') + '">';
      htmlRow += '<td><input type="checkbox" data-select="' + esc(r.id) + '" aria-label="Select ' + esc(r.group) + ', ' + esc(r.integrationName) + '"' + (S.selected[r.id] ? ' checked' : '') + '></td>';
      htmlRow += '<td>' + esc(r.group) + '</td><td><span class="state-' + info.state + '">' + stateLabel(info.state) + '</span>';
      if (info.pending) htmlRow += '<span class="pending-flag">Pending</span>';
      if (S.inspect && r.batchKey === S.inspect && !isExactMember(r) && !r.saved.confirmed) htmlRow += '<span class="note">Not in this exact batch</span>';
      if (info.state === 'needs' && displayReason(r)) htmlRow += '<span class="note">' + esc(displayReason(r)) + '</span>';
      htmlRow += '</td><td>' + esc(r.subtype) + '</td><td>' + esc(r.gateway) + '</td>';
      htmlRow += '<td><span class="integ"><span class="mark" style="background:' + r.color + '">' + esc(r.mark) + '</span>' + esc(r.integrationName) + '</span></td>';
      htmlRow += '<td>' + comboInput(r, 'location', 'Location for ' + r.group + ', ' + r.integrationName) + '</td>';
      htmlRow += '<td>' + comboInput(r, 'class', 'Class for ' + r.group + ', ' + r.integrationName) + '</td>';
      htmlRow += '<td>' + comboInput(r, 'account', 'Account for ' + r.group + ', ' + r.integrationName);
      if (info.pending) htmlRow += '<button type="button" class="btn-text" data-revert="' + esc(r.id) + '">Revert ' + esc(r.group) + ', ' + esc(r.integrationName) + '</button>';
      htmlRow += '</td></tr>';
      html += htmlRow;
    });
    var from = slice.length ? (S.page - 1) * PER + 1 : 0;
    var to = (S.page - 1) * PER + slice.length;
    html += '</tbody></table></div><div class="pager"><span>Rows per page: 25</span><span>' + from + '–' + to + ' of ' + tableRows().length + '</span>';
    html += '<button type="button" class="btn btn-outlined" data-testid="prev-page" id="prev-page" aria-label="Previous page"' + (S.page <= 1 ? ' disabled' : '') + '>Previous page</button>';
    html += '<span>Page ' + S.page + ' of ' + pages + '</span>';
    html += '<button type="button" class="btn btn-outlined" data-testid="next-page" id="next-page" aria-label="Next page"' + (S.page >= pages ? ' disabled' : '') + '>Next page</button>';
    html += '</div></div>';
    return html;
  }

  function dialogHtml() {
    var meta = scopeMeta();
    var preview = previewFor(meta.scope, S.dialog.mode, S.dialog.accountId);
    var overwrites = preview.changes.filter(function (ch) { return ch.overwrite; });
    var label = labelFor(S.dialog.mode, meta);
    var html = '<div class="modal-back" data-testid="bulk-dialog"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="bulk-title">';
    html += '<h2 id="bulk-title" tabindex="-1">' + esc(label) + '</h2><div class="modal-body">';
    html += '<fieldset class="modes"><legend>How to apply</legend>';
    html += '<label><input type="radio" name="bulk-mode" value="confirm"' + (S.dialog.mode === 'confirm' ? ' checked' : '') + '> Confirm the accounts already on these rows</label>';
    html += '<label><input type="radio" name="bulk-mode" value="set"' + (S.dialog.mode === 'set' ? ' checked' : '') + '> Set one account for these rows</label></fieldset>';
    html += '<div class="field"><label for="bulk-account">Account to apply</label><select class="select" id="bulk-account"' + (S.dialog.mode === 'confirm' ? ' disabled' : '') + '>';
    html += '<option value="">' + PLACEHOLDER + '</option>';
    ACCOUNTS.forEach(function (a) {
      html += '<option value="' + esc(a.id) + '"' + (S.dialog.accountId === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>';
    });
    html += '</select></div>';
    html += '<p class="warn" data-testid="overwrite-warning"' + (overwrites.length ? '' : ' hidden') + '>This will overwrite <span data-testid="overwrite-count">' + overwrites.length + '</span> confirmed ' + (overwrites.length === 1 ? 'mapping' : 'mappings') + '.</p>';
    html += '<p>Will change <span data-testid="change-count">' + preview.changes.length + '</span>. Not changed <span data-testid="skip-count">' + preview.skips.length + '</span>.</p>';
    html += '<ul class="preview" data-testid="bulk-preview">';
    preview.changes.forEach(function (ch) {
      html += '<li data-preview-id="' + esc(ch.id) + '">' + esc(ch.label) + ' → ' + esc(accountName(ch.account) || 'Clear account') + (ch.overwrite ? ' · overwrites a confirmed mapping' : '') + '</li>';
    });
    html += '</ul><ul class="skipped" data-testid="bulk-skipped">';
    preview.skips.forEach(function (sk) {
      var row = rowById(sk.id);
      html += '<li data-skip-id="' + esc(sk.id) + '">' + esc(row.group + ' — ' + row.integrationName) + ' · ' + esc(sk.reason) + '</li>';
    });
    html += '</ul></div><div class="modal-foot">';
    html += '<button type="button" class="btn btn-outlined" data-testid="bulk-cancel" id="bulk-cancel">Cancel</button>';
    html += '<button type="button" class="btn" data-testid="bulk-commit" id="bulk-commit"' + (preview.changes.length ? '' : ' disabled') + '>' + esc(label) + '</button>';
    html += '</div></div></div>';
    return html;
  }

  function paintPop() {
    var pop = document.getElementById('combo-pop');
    if (!ui.combo) { pop.hidden = true; pop.innerHTML = ''; return; }
    var row = rowById(ui.combo.rowId);
    var input = document.querySelector('[data-combo-input="' + ui.combo.rowId + ':' + ui.combo.field + '"]');
    if (!row || !input) { pop.hidden = true; return; }
    var rect = input.getBoundingClientRect();
    pop.style.left = Math.max(8, rect.left) + 'px';
    pop.style.width = Math.max(rect.width, 280) + 'px';
    var below = window.innerHeight - rect.bottom;
    if (below < 220 && rect.top > below) {
      pop.style.top = 'auto';
      pop.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
    } else {
      pop.style.bottom = 'auto';
      pop.style.top = (rect.bottom + 4) + 'px';
    }
    if (ui.combo.field === 'class') {
      pop.setAttribute('role', 'region');
      pop.setAttribute('aria-label', 'Class');
      pop.innerHTML = '<div class="empty-copy"><strong>No classes found in your books</strong><p>The classes list in your books seems to be empty. Create classes in your accounting first to map them in Synder.</p></div>';
      pop.hidden = false;
      return;
    }
    pop.setAttribute('role', 'listbox');
    pop.setAttribute('aria-label', ui.combo.field === 'account' ? 'Account' : 'Location');
    var options = optionsFor(row, ui.combo.field, ui.combo.query);
    if (ui.combo.active >= options.length) ui.combo.active = 0;
    if (!options.length) {
      pop.innerHTML = '<div class="empty-copy"><p>No matching accounts.</p></div>';
      pop.hidden = false;
      input.removeAttribute('aria-activedescendant');
      return;
    }
    pop.innerHTML = options.map(function (opt, index) {
      var id = 'opt-' + index;
      return '<div role="option" id="' + id + '" data-value="' + esc(opt.value) + '" aria-selected="' + (index === ui.combo.active ? 'true' : 'false') + '">' + esc(opt.name) + '</div>';
    }).join('');
    pop.hidden = false;
    var active = pop.querySelector('[aria-selected="true"]');
    if (active) input.setAttribute('aria-activedescendant', active.id);
  }

  function choose(rowId, field, value) {
    var row = rowById(rowId);
    if (!row || field === 'class') { ui.combo = null; paintPop(); return; }
    if (field === 'account') row.draft.account = value;
    if (field === 'location') row.draft.location = value;
    ui.combo = null;
    persist();
    render();
  }
  function setSelected(id, on) {
    var before = selectedCount();
    if (on) S.selected[id] = true; else delete S.selected[id];
    var after = selectedCount();
    if (before === 0 && after > 0 && !S.inspect) S.scope = 'page';
    if (after === 0 && S.scope === 'page') S.scope = 'results';
  }
  function afterBulkSelect() {
    if (selectedCount() > 0 && !S.inspect) S.scope = 'page';
    if (selectedCount() === 0 && S.scope === 'page') S.scope = 'results';
  }
  function revertRow(id) {
    var row = rowById(id);
    row.draft.account = row.saved.account;
    row.draft.location = row.saved.location;
    row.draft.className = row.saved.className;
    persist();
    render();
  }
  function discardAll() {
    S.rows.forEach(function (r) {
      r.draft.account = r.saved.account;
      r.draft.location = r.saved.location;
      r.draft.className = r.saved.className;
    });
    persist();
    render();
    toast('Pending changes discarded');
  }
  function commitPreview(preview) {
    preview.changes.forEach(function (ch) {
      var row = rowById(ch.id);
      row.draft.account = ch.account;
      row.saved.account = ch.account;
      row.saved.location = row.draft.location;
      row.saved.className = row.draft.className;
      row.saved.confirmed = true;
      delete S.selected[ch.id];
    });
    if (selectedCount() === 0 && S.scope === 'page') S.scope = 'results';
    persist();
  }
  function openDialog() {
    var meta = scopeMeta();
    if (!meta.n) return;
    ui.combo = null;
    S.dialog = { mode: 'confirm', accountId: '' };
    render();
  }
  function focusRow(id) {
    S.inspect = null;
    S.integration = 'all';
    S.status = 'all';
    S.group = 'all';
    S.gateway = 'all';
    S.q = '';
    S.view = 'mappings';
    var list = tableRows();
    var idx = list.findIndex(function (r) { return r.id === id; });
    S.page = idx < 0 ? 1 : Math.floor(idx / PER) + 1;
    render();
    var input = document.querySelector('[data-combo-input="' + id + ':account"]');
    if (input) input.focus();
  }
  function resetDemo() {
    localStorage.removeItem(STORAGE);
    ui.combo = null;
    S = fresh();
    persist();
    render();
    toast('Demo reset');
  }
  function goSummaries() {
    if (blockReason()) {
      var reason = document.getElementById('continue-reason');
      if (reason) reason.focus();
      return;
    }
    ui.combo = null;
    S.dialog = null;
    S.view = 'summaries';
    render();
  }

  document.addEventListener('mousedown', function (e) {
    var opt = e.target.closest && e.target.closest('#combo-pop [role="option"]');
    if (!opt || !ui.combo) return;
    e.preventDefault();
  });
  document.addEventListener('click', function (e) {
    var opt = e.target.closest && e.target.closest('#combo-pop [role="option"]');
    if (opt && ui.combo) {
      choose(ui.combo.rowId, ui.combo.field, opt.getAttribute('data-value'));
      return;
    }
    var t = e.target;
    if (t.closest && t.closest('#combo-pop')) return;
    if (!(t.dataset && t.dataset.field) && ui.combo) {
      ui.combo = null;
      paintPop();
      var openInput = document.querySelector('[aria-expanded="true"][data-field]');
      if (openInput) openInput.setAttribute('aria-expanded', 'false');
    }
  });
  document.getElementById('content').addEventListener('focusin', function (e) {
    var t = e.target;
    if (!t.dataset || !t.dataset.field) return;
    if (ui.combo && ui.combo.rowId === t.dataset.rowId && ui.combo.field === t.dataset.field) return;
    ui.combo = { rowId: t.dataset.rowId, field: t.dataset.field, query: '', active: 0 };
    t.setAttribute('aria-expanded', 'true');
    paintPop();
  });
  document.getElementById('content').addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'search') { S.q = t.value; S.page = 1; render(); return; }
    if (t.dataset && t.dataset.field === 'class') {
      t.value = '';
      ui.combo = { rowId: t.dataset.rowId, field: 'class', query: '', active: 0 };
      t.setAttribute('aria-expanded', 'true');
      paintPop();
      return;
    }
    if (t.dataset && t.dataset.field) {
      ui.combo = { rowId: t.dataset.rowId, field: t.dataset.field, query: t.value, active: 0 };
      t.setAttribute('aria-expanded', 'true');
      paintPop();
    }
  });
  document.getElementById('content').addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'filter-status') { S.status = t.value; S.page = 1; render(); }
    else if (t.id === 'filter-group') { S.group = t.value; S.page = 1; render(); }
    else if (t.id === 'filter-gateway') { S.gateway = t.value; S.page = 1; render(); }
    else if (t.name === 'save-scope') { S.scope = t.value; render(); }
    else if (t.name === 'bulk-mode') { S.dialog.mode = t.value; if (t.value === 'confirm') S.dialog.accountId = ''; render(); }
    else if (t.id === 'bulk-account') { S.dialog.accountId = t.value; render(); }
    else if (t.id === 'sel-page') {
      currentPage().forEach(function (r) { if (t.checked) S.selected[r.id] = true; else delete S.selected[r.id]; });
      afterBulkSelect();
      render();
    } else if (t.dataset && t.dataset.select) {
      setSelected(t.dataset.select, t.checked);
      render();
    }
  });
  document.getElementById('content').addEventListener('click', function (e) {
    var t = e.target.closest('button, a');
    if (!t) return;
    if (t.dataset && t.dataset.field) e.stopPropagation();
    if (t.id === 'reset-demo') resetDemo();
    else if (t.id === 'continue-btn') goSummaries();
    else if (t.id === 'discard') discardAll();
    else if (t.id === 'save-accept') openDialog();
    else if (t.id === 'select-page') {
      currentPage().forEach(function (r) { S.selected[r.id] = true; });
      afterBulkSelect();
      render();
    } else if (t.id === 'select-results') {
      S.selected = {};
      resultsRows().forEach(function (r) { S.selected[r.id] = true; });
      S.scope = 'results';
      render();
    } else if (t.id === 'clear-selection') { S.selected = {}; S.scope = 'results'; render(); }
    else if (t.id === 'reset-filters') { S.status = 'all'; S.group = 'all'; S.gateway = 'all'; S.q = ''; S.page = 1; render(); }
    else if (t.id === 'prev-page') { S.page -= 1; render(); }
    else if (t.id === 'next-page') { S.page += 1; render(); }
    else if (t.id === 'back-batches') { S.inspect = null; S.page = 1; render(); }
    else if (t.id === 'back-to-mappings') { S.view = 'mappings'; render(); }
    else if (t.id === 'bulk-cancel') { S.dialog = null; render(); }
    else if (t.id === 'bulk-commit') {
      var meta = scopeMeta();
      var appliedMode = S.dialog.mode;
      var preview = previewFor(meta.scope, appliedMode, S.dialog.accountId);
      if (!preview.changes.length) return;
      commitPreview(preview);
      S.dialog = null;
      render();
      toast(labelFor(appliedMode, meta).replace(/^Accept|^Save/, 'Saved'));
    } else if (t.dataset && t.dataset.revert) revertRow(t.dataset.revert);
    else if (t.dataset && t.dataset.focusRow) focusRow(t.dataset.focusRow);
    else if (t.dataset && t.dataset.integration && t.dataset.testid === 'toggle-integration') {
      S.openIntegration = S.openIntegration === t.dataset.integration ? '' : t.dataset.integration;
      render();
    } else if (t.dataset && t.dataset.batchKey) {
      S.inspect = t.dataset.batchKey;
      S.page = 1;
      S.dialog = null;
      render();
    } else if (t.dataset && t.dataset.tab) {
      S.integration = t.dataset.tab;
      S.page = 1;
      S.inspect = null;
      render();
    }
  });
  document.getElementById('content').addEventListener('keydown', function (e) {
    var t = e.target;
    if (S.dialog && e.key === 'Escape') { S.dialog = null; render(); e.preventDefault(); return; }
    if (S.dialog && e.key === 'Tab') {
      var nodes = Array.prototype.slice.call(document.querySelectorAll('#bulk-title, .modal button, .modal input, .modal select')).filter(function (el) { return !el.disabled; });
      if (nodes.length) {
        var index = nodes.indexOf(document.activeElement);
        if (e.shiftKey && index <= 0) { nodes[nodes.length - 1].focus(); e.preventDefault(); }
        else if (!e.shiftKey && index === nodes.length - 1) { nodes[0].focus(); e.preventDefault(); }
      }
    }
    if (!t.dataset || !t.dataset.field) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var opening = !ui.combo || ui.combo.rowId !== t.dataset.rowId || ui.combo.field !== t.dataset.field;
      if (opening) ui.combo = { rowId: t.dataset.rowId, field: t.dataset.field, query: t.value || '', active: 0 };
      var options = optionsFor(rowById(t.dataset.rowId), t.dataset.field, ui.combo.query);
      if (!opening && options.length) {
        ui.combo.active += e.key === 'ArrowDown' ? 1 : -1;
        if (ui.combo.active < 0) ui.combo.active = options.length - 1;
        if (ui.combo.active >= options.length) ui.combo.active = 0;
      }
      t.setAttribute('aria-expanded', 'true');
      paintPop();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (!ui.combo) return;
      var list = optionsFor(rowById(ui.combo.rowId), ui.combo.field, ui.combo.query);
      if (list[ui.combo.active]) choose(ui.combo.rowId, ui.combo.field, list[ui.combo.active].value);
    } else if (e.key === 'Escape') {
      ui.combo = null;
      paintPop();
      t.setAttribute('aria-expanded', 'false');
      e.preventDefault();
    }
  });
  document.getElementById('content').addEventListener('scroll', function () { if (ui.combo) paintPop(); });
  document.getElementById('nav-summaries').addEventListener('click', function () { goSummaries(); });
  document.getElementById('nav-mappings').addEventListener('click', function (e) { e.preventDefault(); S.view = 'mappings'; render(); });
  document.getElementById('nav-dashboard').addEventListener('click', function () { S.view = 'mappings'; render(); });

  load();
  persist();
  render();
})();
</script>
</body>
</html>
