<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<link rel="stylesheet" href="https://dashasyn.github.io/synder-prototypes/ui-kit/synder-ui-kit.css">
<title>Period lock · Synder prototype</title>
<style>
body{margin:0;display:flex;flex-direction:column;min-height:100vh;background:var(--color-white);font-size:14px}
.mi{font-family:'Material Icons Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-smoothing:antialiased;font-feature-settings:'liga'}
/* prototype bar (not product chrome) */
.vbar{position:sticky;top:0;z-index:60;background:#111827;color:#F9FAFB;display:flex;align-items:center;padding:8px 20px}
.vbar .brand{font-weight:600;font-size:14px;opacity:.9}
/* production shell — from ai-hub-empty-state */
.app{flex:1;display:flex;min-height:0;background:var(--color-white)}
.sb{width:208px;flex-shrink:0;border-right:1px solid var(--border-default);background:var(--color-white);display:flex;flex-direction:column}
.sb-org{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-bottom:1px solid var(--border-default);font-weight:500}
.sb-av{width:28px;height:28px;border-radius:50%;background:#F5C6CB;color:#B23B4B;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sb-org .on{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-org .mi{color:var(--text-secondary)}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 14px;color:var(--text-primary);border-bottom:1px solid var(--border-default);font-size:14px;cursor:pointer;text-decoration:none}
.sb-item:hover{background:var(--color-primary-5);text-decoration:none}
.sb-item .mi{color:var(--color-primary);font-size:20px}
.sb-item .chev{margin-left:auto;color:var(--text-secondary)}
.sb-sub{position:relative;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 44px;color:var(--text-primary);font-size:14px;cursor:pointer;text-decoration:none}
.sb-sub:hover{background:var(--color-primary-5);text-decoration:none}
.sb-subs{border-bottom:1px solid var(--border-default)}
.sb-item.on,.sb-sub.on{background:var(--color-primary);color:var(--color-white)}
.sb-item.on .mi{color:var(--color-white)}
.sb-item.on::after,.sb-sub.on::after{content:'';position:absolute;right:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-left-color:var(--color-primary);border-right:0}
.sb-gap{height:40px;border-bottom:1px solid var(--border-default)}
.sb-promo{margin:16px 8px;background:var(--color-primary-5);border-radius:6px;padding:14px 12px;text-align:center}
.sb-promo b{display:block;margin-bottom:8px;font-weight:500}
.sb-promo .btn{width:100%;justify-content:center}
.sb-demo{margin:0 12px 16px;color:var(--text-secondary)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:24px;padding:0 24px;border-bottom:1px solid var(--border-default)}
.syncs{color:var(--text-secondary);border-bottom:3px solid var(--color-primary);padding:6px 0}
.syncs b{color:var(--color-primary);font-weight:500;font-size:16px}
.top .mi{color:var(--color-primary);font-size:24px}
.content{flex:1;padding:24px 32px 48px;overflow:auto}
/* layout helpers */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.stack{display:flex;flex-direction:column;gap:8px;max-width:760px}
.form-field{margin-bottom:24px}
.form-hint{display:flex;gap:6px;align-items:flex-start;max-width:760px;margin-top:6px}
.form-hint .mi{font-size:18px;color:var(--text-secondary)}
.select,.input{width:auto}
.daysel{min-width:72px}
.pl-hdr{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:16px;margin-bottom:24px;border-bottom:1px solid #DFE4EC}
.pl-hdr .text-subtitle1{font-size:16px;line-height:24px;font-weight:600;color:var(--text-primary)}
.pl-hdr-r{display:flex;align-items:center;gap:16px}
.pl-foot{display:flex;align-items:center;gap:16px;margin-top:16px}
/* mode cards: kit radio inside card */
.mcard{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--color-grey-20);border-radius:var(--radius-md);padding:15px 16px;cursor:pointer;background:var(--color-white)}
.mcard.on{border:2px solid var(--color-primary);padding:14px 15px;background:var(--color-primary-5)}
.mcard.ro{cursor:default}
.mcard b{display:block;font-weight:500;margin-bottom:4px;color:var(--text-primary)}
.mcard input{margin-top:2px}
.alert>div{flex:1}
.alert .mi{font-size:20px}
.kv{border-collapse:collapse}.kv th{padding:6px 24px 6px 0;color:var(--text-secondary);font-weight:400;text-align:left}.kv td{padding:6px 0}
tr.click{cursor:pointer}
.rel{position:relative}
.dropdown-menu.pl{display:block;position:absolute;right:8px;top:44px;z-index:20;min-width:200px}
.synder-modal ul{padding-left:20px;margin:8px 0 0}.synder-modal li{margin-bottom:6px}
.synder-modal-body p{margin:0 0 12px}
.synder-modal-body .form-field{margin-bottom:16px}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--color-white);padding:12px 16px;border-radius:4px;z-index:1100;max-width:560px;box-shadow:var(--shadow-modal)}
/* only override: no text below 14px */
.text-caption,.text-sm,.text-xs,.font-12,.chip-input,.text-chip,.cell-subtext,.badge-new,.form-hint,.form-error-msg,.dropdown-item,.status{font-size:14px}
</style>
</head>
<body>
<div class="vbar"><div class="brand">Period lock</div></div>
<div class="app">
 <nav class="sb" id="side" aria-label="Main"></nav>
 <div class="main">
  <div class="top"><span class="syncs">Syncs left: <b>1000</b></span><a class="text-link" style="text-decoration:none">How it works?</a><span class="mi">notifications</span><span class="mi">help_outline</span><span class="mi">person</span></div>
  <main class="content" id="app"></main>
 </div>
</div>
<div id="layer"></div>
<script>
const TODAY='2026-10-15';
const S={role:'admin',menu:null,draft:null,status:'all',
 integ:{
  stripe:{id:'stripe',name:'mzkt.by (Stripe)',short:'Stripe',tz:'Europe/Vilnius',on:true,mode:'soft',schedule:'recurring',date:'2026-09-30',moveTo:null,runDay:5,by:'Viacheslav Tarabarov',at:'Oct 6, 2026'},
  shopify:{id:'shopify',name:'andrewshitsko (Shopify)',short:'Shopify',tz:'Europe/Vilnius',on:true,mode:'hard',schedule:'recurring',date:'2026-09-30',moveTo:null,runDay:'last',by:'System (monthly move)',at:'Oct 5, 2026'}},
 txns:[
  {id:'ch_buddy',integ:'stripe',info:'Buddy QA Customer · ch_3Q9k',type:'Invoice payment',amount:'128.00 USD',date:'2026-10-03',webhook:'2026-10-03',status:'synced'},
  {id:'re_3P8',integ:'stripe',info:'Refund · re_3P8mXy9kL2',type:'Refund',amount:'-42.50 USD',date:'2026-09-29',posted:'2026-10-01',webhook:'2026-10-01',status:'warn',reason:'moved',objs:['Refund receipt','Expense']},
  {id:'inv_eur',integ:'stripe',info:'Invoice · in_EU5521 (EUR)',type:'Invoice',amount:'500.00 EUR',date:'2026-09-05',posted:'2026-10-01',webhook:'2026-10-02',status:'warn',reason:'moved',objs:['Invoice'],fx:'1 EUR = 1.0842 USD · rate for Sep 5, 2026 (original date, from QuickBooks)'},
  {id:'order_2120',integ:'shopify',info:'andrewshitsko · Order #2120',type:'Order',amount:'54.00 USD',date:'2026-10-06',webhook:'2026-10-06',status:'synced'},
  {id:'batch_77',integ:'shopify',info:'andrewshitsko · Batch payout · 2 payments',type:'Batch payment',amount:'310.00 USD',date:'2026-08-31',webhook:'2026-09-01',status:'partial',reason:'canceled',parts:[{t:'Payment py_A',d:'2026-09-01',a:'190.00 USD',ok:true},{t:'Payment py_B',d:'2026-08-31',a:'120.00 USD',ok:false}]},
  {id:'order_2108',integ:'shopify',info:'andrewshitsko · Order #2108',type:'Order',amount:'86.40 USD',date:'2026-08-31',webhook:'2026-09-02',status:'canceled',reason:'canceled',part:'fee'},
  {id:'order_1043',integ:'shopify',info:'andrewshitsko · Order #1043 (edited Sep 3)',type:'Order',amount:'72.00 USD',date:'2026-08-28',webhook:'2026-08-28',status:'synced',edit:'2026-09-03'}]};
const $=s=>document.querySelector(s);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(i){if(!i)return'';const[y,m,d]=i.split('-').map(Number);return MON[m-1]+' '+d+', '+y}
const short=i=>fmt(i).slice(0,-6);
function iso(y,m,d){return new Date(Date.UTC(y,m,d)).toISOString().slice(0,10)}
function addDays(s,n){const[y,m,d]=s.split('-').map(Number);return iso(y,m-1,d+n)}
function dim(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
function runDate(y,m,rd){return iso(y,m,rd==='last'?dim(y,m):Math.min(+rd,dim(y,m)))}
function recur(rd){const[y,m]=TODAY.split('-').map(Number);let r=runDate(y,m-1,rd),last,next;if(r<=TODAY){last=r;next=runDate(y,m,rd)}else{last=runDate(y,m-2,rd);next=r}
 const end=s=>{const[a,b]=s.split('-').map(Number);return iso(a,b-1,0)};return{last,next,lock:end(last),nextLock:end(next)}}
const lockOf=c=>!c.on?null:(c.schedule==='recurring'?recur(c.runDay).lock:c.date);
const postOn=c=>(c.schedule==='fixed'&&c.moveTo)||addDays(lockOf(c)||c.date,1);
const isAdmin=()=>S.role==='admin';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
function modal(h){const m=h.match(/^<h3>([\s\S]*?)<\/h3>([\s\S]*?)(?:<div class="mfoot">([\s\S]*)<\/div>)?$/);
 $('#layer').innerHTML='<div class="modal-bg show" onclick="if(event.target===this)closeM()"><div class="synder-modal" role="dialog"><div class="synder-modal-header">'+m[1]+'</div><div class="synder-modal-body">'+m[2]+'</div>'+(m[3]?'<div class="synder-modal-footer">'+m[3]+'</div>':'')+'</div></div>'}
function closeM(){$('#layer').innerHTML=''}
function parse(){const h=(location.hash||'#a/lock').slice(1);const[path,qs]=h.split('?');const[v,r]=path.split('/');return{v:v==='b'?'b':'a',r:r||(v==='b'?'settings':'lock'),q:new URLSearchParams(qs||'')}}
function go(h){location.hash=h}
let V='a';const P=r=>'#'+V+'/'+r;

/* ---------- nav (production shell) ---------- */
function nav(r){const mock="toast('Not part of this demo')";
 const it=(ic,t,extra,on,href)=>'<a class="sb-item'+(on?' on':'')+'" '+(href?'href="'+href+'"':'onclick="'+mock+'"')+'><span class="mi">'+ic+'</span><span>'+t+'</span>'+(extra||'')+'</a>';
 const sub=(t,on,href,b)=>'<a class="sb-sub'+(on?' on':'')+'" '+(href?'href="'+href+'"':'onclick="'+mock+'"')+'><span>'+t+'</span>'+(b||'')+'</a>';
 const NEW=' <span class="status status-green">New</span>',cv='<span class="mi chev">expand_more</span>',up='<span class="mi chev">expand_less</span>';
 $('#side').innerHTML='<div class="sb-org"><span class="sb-av">PT</span><span class="on">Per transaction test</span><span class="mi">expand_more</span></div>'
 +it('dashboard','Dashboard')+it('swap_horiz','Transactions',up)+'<div class="sb-subs">'+sub('Transactions list',['transactions','sync'].includes(r),'#a/transactions')+sub('Import activity log')+sub('Transaction reconciliation',0,0,NEW)+sub('Period lock',['lock','edit'].includes(r),'#a/lock',NEW)+'</div>'
 +it('inventory_2','Inventory sync',' <span class="status status-blue">Beta</span>')+it('account_tree','Smart rules',cv)+it('shopping_cart','Invoicing',cv)+it('trending_up','Analytics',cv)+it('insights','Revenue recognition',cv)+'<div class="sb-gap"></div>'+it('settings','Settings')+it('hub','AI Hub')+it('stars',"What's New")
 +'<div style="flex:1"></div><div class="sb-promo"><b>Missed any transactions?</b><button class="btn" onclick="'+mock+'">Check now</button></div>'
 +'<div class="sb-demo">Demo: viewing as '+(isAdmin()?'Admin':'Member')+'. <a class="text-link" onclick="S.role=isAdmin()?\'member\':\'admin\';S.draft=null;render()">View as '+(isAdmin()?'Member':'Admin')+'</a></div>'}

/* ---------- primitives ---------- */
const INFO='<span class="mi">info</span>';
function help(t,lm){return '<div class="form-hint">'+INFO+'<span>'+t+(lm?' <a onclick="'+lm+'">Learn more &gt;&gt;</a>':'')+'</span></div>'}
function srow(label,control,h){return '<div class="form-field"><div class="form-label">'+label+'</div><div>'+control+'</div>'+(h||'')+'</div>'}
function tog(on,onchange,ro){return '<label class="tog"><input type="checkbox" class="switch" '+(on?'checked ':'')+(ro?'disabled ':'')+'onchange="'+onchange+'"><span>'+(on?'On':'Off')+'</span></label>'}
const chipMode=c=>c.on?'<span class="status '+(c.mode==='soft'?'status-grey">Soft':'status-black">Hard')+'</span>':'<span class="text-muted">Off</span>';
const nextLock=c=>c.on&&c.schedule==='recurring'?recur(c.runDay).next:null;

/* ---------- list ---------- */
function vList(){return '<h1 class="page-title">Period lock</h1><p class="page-subtitle" style="margin:4px 0 16px">Stop syncs from changing periods you have closed. Set per integration.</p><div class="table-wrap"><table class="synder-table"><thead><tr><th>Integration</th><th>Status</th><th>Locked through</th><th>Next lock</th><th>Last changed</th></tr></thead><tbody>'
 +Object.values(S.integ).map(c=>'<tr class="click" onclick="S.draft=null;go(\'a/edit?i='+c.id+'\')"><td><a>'+c.name+'</a></td><td>'+chipMode(c)+'</td><td>'+(c.on?fmt(lockOf(c)):'—')+'</td><td>'+(nextLock(c)?fmt(nextLock(c)):'—')+'</td><td>'+c.at+' · '+c.by+'</td></tr>').join('')+'</tbody></table></div>'}

/* ---------- edit ---------- */
function validate(d){const e={};if(!d.on)return e;
 if(d.schedule==='fixed'){if(!d.date){e.date='Pick a date.';e.block=1}else if(d.date>=TODAY){e.date='Pick a date before today ('+fmt(TODAY)+').';e.block=1}
  if(d.mode==='soft'&&d.moveTo&&d.date&&d.moveTo<=d.date){e.move='Pick a date after '+fmt(d.date)+'.';e.block=1}}
 return e}
function ensureDraft(id){if(!S.draft||S.draft.id!==id)S.draft=JSON.parse(JSON.stringify(S.integ[id]));return S.draft}
const lockDirty=()=>S.draft&&JSON.stringify(S.draft)!==JSON.stringify(S.integ[S.draft.id]);
const dLock=d=>!d.on?null:d.schedule==='recurring'?recur(d.runDay).lock:d.date;
const dMove=d=>(d.schedule==='fixed'&&d.moveTo)||addDays(dLock(d)||TODAY,1);
function preview(d){if(!d.on)return 'Period lock is off. Syncs can post on any date.';const L=dLock(d);if(!L)return 'Pick a lock date.';
 let s='Locked through '+fmt(L)+'. '+(d.mode==='soft'?'Move late transactions to '+fmt(dMove(d))+'.':'Late transactions won\'t sync.');
 if(d.mode==='soft'&&d.schedule==='fixed'&&isAdmin()&&!S.showMove)s+=' <a onclick="S.showMove=1;render()">Change</a>';
 if(d.schedule==='recurring')s+=' Next lock: '+fmt(recur(d.runDay).next)+'.';return s}
function vEdit(q){const id=q.get('i')||'stripe',c=S.integ[id],d=ensureDraft(id),ro=!isAdmin(),n=d.short,er=validate(d),rec=d.schedule==='recurring';
 const card=(v,t,s)=>'<label class="mcard '+(d.mode===v?'on':'')+(ro?' ro':'')+'" '+(ro?'':'onclick="event.preventDefault();setD(\'mode\',\''+v+'\')"')+'><input type="radio" class="radio" name="mode" '+(d.mode===v?'checked ':'')+(ro?'disabled':'')+'><div><b>'+t+'</b><span class="text-secondary">'+s+'</span></div></label>';
 const L0=dLock(d),stl=!d.on?'Off. New transactions sync on their real dates.':!L0?'Pick a lock date.':'Locked through '+fmt(L0)+' · '+(rec?'Next lock '+fmt(recur(d.runDay).next):'Fixed date');
 const hdr='<div class="pl-hdr"><div><div class="text-subtitle1">Period lock</div><div class="text-secondary" id="pl-status">'+stl+'</div></div><div class="pl-hdr-r">'+(d.on?'<span class="status status-green">On</span>':'<span class="status status-grey">Off</span>')+'<input type="checkbox" class="switch" aria-label="Period lock" '+(d.on?'checked ':'')+(ro?'disabled ':'')+'onchange="setD(\'on\','+(!d.on)+')"></div></div>';
 let f='';
 if(d.on){
  f+=srow('Mode','<div class="stack">'+card('soft','Soft lock — move late transactions to the open period','From now on, any transaction dated on or before the lock date is posted on the first open day instead of its real date. Your closed period stays untouched, but these transactions will show a different date in accounting than in '+n+'.')
   +card('hard','Hard lock — don\'t sync late transactions','From now on, any transaction dated on or before the lock date is canceled and not posted. You\'ll need to resync it manually after you move the lock.')+'</div>',help('Applies to all future syncs for '+n+', scheduled and manual.'));
  if(rec){let days='';for(let i=1;i<=28;i++)days+='<option value="'+i+'" '+(String(d.runDay)===String(i)?'selected':'')+'>'+i+'</option>';days+='<option value="last" '+(d.runDay==='last'?'selected':'')+'>last day</option>';
   const ds='<select class="select daysel" '+(ro?'disabled':'')+' onchange="setD(\'runDay\',this.value)">'+days+'</select>';
   f+=srow('Schedule','<div class="row" style="gap:6px">'+(d.runDay==='last'?'Every month on the '+ds:'Every month on day '+ds)+', lock through the end of the previous month.</div>'+(ro?'':'<div style="margin-top:8px"><a onclick="setD(\'schedule\',\'fixed\')">Set a specific date instead</a></div>'))}
  else f+=srow('Lock transactions dated on or before','<input class="input" type="date" value="'+(d.date||'')+'" max="'+addDays(TODAY,-1)+'" '+(ro?'disabled':'')+' onchange="setD(\'date\',this.value)">'+(er.date?'<div class="form-error-msg">'+er.date+'</div>':'')+(ro?'':'<div style="margin-top:8px"><a onclick="setD(\'schedule\',\'recurring\')">Use a monthly schedule</a></div>'));
  if(d.mode==='soft'&&!rec&&(S.showMove||d.moveTo&&d.moveTo!==addDays(d.date,1)))f+=srow('Move late transactions to','<input class="input" type="date" value="'+dMove(d)+'" min="'+addDays(d.date,1)+'" '+(ro?'disabled':'')+' onchange="setD(\'moveTo\',this.value)">'+(er.move?'<div class="form-error-msg">'+er.move+'</div>':''));
 }
 f+='<div class="alert alert-info" style="max-width:760px;margin:0"><span class="mi">visibility</span><div><span class="alert-title">Preview</span>'+preview(d)+'</div></div>';
 const sw='<select class="select" onchange="guardLeave(\'a/edit?i=\'+this.value);this.value=\''+id+'\'">'+Object.values(S.integ).map(i=>'<option value="'+i.id+'" '+(i.id===id?'selected':'')+'>'+i.name+'</option>').join('')+'</select>';
 return '<div style="margin:4px 0 8px"><a onclick="guardLeave(\'a/lock\')">← Period lock</a></div><div class="row" style="justify-content:space-between;margin-bottom:16px"><h1 class="page-title" style="margin:0">'+c.name+'</h1>'+sw+'</div>'
 +(ro?'<div class="alert alert-warning">Only admins can change period lock.</div>':'')
 +'<div class="card" style="padding:24px">'+hdr+f+'</div><div class="pl-foot">'+(ro?'':'<button class="btn" '+(lockDirty()&&!er.block?'':'disabled')+' onclick="confirmSave()">Update</button>')+'<span class="text-secondary">Last changed '+c.at+' by '+c.by+'</span></div>'}
function setD(k,v){const d=S.draft;d[k]=v;
 if(k==='schedule'&&v==='fixed'){if(!d.date||d.date>=TODAY)d.date=recur(d.runDay).lock;d.moveTo=null;S.showMove=0}
 if(k==='date'){d.moveTo=null}
 render()}
const PEND={stripe:{late:12,synced:340},shopify:{late:5,synced:812}};
function confirmSave(){const d=S.draft,c=S.integ[d.id];const oldT=lockOf(c),newT=dLock(d),p=PEND[d.id];
 const weaker=c.on&&(!d.on||newT<oldT);
 if(weaker){const aff=S.txns.filter(t=>t.integ===d.id&&t.reason==='canceled'&&(!d.on||t.date>newT)&&t.date<=oldT);const part=aff.filter(t=>t.status==='partial').length;
  return modal('<h3>'+(d.on?'Move the lock back to '+fmt(newT)+'?':'Turn off period lock for '+d.name+'?')+'</h3><p>'+(d.on?short(addDays(newT,1))+' – '+fmt(oldT)+' will be open for syncs again.':'All dates will be open for syncs again.')+'</p><ul>'
  +(aff.length?'<li>'+aff.length+' transactions canceled by this lock stay Canceled unless you resync them.</li>':'<li>No transactions were canceled by this lock.</li>')+(part?'<li>'+part+' is partly canceled. Only the canceled part resyncs.</li>':'')+'<li>Transactions moved by a soft lock keep their new dates.</li><li>'+p.synced+' already synced transactions won\'t change.</li></ul>'
  +(aff.length?'<label class="synder-checkbox" style="margin-top:12px;color:var(--text-primary)"><input type="checkbox" id="rs" checked> Resync them after saving, on their original dates</label>':'')
  +'<div class="mfoot"><button class="btn btn-outlined" onclick="closeM()">Cancel</button><button class="btn" onclick="doSave(document.getElementById(\'rs\')?.checked,'+aff.length+')">'+(d.on?'Move lock':'Turn off')+'</button></div>')}
 const line=d.mode==='soft'?'This will move '+p.late+' transactions waiting to sync to '+fmt(dMove(d))+' and won\'t change '+p.synced+' already synced.':'This will cancel '+p.late+' transactions waiting to sync and won\'t change '+p.synced+' already synced.';
 modal('<h3>Update period lock for '+d.name+'?</h3><p>'+line+'</p><p>'+preview({...d,_np:1}).replace(/ <a.*?<\/a>/,'')+'</p><div class="mfoot"><button class="btn btn-outlined" onclick="closeM()">Cancel</button><button class="btn" onclick="doSave(false,0)">Update</button></div>')}
function doSave(rs,n){closeM();const d=S.draft,c=S.integ[d.id];if(d.on&&d.schedule==='recurring'){d.date=recur(d.runDay).lock;d.moveTo=null}
 d.by='Viacheslav Tarabarov';d.at=fmt(TODAY);Object.assign(c,JSON.parse(JSON.stringify(d)));S.showMove=0;
 if(rs)S.txns.forEach(t=>{if(t.integ===c.id&&t.reason==='canceled'&&(!c.on||t.date>lockOf(c))){t.status='synced';t.reason=null}});
 S.draft=null;render();toast('Period lock updated.'+(rs?' Resyncing '+n+' transactions.':''))}
function guardLeave(h){if(lockDirty()){modal('<h3>Discard changes?</h3><p>You have unsaved period lock changes.</p><div class="mfoot"><button class="btn btn-outlined" onclick="closeM()">Keep editing</button><button class="btn" onclick="closeM();S.draft=null;S.showMove=0;go(\''+h+'\')">Discard</button></div>');return false}S.draft=null;S.showMove=0;go(h);return false}

/* ---------- supporting: transactions ---------- */

function chip(t){return{synced:'<span class="status status-green">Synced</span>',warn:'<span class="status status-yellow">Synced with warnings</span>',canceled:'<span class="status status-red">Canceled</span>',partial:'<span class="status status-red">Partly canceled</span>'}[t.status]}
function reason(t){return t.reason==='moved'?'Date moved by period lock':t.reason==='canceled'?'Canceled by period lock':''}
function vTxns(){const rows=S.txns.filter(t=>S.status==='all'||t.status===S.status||(S.status==='canceled'&&t.status==='partial'));
 const body=rows.map(t=>'<tr><td><a href="'+P('sync?id='+t.id)+'">'+t.info+'</a><div class="text-secondary">'+S.integ[t.integ].name+'</div></td><td>'+t.amount+'</td><td>'+fmt(t.posted||t.date)+(t.posted?'<div class="text-secondary">was '+short(t.date)+'</div>':'')+'</td><td>'+chip(t)+(t.reason?'<div class="text-secondary" style="margin-top:4px">'+reason(t)+'</div>':'')+'</td><td class="rel" style="text-align:right;width:1%"><button class="btn btn-text dots" onclick="S.menu=S.menu===\''+t.id+'\'?null:\''+t.id+'\';render()"><span class="mi">more_horiz</span></button>'+(S.menu===t.id?'<div class="dropdown-menu pl"><a class="dropdown-item" href="'+P('sync?id='+t.id)+'">Show sync info</a><a class="dropdown-item" onclick="rollback(\''+t.id+'\')">Roll back</a><a class="dropdown-item" onclick="resync(\''+t.id+'\')">Resync</a></div>':'')+'</td></tr>').join('');
 const st=[['all','All statuses'],['synced','Synced'],['warn','Synced with warnings'],['canceled','Canceled']];
 return '<h1 class="page-title">Transactions list</h1><p class="page-subtitle" style="margin:4px 0 16px">Transactions imported from your integrations and their sync status.</p>'
 +'<div class="between" style="margin-bottom:12px"><div class="row" style="gap:8px;position:relative"><button class="btn" onclick="S.menu=S.menu===\'act\'?null:\'act\';render()">Actions <span class="mi">expand_more</span></button>'+(S.menu==='act'?'<div class="dropdown-menu pl" style="left:0;right:auto;top:36px"><a class="dropdown-item" onclick="S.menu=null;bulk()">Roll back by date range</a><a class="dropdown-item" onclick="S.menu=null;render();toast(\'Sync started (mock)\')">Sync</a></div>':'')+'<button class="btn btn-outlined">Select all transactions</button></div>'
 +'<div class="row" style="gap:8px"><button class="btn btn-outlined">Import historical data</button><button class="btn btn-success">See transactions in books <span class="mi">expand_more</span></button></div></div>'
 +'<div class="row" style="gap:8px;margin-bottom:10px"><input class="input" type="text" placeholder="Search" style="width:280px"><select class="select" onchange="S.status=this.value;render()">'+st.map(([v,t])=>'<option value="'+v+'" '+(S.status===v?'selected':'')+'>'+t+'</option>').join('')+'</select><button class="btn">Apply</button></div>'
 +(S.status!=='all'?'<div class="row" style="gap:8px;margin-bottom:12px"><span class="text-secondary">Filters:</span><span class="chip-input">Sync status: '+st.find(x=>x[0]===S.status)[1]+'</span><a class="text-link" onclick="S.status=\'all\';render()">Reset all filters</a></div>':'')
 +(rows.length?'<div class="table-wrap"><table class="synder-table"><thead><tr><th>Transaction</th><th>Amount</th><th>Transaction date</th><th>Sync status</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>':'<div class="empty-state"><div class="empty-state-title">No transactions match</div><p class="empty-state-desc">Try a different status.</p><button class="btn" onclick="S.status=\'all\';render()">Clear filter</button></div>')}
function rollback(id){S.menu=null;const t=S.txns.find(x=>x.id===id),c=S.integ[t.integ],L=lockOf(c);render();
 if(t.status==='canceled')return toast('Nothing to roll back. No objects were created for this sync.');
 if(L&&t.webhook<=L)return modal('<h3>Can\'t roll back this transaction</h3><p>Its webhook date, '+fmt(t.webhook)+', is on or before the lock date ('+c.short+', '+fmt(L)+').</p><p class="text-secondary">To roll it back, move the lock to before '+fmt(t.webhook)+'.</p><div class="mfoot"><button class="btn btn-outlined" onclick="closeM()">Close</button>'+(isAdmin()?'<a class="btn" onclick="closeM()" href="'+lockLink(c.id)+'">Period lock settings</a>':'')+'</div>');
 toast('Rollback started. Webhook date '+fmt(t.webhook)+' is open.')}
function resync(id){S.menu=null;const t=S.txns.find(x=>x.id===id),c=S.integ[t.integ],L=lockOf(c);render();
 if(t.reason==='canceled'&&L&&c.mode==='hard'){const pd=t.parts?t.parts.find(p=>!p.ok).d:t.date;if(pd<=L)return toast('Still locked: dated '+fmt(pd)+', lock date '+fmt(L)+'. Move the lock first.')}
 if(t.status==='partial')return toast('Resyncing only the canceled part. The synced part isn\'t duplicated.');
 if(c.on&&c.mode==='soft'&&t.date<=L)return toast('Resync started. It posts on '+fmt(postOn(c))+' again.');toast('Resync started.')}
function bulk(st){st=st||{integ:'shopify',from:'2026-08-15',to:'2026-09-05'};S.bulk=st;const c=S.integ[st.integ],L=lockOf(c);let msg='',btn='';
 if(st.from>st.to)msg='<div class="form-error-msg">From must be before To.</div>';
 else if(L&&st.to<=L)msg='<div class="alert alert-warning">The whole range is on or before the lock date ('+fmt(L)+'). Nothing can be rolled back.</div>';
 else if(L&&st.from<=L){const o=addDays(L,1);msg='<div class="alert alert-warning">'+short(st.from)+' – '+fmt(L)+' is locked. Only '+short(o)+' – '+fmt(st.to)+' can be rolled back.</div>';btn='<button class="btn" onclick="closeM();toast(\'Rollback started for '+short(o)+' – '+fmt(st.to)+'.\')">Roll back '+short(o)+' – '+short(st.to)+'</button>'}
 else btn='<button class="btn" onclick="closeM();toast(\'Rollback started.\')">Roll back</button>';
 modal('<h3>Roll back by date range</h3><p class="text-secondary">Synder checks each sync\'s webhook date.</p><div class="form-field"><label class="form-label">Integration</label><select class="select" onchange="S.bulk.integ=this.value;bulk(S.bulk)">'+Object.values(S.integ).map(i=>'<option value="'+i.id+'" '+(i.id===st.integ?'selected':'')+'>'+i.name+'</option>').join('')+'</select></div><div class="row" style="margin-bottom:16px"><div><div class="form-label" style="margin-bottom:6px">From</div><input class="input" type="date" value="'+st.from+'" onchange="S.bulk.from=this.value;bulk(S.bulk)"></div><div><div class="form-label" style="margin-bottom:6px">To</div><input class="input" type="date" value="'+st.to+'" onchange="S.bulk.to=this.value;bulk(S.bulk)"></div></div>'+msg+'<div class="mfoot"><button class="btn btn-outlined" onclick="closeM()">Cancel</button>'+btn+'</div>')}

/* ---------- supporting: sync info ---------- */
function vSync(q){const t=S.txns.find(x=>x.id===q.get('id'))||S.txns[1],c=S.integ[t.integ],L=lockOf(c);let notice='',logs=[];
 const link=isAdmin()?' <a href="'+lockLink(c.id)+'">Period lock settings</a>':'';
 if(t.reason==='moved'){notice='<div class="alert alert-info">'+t.objs.length+(t.objs.length>1?' objects were':' object was')+' posted on '+fmt(t.posted)+' instead of '+fmt(t.date)+' by soft lock.'+link+'</div>';
  logs=t.objs.map(o=>[o,o+' was created on '+fmt(t.posted)+'. Original date '+fmt(t.date)+'.'+(t.fx?'<div class="text-secondary" style="margin-top:6px">FX rate: '+t.fx+'</div>':'')])}
 else if(t.status==='partial'){const b=t.parts.find(p=>!p.ok),o=t.parts.find(p=>p.ok);notice='<div class="alert alert-warning"><b style="font-weight:500">1 of 2 payments synced.</b> '+b.t+' ('+b.a+') is dated '+fmt(b.d)+', on or before the lock date ('+fmt(L)+'), so it was canceled.'+link+'</div>';logs=[['Payment',o.t+' was created.']]}
 else if(t.reason==='canceled')notice='<div class="alert alert-warning"><b style="font-weight:500">Canceled by hard lock.</b> The '+t.part+' is dated '+fmt(t.date)+', on or before the lock date ('+fmt(L)+'). Nothing was posted. Move the lock, then resync.'+link+'</div>';
 else if(t.edit){notice='<div class="alert alert-warning">Order edit received '+fmt(t.edit)+'. Synder didn\'t roll back and resync: the webhook date, '+fmt(t.webhook)+', is on or before the lock date ('+fmt(L)+').</div>';logs=[['Sales receipt','Sales receipt was created.']]}
 else logs=[['Object','Created.']];
 return '<div class="row" style="margin-bottom:16px"><a class="btn btn-outlined" href="'+P('transactions')+'">← Transactions list</a>'+(t.status==='canceled'?'':'<button class="btn btn-outlined" onclick="rollback(\''+t.id+'\')">Roll back</button>')+'<button class="btn btn-outlined" onclick="resync(\''+t.id+'\')">Resync</button></div><h1 class="page-title">Sync info</h1>'
 +'<table class="kv" style="margin:12px 0 8px"><tr><th>Integration</th><td>'+c.name+'</td></tr><tr><th>Status</th><td>'+chip(t)+'</td></tr><tr><th>Amount</th><td>'+t.amount+'</td></tr><tr><th>Transaction date</th><td>'+fmt(t.date)+(t.posted?' · posted '+fmt(t.posted):'')+'</td></tr><tr><th>Webhook date</th><td>'+fmt(t.webhook)+'</td></tr></table>'
 +'<h2 class="text-h2" style="margin:24px 0 12px">Sync log</h2>'+notice+(logs.length?'<div><div class="table-wrap"><table class="synder-table"><thead><tr><th>Object type</th><th>Message</th></tr></thead><tbody>'+logs.map(l=>'<tr><td>'+l[0]+'</td><td>'+l[1]+'</td></tr>').join('')+'</tbody></table></div>':'<div class="card empty-state"><div class="empty-state-title">No objects were created</div><p class="empty-state-desc">This sync was canceled before anything was posted.</p><a class="btn" href="'+P('transactions')+'">Back to transactions</a></div>')}

/* ---------- render ---------- */
function lockLink(id){return '#a/edit?i='+id}
function render(){const{r,q}=parse();V='a';nav(r);
 $('#app').innerHTML=({lock:vList,edit:vEdit,transactions:vTxns,sync:vSync}[r]||vList)(q)}
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('td')){S.menu=null;render()}});
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
