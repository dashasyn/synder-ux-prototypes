function addMonths(s,n){const[y,m,d]=s.split('-').map(Number);const dm=new Date(Date.UTC(y,m-1+n+1,0)).getUTCDate();return iso(y,m-1+n,Math.min(d,dm))}

function rollback(id){S.menu=null;const t=S.txns.find(x=>x.id===id);render();const rb=rbBlock(t);if(rb)return toast(rb+'.','info');

function resync(id){S.menu=null;const t=S.txns.find(x=>x.id===id),c=S.integ[t.integ],L=lockOf(c);render();

 else if(L&&st.from<=L){const o=addDays(L,1);msg=`<div class="alert alert-warning"><span class="mi">warning_amber</span><div>Locked through ${fmt(L)}. Only ${short(o)} – ${fmt(st.to)} can be rolled back.</div></div>`;btn=`<button class="btn" onclick="closeM();toast('Rollback started for ${short(o)} – ${fmt(st.to)}.')">Roll back ${short(o)} – ${short(st.to)}</button>`}

function vSync(q){const t=S.txns.find(x=>x.id===q.get('id'))||S.txns[1],c=S.integ[t.integ],L=lockOf(c);let notice='',logs=[];
 const hardCx=t.reason==='canceled',adm=isAdmin();
 const rule=`${c.mode==='soft'?'Soft':'Hard'} lock · locked through ${fmt(L)} · ${c.tz}`;
 const link=adm&&!hardCx?` <a class="text-link" href="#edit?i=${c.id}">Period lock settings</a>`:'';
 if(t.reason==='moved'){notice=`<div class="alert alert-info"><span class="mi">info</span><div><span class="alert-title">Date moved by period lock</span>Posted on ${fmt(t.posted)} instead of ${fmt(t.date)}. ${rule}. Only the part of this transaction dated in the locked period moved; parts in the open period keep their dates.${link}</div></div>`;
  logs=t.objs.map(o=>[o,fmt(t.posted)+(t.fx?sub('FX rate: '+t.fx):'')])}
 else if(t.batch){const b=t.batch.bad,o=t.batch.ok;notice=`<div class="alert alert-warning"><span class="mi">warning_amber</span><div><span class="alert-title">Canceled by hard lock</span><b style="font-weight:500">Partly canceled: ${b.a} not posted (${b.t}).</b> ${b.t} is dated ${fmt(b.d)}, in the locked period. Synder won't post it, even on a manual sync. To post it, move the lock date or switch to Soft lock. ${o.t} is in the open period and synced. ${rule}.</div></div>`;logs=[[`${o.t} (${o.a})`,fmt(o.d)]]}
 else if(hardCx)notice=`<div class="alert alert-warning"><span class="mi">warning_amber</span><div><span class="alert-title">Canceled by hard lock</span>The ${t.part} is dated ${fmt(t.date)}, in the locked period, so the whole transaction was canceled and nothing was posted. Synder won't post it, even on a manual sync. To post it, move the lock date or switch to Soft lock. ${rule}.</div></div>`;
 else if(t.reason==='other')notice=`<div class="alert alert-error"><span class="mi">error_outline</span><div>No matching open invoice found.</div></div>`;
 else if(t.edit){notice=`<div class="alert alert-warning"><span class="mi">warning_amber</span><div>Order edit received ${fmt(t.edit)}. Synder didn't roll back and resync: the date Synder received it, ${fmt(t.webhook)}, is in the locked period (locked through ${fmt(L)}).</div></div>`;logs=[['Sales receipt',fmt(t.date)]]}
 else logs=[[t.type,fmt(t.date)]];
 const rb=rbBlock(t),primLock=hardCx&&adm;
 const rs=rsBlock(t),why=[...new Set([rb,rs].filter(Boolean))].join('. ');
 const acts=(why?`<span class="text-secondary">${why}</span>`:'')+`<button class="btn btn-outlined" ${rb?'disabled':''} onclick="rollback('${t.id}')">Roll back</button><button class="btn${primLock?' btn-outlined':''}" ${rs?'disabled':''} onclick="resync('${t.id}')">Resync</button>`+(primLock?`<a class="btn" href="#edit?i=${c.id}">Period lock settings</a>`:'');
 const details=`<div class="card"><table class="kv"><tr><th>Integration</th><td>${c.name}</td></tr><tr><th>Amount</th><td>${t.amount}</td></tr><tr><th>Transaction date</th><td>${fmt(t.date)}${t.posted?' · posted '+fmt(t.posted):''}</td></tr><tr><th>Date Synder received it</th><td>${fmt(t.webhook)}</td></tr><tr><th>Synced at</th><td>${fmt(t.syncedAt.slice(0,10))} ${t.syncedAt.slice(11)} (${c.tz})</td></tr></table></div>`;
 const empty=`<div class="card empty-state"><div class="empty-state-title">No objects were created</div><p class="empty-state-desc">This sync was canceled before anything was posted.</p><div style="display:flex;gap:16px;justify-content:center"><a class="btn btn-outlined" href="#transactions">Back to transactions</a></div></div>`;
 return dlg('Sync info','#transactions',acts,pg(head(titleRow(t.info,chip(t)),c.name+' · '+t.type),notice,details,sec('Sync log',logs.length?table(['Object','Posted date'],logs.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td></tr>`)):empty)))}

function render(){const{r,q}=parse();
 if(['transactions','sync','recon','revrec'].includes(r)&&S.org!=='pt')S.org='pt';
 if(['summaries','summary','products','product'].includes(r)&&S.org!=='sm')S.org='sm';
 if(['lock','edit'].includes(r)&&!['lock','edit'].includes(lastR)&&lastR!==null&&!S._noVisit)track('PeriodLockVisited',{});
 S._noVisit=0;lastR=r;nav(r);syncVar();
 const V={dashboard:vDash,lock:vList,edit:vEdit,transactions:vTxns,sync:vSync,imports:vImports,recon:vRecon,revrec:vRevrec,summaries:vSums,summary:vSum,products:vProducts,product:vProduct,activity:vActivity,dev:vDev};
 const out=(V[r]||vList)(q),fs=$('#fs'),sh=$('#shell');
 if(out&&out.dlg){const sc=fs.querySelector('.dbody')?.scrollTop||0;
  fs.innerHTML=`<div class="dbar"><button class="btn-icon dx" aria-label="Close" onclick="go('${out.back}')"><span class="mi">close</span></button><span class="dv"></span><span class="dt">${out.title}</span><span class="sp"></span><div class="dbar-r">${out.actions}</div></div><div class="dbody"><div class="dwrap">${out.body}</div></div>`;
  fs.querySelector('.dbody').scrollTop=sc;fs.hidden=false;sh.hidden=true;sh.style.display='none';$('#app').innerHTML=''}
 else{fs.hidden=true;fs.innerHTML='';sh.hidden=false;sh.style.display='';$('#app').innerHTML=out}}
function setToday(v){if(!v)return;TODAY=v;S.draft=null;render();toast('Demo date set to '+fmt(v)+'.','info')}
function resetDemo(){Object.assign(S,JSON.parse(INIT));TODAY='2026-10-15';$('#today').value=TODAY;closeM();go('#lock');render()}
document.addEventListener('click',e=>{if(!e.target.closest('.vmw'))$('#vmenu').classList.remove('show');if((S.menu||S.orgOpen)&&!e.target.closest('.dropdown-menu')&&!e.target.closest('.sb-org')){S.menu=null;S.orgOpen=false;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#layer').innerHTML&&!$('#fs').hidden){const b=$('#fs .dx');if(b)b.click()}});
let prevHash=location.hash;
window.addEventListener('hashchange',()=>{const p=prevHash;prevHash=location.hash;S.menu=null;if(p.startsWith('#edit')&&S.draft&&dirty()){const want=location.hash;history.replaceState(null,'',p);prevHash=p;if(!guard(want))return;go(want);return}if(!location.hash.startsWith('#edit'))S.draft=null;render()});
render();
</script>
</body>
