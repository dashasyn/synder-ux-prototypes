<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Period lock · Synder prototype</title>
<style>
:root{--p:#0053CC;--p10:#E0EBFD;--p5:#F2F6FC;--g5:#F7F8FA;--g10:#EFF1F5;--g20:#DFE4EC;--g30:#B4BBCB;--g50:#6B778C;--t:#1A1B24;
--green:#1F8940;--greenL:#ECFDDC;--red:#CC2929;--redL:#FFECE8;--yel:#CB7515;--yelL:#FFF1DD;--side:#007AFF}
*{box-sizing:border-box}
html,body{margin:0;font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:20px;color:var(--t);background:var(--g5)}
a{color:var(--p);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
button{font:inherit}
.vbar{position:sticky;top:0;z-index:50;height:44px;background:#1A1B24;color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px}
.vbar b{font-weight:500;font-size:14px}
.vbar select{background:#2B2D3A;color:#fff;border:1px solid #444757;border-radius:4px;padding:4px 8px;font-size:14px}
.vbar .sp{flex:1}
.vbar label{font-size:14px;color:#C9CCD6;display:flex;gap:6px;align-items:center}
.shell{display:flex;min-height:calc(100vh - 44px)}
.side{width:230px;background:#fff;border-right:1px solid #C8C7CC;padding:12px 0;flex-shrink:0}
.org{display:flex;gap:10px;align-items:center;padding:4px 16px 14px;border-bottom:1px solid var(--g20);margin-bottom:8px}
.av{width:32px;height:32px;border-radius:50%;background:#F5A623;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.side a{display:block;padding:8px 16px;color:var(--t);font-size:14px}
.side a:hover{background:var(--g5);text-decoration:none}
.side a.on{color:var(--side);background:#EAF3FF;border-right:3px solid var(--side);font-weight:500}
.side .grp{padding:12px 16px 4px;color:var(--g50);font-size:14px}
main{flex:1;padding:24px 32px;max-width:1180px}
h1{font-size:24px;line-height:32px;font-weight:500;margin:0 0 4px}
h2{font-size:18px;line-height:24px;font-weight:500;margin:24px 0 8px}
.sub{color:var(--g50);margin:0 0 20px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:6px 19px;border-radius:4px;border:1px solid var(--p);background:var(--p);color:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#0045AA;text-decoration:none}
.btn.o{background:#fff;color:var(--p)}.btn.o:hover{background:var(--p5)}
.btn.q{background:transparent;border-color:transparent;color:var(--p);padding:6px 8px}
.btn.d{background:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--g20);border-radius:8px}
.pad{padding:20px 24px}
table{width:100%;border-collapse:collapse;background:#fff}
th{text-align:left;font-weight:500;color:var(--g50);padding:10px 12px;border-bottom:1px solid #DDD;font-size:14px;white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--g10);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--g5)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:14px;line-height:20px;white-space:nowrap}
.c-ok{background:var(--greenL);color:var(--green)}.c-warn{background:var(--yelL);color:#8A4E0B}.c-bad{background:var(--redL);color:var(--red)}
.c-lock{background:var(--g10);color:var(--t);border:1px solid var(--g20)}.c-off{background:#fff;color:var(--g50);border:1px solid var(--g20)}
.muted{color:var(--g50)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.field{margin-bottom:18px;max-width:360px}
.field label.l{display:block;color:var(--g50);margin-bottom:6px}
input[type=date],input[type=text],select.in{height:36px;border:1px solid var(--g30);border-radius:4px;padding:0 10px;font-size:14px;background:#fff;color:var(--t);font-family:inherit}
.err{color:var(--red);margin-top:6px}.hint{color:var(--g50);margin-top:6px}.warnt{color:#8A4E0B;margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;max-width:640px}
.opt{border:1px solid var(--g20);border-radius:6px;padding:12px 14px;cursor:pointer;background:#fff}
.opt.on{border-color:var(--p);background:var(--p5)}
.opt b{font-weight:500;display:block}.opt span{color:var(--g50)}
.opt.ro{cursor:default}
.note{border-radius:6px;padding:12px 14px;margin-bottom:16px}
.n-info{background:var(--p5);border:1px solid var(--p10)}
.n-warn{background:var(--yelL);border:1px solid #F3D6AE}
.n-plain{background:var(--g5);border:1px solid var(--g20)}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--g30);border-radius:22px;cursor:pointer;transition:.15s}
.toggle span:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.toggle input:checked+span{background:var(--p)}.toggle input:checked+span:before{transform:translateX(18px)}
.toggle input:disabled+span{cursor:not-allowed;opacity:.6}
.dim{opacity:.5;pointer-events:none}
.savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--g20);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;border-radius:0 0 8px 8px}
.modal-bg{position:fixed;inset:0;background:rgba(26,27,36,.45);z-index:80;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:8px;width:520px;max-width:92vw;padding:24px}
.modal h3{margin:0 0 8px;font-size:18px;font-weight:500}
.modal ul{padding-left:20px;margin:8px 0 16px}.modal li{margin-bottom:6px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1B24;color:#fff;padding:12px 18px;border-radius:6px;z-index:90;max-width:560px}
.menu{position:absolute;right:12px;top:40px;background:#fff;border:1px solid var(--g20);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.1);z-index:20;min-width:200px}
.menu a{display:block;padding:8px 14px;color:var(--t)}.menu a:hover{background:var(--g5);text-decoration:none}
.kv{border-collapse:collapse;width:auto;background:transparent}.kv th{padding:6px 24px 6px 0;color:var(--g50);border:0;font-weight:400}.kv td{padding:6px 0;border:0}
.empty{text-align:center;padding:48px 16px}
.empty b{display:block;font-size:18px;font-weight:500;margin-bottom:6px}
.empty p{color:var(--g50);margin:0 0 16px}
.empty .sec{display:block;margin-top:10px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--g20);margin-bottom:16px}
.tabs a{padding:8px 0;color:var(--g50)}.tabs a.on{color:var(--p);border-bottom:2px solid var(--p);font-weight:500}
.hl{background:var(--yelL);padding:0 4px;border-radius:3px}
details summary{cursor:pointer;color:var(--p)}
ol.as li{margin-bottom:10px}
.lockic{width:14px;height:14px;vertical-align:-2px}
</style>
</head>
<body>

<label>Screen <select id="routeSel"></select></label>
<label>Role <select id="roleSel"><option value="admin">Admin</option><option value="member">Member (read-only)</option></select></label>
<span class="sp"></span></div>
<div class="shell"><nav class="side" id="side"></nav><main id="app"></main></div>
<div id="layer"></div>

const S={role:'admin',integ:{
 stripe:{id:'stripe',name:'Stripe Test (sandbox)',tz:'Europe/Belgrade',on:true,mode:'soft',schedule:'fixed',date:'2026-09-30',moveTo:'2026-10-01',runDay:5,by:'Viacheslav Tarabarov',at:'Oct 6, 2026'},
 shopify:{id:'shopify',name:'Changolivia (Shopify)',tz:'Europe/Belgrade',on:true,mode:'hard',schedule:'recurring',date:'2026-09-30',moveTo:'2026-10-01',runDay:5,by:'System (recurring)',at:'Oct 5, 2026'},
 square:{id:'square',name:'Square Test',tz:'America/New_York',on:true,mode:'soft',schedule:'fixed',date:'2026-08-31',moveTo:'2026-09-01',runDay:'last',by:'Maya Chen',at:'Sep 28, 2026'},
 paypal:{id:'paypal',name:'PayPal (sandbox)',tz:'Europe/Belgrade',on:false,mode:'soft',schedule:'fixed',date:'2026-08-31',moveTo:'2026-09-01',runDay:5,by:'Viacheslav Tarabarov',at:'Sep 30, 2026'}},
 draft:null,filter:{status:'all',reason:'all'},menu:null,

 {ts:'Oct 6, 2026 10:12',who:'Viacheslav Tarabarov',act:'Period lock changed',integ:'Stripe Test (sandbox)',before:'Hard · Fixed · Locked through Aug 31, 2026',after:'Soft · Fixed · Locked through Sep 30, 2026 · Move to Oct 1, 2026'},
 {ts:'Oct 5, 2026 00:00',who:'System (recurring)',act:'Period lock advanced',integ:'Changolivia (Shopify)',before:'Locked through Aug 31, 2026',after:'Locked through Sep 30, 2026'},

 txns:[
 {id:'ch_buddy',integ:'stripe',info:'Buddy QA Customer · ch_3Q9k',type:'Invoice payment',amount:'128.00 USD',date:'2026-10-03',webhook:'2026-10-03',status:'synced',reason:null},
 {id:'re_3P8',integ:'stripe',info:'Refund · re_3P8mXy9kL2',type:'Refund',amount:'-42.50 USD',date:'2026-09-29',posted:'2026-10-01',webhook:'2026-10-01',status:'warn',reason:'moved'},
 {id:'inv_eur',integ:'stripe',info:'Invoice · in_EU5521 (EUR)',type:'Invoice',amount:'500.00 EUR',date:'2026-09-05',posted:'2026-10-01',webhook:'2026-10-02',status:'warn',reason:'moved',fx:'1 EUR = 1.0842 USD · rate date Sep 5, 2026 (original date, from QuickBooks)'},
 {id:'order_2120',integ:'shopify',info:'Changolivia · Order #2120',type:'Order',amount:'54.00 USD',date:'2026-10-06',webhook:'2026-10-06',status:'synced',reason:null},
 {id:'batch_77',integ:'shopify',info:'Changolivia · Batch payout · 2 payments',type:'Batch payment',amount:'310.00 USD',date:'2026-09-30',webhook:'2026-10-01',status:'partial',reason:'canceled',parts:[{t:'Payment py_A',d:'2026-10-01',a:'190.00 USD',ok:true},{t:'Payment py_B',d:'2026-09-30',a:'120.00 USD',ok:false}]},
 {id:'order_2108',integ:'shopify',info:'Changolivia · Order #2108',type:'Order',amount:'86.40 USD',date:'2026-09-30',webhook:'2026-10-02',status:'canceled',reason:'canceled',part:'fee'},
 {id:'order_2101',integ:'shopify',info:'Changolivia · Order #2101',type:'Order',amount:'40.00 USD',date:'2026-09-24',webhook:'2026-10-03',status:'canceled',reason:'canceled',part:'order'},
 {id:'order_1043',integ:'shopify',info:'Changolivia · Order #1043 (edited Oct 2)',type:'Order',amount:'72.00 USD',date:'2026-09-28',webhook:'2026-09-28',status:'synced',reason:null,edit:'2026-10-02'},
 {id:'inv_fail',integ:'stripe',info:'Invoice · in_1QxFail',type:'Invoice',amount:'99.00 USD',date:'2026-10-04',webhook:'2026-10-04',status:'canceled',reason:'other',otherMsg:'No matching open invoice found.'}]};
const ROUTES=[['list','Period lock · list'],['settings?i=stripe','Settings · Stripe (soft, fixed)'],['settings?i=shopify','Settings · Shopify (hard, recurring)'],['settings?i=paypal','Settings · PayPal (off)'],['transactions','Transactions list'],['sync-info?id=re_3P8','Sync info · soft moved'],['sync-info?id=inv_eur','Sync info · soft + FX rate'],['sync-info?id=order_2108','Sync info · hard canceled'],['sync-info?id=batch_77','Sync info · partially canceled'],['sync-info?id=order_1043','Sync info · order edit, rollback blocked'],['issues','Dashboard · Sync issues'],['recon','Transaction reconciliation'],['recon-result?r=stripe-sep','Recon result · already locked'],['recon-result?r=square-sep','Recon result · lock promote'],['recon-result?r=stripe-oct','Recon result · moved note'],['summaries','Summaries (SM)'],['products','Products · COGS (SM)'],['activity','Activity log'],['assumptions','Assumptions']];
const $=s=>document.querySelector(s);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(iso){if(!iso)return'';const[y,m,d]=iso.split('-').map(Number);return MON[m-1]+' '+d+', '+y}
function iso(y,m,d){const x=new Date(Date.UTC(y,m,d));return x.toISOString().slice(0,10)}
function addDays(s,n){const[y,m,d]=s.split('-').map(Number);return iso(y,m-1,d+n)}
function dim(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
function runDate(y,m,rd){return iso(y,m,rd==='last'?dim(y,m):Math.min(+rd,dim(y,m)))}
function recur(rd,today=TODAY){const[y,m]=today.split('-').map(Number);let r=runDate(y,m-1,rd),last,next;
 if(r<=today){last=r;next=runDate(y,m,rd)}else{last=runDate(y,m-2,rd);next=r}
 const end=s=>{const[a,b]=s.split('-').map(Number);return iso(a,b-1,0)};return{last,next,lock:end(last),nextLock:end(next)}}
function through(c){if(!c.on)return null;return c.schedule==='recurring'?recur(c.runDay).lock:c.date}
function moveTo(c){return c.schedule==='recurring'?addDays(through(c),1):c.moveTo}
function modeChip(c){return c.on?'<span class="chip c-lock">'+LOCK+' '+(c.mode==='soft'?'Soft':'Hard')+'</span>':'<span class="chip c-off">Off</span>'}
function summary(c){if(!c.on)return'Off';let s=(c.mode==='soft'?'Soft':'Hard')+' · '+(c.schedule==='fixed'?'Fixed':'Recurring')+' · Locked through '+fmt(through(c));if(c.mode==='soft')s+=' · Move to '+fmt(moveTo(c));return s}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
function modal(h){$('#layer').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeM()"><div class="modal">'+h+'</div></div>'}
function closeM(){$('#layer').innerHTML=''}
function route(){const h=(location.hash||'#list').slice(1);const[r,q]=h.split('?');return{r,q:new URLSearchParams(q||'')}}
function go(h){location.hash=h}
const isAdmin=()=>S.role==='admin';
function chipStatus(t){return{synced:'<span class="chip c-ok">Synced</span>',warn:'<span class="chip c-warn">Synced with warnings</span>',canceled:'<span class="chip c-bad">Canceled</span>',partial:'<span class="chip c-bad">Partially canceled</span>'}[t.status]}

/* ---------- nav ---------- */
function nav(r){const L=(h,t,k)=>'<a href="#'+h+'" class="'+(k.includes(r)?'on':'')+'">'+t+'</a>';
 $('#side').innerHTML='<div class="org"><div class="av">PT</div><div>Buddy QA</div></div>'+L('issues','Dashboard',['issues'])+'<div class="grp">Transactions</div>'+L('transactions','Transactions list',['transactions','sync-info'])+L('recon','Transaction reconciliation',['recon','recon-result'])+L('list','Period lock',['list','settings'])+'<div class="grp">Summary sync (SM org)</div>'+L('summaries','Summaries list',['summaries'])+L('products','Products and services',['products'])+'<div class="grp">Organization</div>'+L('activity','Activity log',['activity'])+L('assumptions','Prototype assumptions',['assumptions'])}

/* ---------- list ---------- */
function vList(){const rows=Object.values(S.integ).map(c=>'<tr class="click" onclick="go(\'settings?i='+c.id+'\')"><td><b style="font-weight:500">'+c.name+'</b></td><td>'+modeChip(c)+'</td><td>'+(c.on?fmt(through(c)):'<span class="muted">—</span>')+'</td><td>'+(c.on&&c.schedule==='recurring'?fmt(recur(c.runDay).next)+' → '+fmt(recur(c.runDay).nextLock):'<span class="muted">—</span>')+'</td><td>'+c.at+'<div class="muted">'+c.by+'</div></td></tr>').join('');
 return '<div class="between"><div><h1>Period lock</h1><p class="sub">Stop syncs from posting into periods you have closed or reconciled. Set per integration.</p></div><a href="#activity" class="btn o">Activity log</a></div>'
 +(isAdmin()?'':'<div class="note n-plain">You can view period lock settings. Only admins can change them.</div>')
 +'<div class="card" style="overflow:hidden"><table><thead><tr><th>Integration</th><th>Lock</th><th>Locked through</th><th>Next automatic lock</th><th>Last changed</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}

/* ---------- settings ---------- */
function vSettings(q){const id=q.get('i')||'stripe',c=S.integ[id];
 if(!S.draft||S.draft.id!==id)S.draft=JSON.parse(JSON.stringify(c));const d=S.draft,ro=!isAdmin();
 const dirty=JSON.stringify(d)!==JSON.stringify(c);const er=validate(d);
 const opt=(k,v,t,s)=>'<div class="opt '+(d[k]===v?'on':'')+(ro?' ro':'')+'" '+(ro?'':'onclick="setD(\''+k+'\',\''+v+'\')"')+'><b>'+t+'</b><span>'+s+'</span></div>';
 let sched='';
 if(d.schedule==='fixed'){sched='<div class="field"><label class="l">Locked through</label><input type="date" value="'+d.date+'" max="'+addDays(TODAY,-1)+'" '+(ro?'disabled':'')+' onchange="setD(\'date\',this.value)">'+(er.date?'<div class="err">'+er.date+'</div>':'<div class="hint">Includes the whole day, in '+d.tz+'.</div>')+'</div>'
  +(d.mode==='soft'?'<div class="field"><label class="l">Move late transactions to</label><input type="date" value="'+d.moveTo+'" min="'+addDays(d.date,1)+'" '+(ro?'disabled':'')+' onchange="setD(\'moveTo\',this.value)">'+(er.move?'<div class="err">'+er.move+'</div>':er.moveWarn?'<div class="warnt">'+er.moveWarn+'</div>':'<div class="hint">Parts dated in the locked period post on this date. Other parts keep their dates.</div>')+'</div>':'');}
 else{const r=recur(d.runDay);let o='';for(let i=1;i<=28;i++)o+='<option value="'+i+'" '+(String(d.runDay)===String(i)?'selected':'')+'>Day '+i+'</option>';o+='<option value="last" '+(d.runDay==='last'?'selected':'')+'>Last day of month</option>';
  sched='<div class="field"><label class="l">Every month on</label><select class="in" '+(ro?'disabled':'')+' onchange="setD(\'runDay\',this.value)">'+o+'</select><div class="hint">Locks through the end of the previous month.</div></div>'
  +(d.mode==='soft'?'<div class="field"><label class="l">Move late transactions to</label><div>First open day (day after Locked through)</div><div class="hint">Moves with the lock: now '+fmt(addDays(r.lock,1))+', after '+fmt(r.next)+': '+fmt(addDays(r.nextLock,1))+'.</div></div>':'')}
 const r=d.schedule==='recurring'?recur(d.runDay):null;
 const preview=!d.on?'':'<div class="note n-info"><b style="font-weight:500">'+(d.schedule==='fixed'?'Locked through '+fmt(d.date):(r.lock===c.date&&c.schedule==='recurring'?'Locked through '+fmt(r.lock):'When you save: locked through '+fmt(r.lock)))+'</b>'+(r?'<div>Next automatic lock: '+fmt(r.next)+', locked through '+fmt(r.nextLock)+'.</div>':'')+'</div>';
 const body='<div class="'+(d.on?'':'dim')+'"><div class="muted" style="margin-bottom:8px">Mode</div><div class="seg">'+opt('mode','soft','Soft lock','Post late parts on a date in the open period.')+opt('mode','hard','Hard lock','Cancel the transaction if any part is dated in the locked period.')+'</div>'
  +'<div class="muted" style="margin-bottom:8px">Schedule</div><div class="seg">'+opt('schedule','fixed','Fixed date','Lock through a date you choose.')+opt('schedule','recurring','Recurring','Move the lock forward every month.')+'</div>'+sched
  +'<div class="field" style="max-width:none"><span class="muted">Timezone:</span> '+d.tz+' (from integration settings)</div>'+preview+'</div>';
 return '<a href="#list" onclick="return leave(\'list\')">← All integrations</a><h1 style="margin-top:12px">Period lock · '+d.name+'</h1><p class="sub">Last changed '+c.at+' by '+c.by+'</p>'
 +(ro?'<div class="note n-plain">You can view these settings. Only admins can change them. <a onclick="toast(\'Request sent to admins (mock)\')">Ask an admin</a></div>':'')
 +'<div class="card"><div class="pad"><div class="between" style="margin-bottom:16px"><div><b style="font-weight:500;font-size:16px">Lock this integration</b>'
 +'<p style="margin:6px 0 0;max-width:640px">Synder won\'t post new transactions dated in the locked period.</p>'
 +'<details style="margin-top:6px"><summary>What a lock doesn\'t block</summary><ul style="margin:8px 0 0;padding-left:20px"><li>Imports still run for all dates.</li><li>Summary syncs and manual summary rollbacks still work.</li><li>Rollbacks are checked by webhook date only. A late edit can still change a locked period.</li><li>Product cost updates always behave as a hard lock.</li></ul></details></div>'
 +'<label class="toggle"><input type="checkbox" '+(d.on?'checked':'')+' '+(ro?'disabled':'')+' onchange="setD(\'on\',this.checked)"><span></span></label></div>'
 +(d.on?'':'<div class="note n-plain">Lock is off. Last settings are shown below and come back when you turn it on.</div>')+body+'</div>'

 'Rollback is allowed when the webhook date is open and blocked when it is locked. Bulk rollback offers to roll back only the open part of the range.',
 'Recon promote never weakens a lock. If the lock already covers the period, it shows the status. If a recurring lock is set, it shows when the lock will cover it. A fixed lock moves later only, and mode and schedule are kept. If the lock is off, it defaults to Soft + Fixed.',
 'Summary sync (SM): soft-moved records join the open-day summary as a labeled line. With a hard lock, a payout summary that spans the lock syncs partially without the locked records, and the excluded amount is shown.',
 'SM e-commerce (store + gateway): the lock of the integration that owns the datasource record applies (gateway for payments, store for orders). Smart Reconciliation: only the payment integration\'s lock applies (per spec).',
 'Soft multicurrency: Synder uses the rate for the original date (per spec). Sync info shows the rate and its date.',
 'Duplicate check runs on source ID and original date before the soft date change. Only newly created parts get a new date.',
 'Hard lock: a payment applied to an existing invoice in the locked period does not change that invoice. The payment follows its own date.',
 'Reconnecting an integration keeps its lock. When the integration timezone changes, the lock date stays the same and is evaluated in the new timezone; this is logged.',
 'Sync issues use generic messages without dates, so all lock cancels form one group and all moves form one. The Transactions list has a reason filter "Period lock".',
 'Activity log keeps before → after for every change (this reverses the spec\'s "state after only").',
 'Edge-case numbering: the spec\'s "see edge case 6" for batch syncs means edge case #4 in the list.'];
 return '<h1>Prototype assumptions</h1><p class="sub">Defaults chosen where the spec is open. Confirm with product and dev.</p><div class="card pad"><ol class="as">'+A.map(a=>'<li>'+a+'</li>').join('')+'</ol></div>'}

/* ---------- render ---------- */
function render(){const{r,q}=route();nav(r);const V={list:vList,settings:vSettings,transactions:vTxns,'sync-info':vSync,issues:vIssues,recon:vRecon,'recon-result':vReconResult,summaries:vSummaries,products:vProducts,activity:vActivity,assumptions:vAssumptions}[r]||vList;
 if(r!=='settings'&&S.draft&&!$('#layer').innerHTML)S.draft=null;
 $('#app').innerHTML=V(q);const h=(location.hash||'#list').slice(1);const sel=$('#routeSel');sel.value=ROUTES.some(x=>x[0]===h)?h:'';}
$('#routeSel').innerHTML='<option value="">— jump to —</option>'+ROUTES.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('');
$('#routeSel').onchange=e=>{if(e.target.value)go(e.target.value)};
$('#roleSel').onchange=e=>{S.role=e.target.value;S.draft=null;render()};
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('td')){S.menu=null;render()}});
window.addEventListener('hashchange',render);render();
</script>
