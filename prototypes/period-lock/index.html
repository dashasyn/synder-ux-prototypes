<script>
let TODAY='2026-10-15';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=s=>document.querySelector(s);
function fmt(i){if(!i)return'';const[y,m,d]=i.split('-').map(Number);return MON[m-1]+' '+d+', '+y}
const short=i=>fmt(i).slice(0,-6);
function iso(y,m,d){return new Date(Date.UTC(y,m,d)).toISOString().slice(0,10)}
function addDays(s,n){const[y,m,d]=s.split('-').map(Number);return iso(y,m-1,d+n)}
const endPrev=s=>{const[a,b]=s.split('-').map(Number);return iso(a,b-1,0)};
/* FDD: on save apply the last run day <= today; lock through end of month before it. */
function recur(rd){rd=+rd;const[y,m,d]=TODAY.split('-').map(Number);let last,next;
 if(d>=rd){last=iso(y,m-1,rd);next=iso(y,m,rd)}else{last=iso(y,m-2,rd);next=iso(y,m-1,rd)}
 return{last,next,lock:endPrev(last),nextLock:endPrev(next)}}
const S={org:'pt',role:'admin',menu:null,draft:null,prefill:null,events:[],orgOpen:false,
 integ:{
  stripe:{id:'stripe',org:'pt',name:'mzkt.by (Stripe)',short:'Stripe',pp:'Stripe',tz:'Europe/Vilnius',on:true,mode:'soft',schedule:'recurring',runDay:5,date:'2026-09-30',moveTo:'2026-10-01',baseLock:'2026-09-30',by:'Viacheslav Tarabarov',at:'2026-10-06'},
  shopify:{id:'shopify',org:'pt',name:'andrewshitsko (Shopify)',short:'Shopify',pp:'Shopify',tz:'Europe/Vilnius',on:true,mode:'hard',schedule:'recurring',runDay:5,date:'2026-09-30',moveTo:null,by:'Viacheslav Tarabarov',at:'2026-10-05'},
  greenleaf:{id:'greenleaf',org:'sm',name:'Green Leaf (Square)',short:'Square',pp:'Square',tz:'Europe/Vilnius',on:true,mode:'soft',schedule:'fixed',runDay:5,date:'2026-09-30',moveTo:'2026-10-01',by:'Ignat Plot',at:'2026-10-02'}},
 txns:[
  {id:'ch_buddy',integ:'stripe',info:'Buddy QA Customer · ch_3Q9k',type:'Invoice payment',amount:'128.00 USD',date:'2026-10-03',webhook:'2026-10-03',syncedAt:'2026-10-03 09:14',status:'synced'},
  {id:'re_3P8',integ:'stripe',info:'Refund · re_3P8mXy9kL2',type:'Refund',amount:'-42.50 USD',date:'2026-09-29',posted:'2026-10-01',webhook:'2026-10-01',syncedAt:'2026-10-01 00:04',status:'warn',reason:'moved',objs:['Refund receipt','Expense']},
  {id:'inv_eur',integ:'stripe',info:'Invoice · in_EU5521 (EUR)',type:'Invoice',amount:'500.00 EUR',date:'2026-09-05',posted:'2026-10-01',webhook:'2026-10-02',syncedAt:'2026-10-02 11:40',status:'warn',reason:'moved',objs:['Invoice'],fx:'1 EUR = 1.0842 USD · rate for Sep 5, 2026 (original date, from QuickBooks)',revrec:1},
  {id:'order_2120',integ:'shopify',info:'andrewshitsko · Order #2120',type:'Order',amount:'54.00 USD',date:'2026-10-06',webhook:'2026-10-06',syncedAt:'2026-10-06 15:02',status:'synced'},
  {id:'batch_77',integ:'shopify',info:'andrewshitsko · Batch payout · 2 payments',type:'Batch payment',amount:'310.00 USD',date:'2026-09-30',webhook:'2026-10-01',syncedAt:'2026-10-01 08:30',status:'canceled',reason:'canceled',batch:{ok:{t:'Payment py_A',d:'2026-10-01',a:'190.00 USD'},bad:{t:'Payment py_B',d:'2026-09-30',a:'120.00 USD'}}},
  {id:'order_2108',integ:'shopify',info:'andrewshitsko · Order #2108',type:'Order',amount:'86.40 USD',date:'2026-09-28',webhook:'2026-10-02',syncedAt:'2026-10-02 10:21',status:'canceled',reason:'canceled',part:'shipping fee'},
  {id:'order_1043',integ:'shopify',info:'andrewshitsko · Order #1043 (edited Oct 3)',type:'Order',amount:'72.00 USD',date:'2026-09-26',webhook:'2026-09-26',syncedAt:'2026-09-26 12:05',status:'synced',edit:'2026-10-03'},
  {id:'ch_other',integ:'stripe',info:'Acme Ltd · ch_3QaB',type:'Invoice payment',amount:'60.00 USD',date:'2026-10-08',webhook:'2026-10-08',syncedAt:'2026-10-08 10:00',status:'canceled',reason:'other'}],
 activity:[
  {at:'2026-10-06 14:20',org:'pt',user:'Viacheslav Tarabarov',action:'Period lock set',integ:'stripe',details:'Soft lock · Monthly on day 5 · Locked through Sep 30, 2026 · Move late transactions to Oct 1, 2026'},
  {at:'2026-10-05 09:02',org:'pt',user:'Viacheslav Tarabarov',action:'Period lock set',integ:'shopify',details:'Hard lock · Monthly on day 5 · Locked through Sep 30, 2026'},
  {at:'2026-09-20 17:45',org:'pt',user:'Viacheslav Tarabarov',action:'Period lock disabled',integ:'shopify',details:'Off'},
  {at:'2026-10-02 12:00',org:'sm',user:'Ignat Plot',action:'Period lock set',integ:'greenleaf',details:'Soft lock · Fixed date · Locked through Sep 30, 2026 · Move late transactions to Oct 1, 2026'}],
 products:[{id:'bread',name:'Bread',sku:'BR-01',cost:'1.20',price:'2.50'},{id:'croissant',name:'Croissant',sku:'CR-02',cost:'0.80',price:'1.90'},{id:'baguette',name:'Baguette',sku:'BG-03',cost:'0.95',price:'2.10'}]};
const INIT=JSON.stringify(S);
const isAdmin=()=>S.role==='admin';
const lockOf=c=>!c.on?null:(c.schedule==='recurring'?recur(c.runDay).lock:c.date);
const moveOf=c=>effMove(c);
const integs=()=>Object.values(S.integ).filter(c=>c.org===S.org);
function toast(m,k){const t=document.createElement('div');t.className='alert alert-'+(k||'success');t.innerHTML='<span class="mi">'+(k==='info'?'info':k==='warning'?'warning_amber':'check_circle')+'</span><div>'+m+'</div>';$('#toasts').appendChild(t);setTimeout(()=>t.remove(),5000)}
function modal(title,body,foot){$('#layer').innerHTML=`<div class="modal-bg show" onclick="if(event.target===this)closeM()"><div class="synder-modal" role="dialog"><div class="synder-modal-header">${title}</div><div class="synder-modal-body">${body}</div>${foot?`<div class="synder-modal-footer">${foot}</div>`:''}</div></div>`}
function closeM(){$('#layer').innerHTML=''}
function track(ev,props){S.events.push({ev,props:props||{},at:TODAY})}
function parse(){const h=(location.hash||'#lock').slice(1);const[r,qs]=h.split('?');return{r:r||'lock',q:new URLSearchParams(qs||'')}}
const go=h=>{location.hash=h};
const mock="toast('Not part of this demo.','info')";
const crumb=(...p)=>'<div class="crumb">'+p.map(([t,h],i)=>(h?`<a class="text-link" href="${h}">${t}</a>`:`<span>${t}</span>`)+(i<p.length-1?'<span class="mi">chevron_right</span>':'')).join('')+'</div>';
const head=(t,sub,act)=>`<div class="between mb16"><div><h1 class="page-title" style="margin:0">${t}</h1>${sub?`<p class="page-subtitle" style="margin:4px 0 0">${sub}</p>`:''}</div>${act?`<div class="row">${act}</div>`:''}</div>`;
const table=(cols,rows)=>`<div class="table-wrap"><table class="synder-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const sub=(t)=>`<div class="cell-subtext text-secondary">${t}</div>`;
const tzNote=c=>`Dates use the integration timezone (${c.tz}).`;

/* ---------- nav ---------- */
function nav(r){
 const it=(ic,t,href,on,extra)=>`<a class="sb-item${on?' on':''}" ${href?`href="${href}"`:`onclick="${mock}"`}><span class="mi">${ic}</span><span>${t}</span>${extra||''}</a>`;
 const sb=(t,href,on,b)=>`<a class="sb-sub${on?' on':''}" ${href?`href="${href}"`:`onclick="${mock}"`}><span>${t}</span>${b||''}</a>`;
 const NEW=' <span class="status status-green">New</span>',cv='<span class="mi chev">expand_more</span>',up='<span class="mi chev">expand_less</span>';
 const pt=S.org==='pt',org=pt?'Per transaction test':'Green Leaf (Summary)';
 let h=`<div class="sb-org" onclick="S.orgOpen=!S.orgOpen;render()"><span class="sb-av">${pt?'PT':'GL'}</span><span class="on">${org}</span><span class="mi">expand_more</span>${S.orgOpen?`<div class="dropdown-menu orgmenu"><a class="dropdown-item" onclick="event.stopPropagation();switchOrg('pt')">Per transaction test</a><a class="dropdown-item" onclick="event.stopPropagation();switchOrg('sm')">Green Leaf (Summary)</a></div>`:''}</div>`;
 h+=it('dashboard','Dashboard','#dashboard',r==='dashboard');
 if(pt){h+=it('swap_horiz','Transactions',null,0,up)+'<div class="sb-subs">'+sb('Transactions list','#transactions',['transactions','sync'].includes(r))+sb('Import activity log','#imports',r==='imports')+sb('Transaction reconciliation','#recon',r==='recon',NEW)+sb('Period lock','#lock',['lock','edit'].includes(r),NEW)+'</div>'}
 else{h+=it('summarize','Summaries',null,0,up)+'<div class="sb-subs">'+sb('Summaries list','#summaries',['summaries','summary'].includes(r))+sb('Import activity log','#imports',r==='imports')+sb('Period lock','#lock',['lock','edit'].includes(r),NEW)+'</div>'}
 h+=it('account_tree','Smart rules',null,0,cv)+it('shopping_cart','Invoicing',null,0,cv)+it('trending_up','Analytics',null,0,cv);
 if(pt)h+=it('insights','Revenue recognition','#revrec',r==='revrec');
 h+='<div class="sb-gap"></div>'+it('settings','Settings',null,0,up)+'<div class="sb-subs">'+sb('Organization settings')+(pt?'':sb('Products and services','#products',['products','product'].includes(r)))+sb('Activity log','#activity',r==='activity')+'</div>'+it('hub','AI Hub')+it('stars',"What's New");
 h+=`<div style="flex:1"></div><div class="sb-demo">Demo: viewing as ${isAdmin()?'Admin':'Member'}. <a class="text-link" onclick="S.role=isAdmin()?'member':'admin';S.draft=null;render()">View as ${isAdmin()?'Member':'Admin'}</a></div>`;
 $('#side').innerHTML=h}
function switchOrg(o){S.org=o;S.orgOpen=false;S.draft=null;go(o==='pt'?'#lock':'#lock');render()}

/* ---------- period lock list ---------- */
const modeChip=c=>c.on?(c.mode==='soft'?'<span class="status status-grey">Soft</span>':'<span class="status status-black">Hard</span>'):'<span class="text-muted">Off</span>';
function vList(){return head('Period lock','Stop syncs from changing periods you have closed. Set per integration.')
 +table(['Integration','Mode','Locked through','Next lock','Last changed'],integs().map(c=>`<tr class="click" onclick="openEdit('${c.id}')"><td><a class="text-link">${c.name}</a></td><td>${modeChip(c)}</td><td>${c.on?fmt(lockOf(c)):'—'}</td><td>${c.on&&c.schedule==='recurring'?fmt(recur(c.runDay).next):'—'}</td><td>${fmt(c.at)}${sub(c.by)}</td></tr>`))}
function openEdit(id){S.draft=null;S.prefill=null;go('#edit?i='+id)}

/* ---------- settings ---------- */
/* Move-to date: FDD = always the user-set date (default day after lock). Assumption: on recurring, it shifts by one month with each auto-advance. */
function addMonths(s,n){const[y,m,d]=s.split('-').map(Number);const dm=new Date(Date.UTC(y,m-1+n+1,0)).getUTCDate();return iso(y,m-1+n,Math.min(d,dm))}
function monthsBetween(a,b){const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return(y2-y1)*12+(m2-m1)}
function effMove(c){const L=lockOf(c);if(!L)return null;if(!c.moveTo)return addDays(L,1);if(c.schedule==='recurring'&&c.baseLock)return addMonths(c.moveTo,monthsBetween(c.baseLock,L));return c.moveTo}
function ensureDraft(id){if(!S.draft||S.draft.id!==id){const c=S.integ[id];S.draft=JSON.parse(JSON.stringify(c));S.draft.moveTo=effMove(c);
  if(S.prefill&&S.prefill.i===id){const cur=lockOf(c);if(!cur||S.prefill.to>cur){Object.assign(S.draft,{on:true,schedule:'fixed',date:S.prefill.to,moveTo:addDays(S.prefill.to,1)});S.prefill.applied=1}else S.prefill.covered=cur}}
 return S.draft}
const norm=d=>{const x=JSON.parse(JSON.stringify(d));delete x.baseLock;return JSON.stringify(x)};
const dirty=()=>{if(!S.draft)return false;const c=S.integ[S.draft.id],cur={...c,moveTo:effMove(c)};return norm(S.draft)!==norm(cur)};
const dL=d=>!d.on?null:d.schedule==='recurring'?recur(d.runDay).lock:d.date;
function validate(d){const e={};if(!d.on)return e;const L=dL(d);
 if(d.schedule==='fixed'){if(!d.date)e.date='Pick a lock date.';else if(d.date>=TODAY)e.date='Pick a date before today ('+fmt(TODAY)+').'}
 if(d.mode==='soft'){if(!d.moveTo)e.move='Pick a date.';else if(L&&d.moveTo<=L)e.move='Pick a date after '+fmt(L)+'.'}
 return e}
function statusLine(c){if(!c.on)return'Off. New transactions sync on their real dates.';return'Locked through '+fmt(lockOf(c))+' · '+(c.schedule==='recurring'?'Next lock '+fmt(recur(c.runDay).next):'Fixed date')}

function vDash(){const pt=S.org==='pt',n=S.txns.filter(t=>t.reason==='canceled').length;
 return head('Dashboard')+`<div class="grid2"><div class="card"><div class="card-title">Syncs this month</div><div class="big">${pt?'1,284':'31'}</div><div class="text-secondary">${pt?'transactions':'summaries'}</div></div>`
 +(pt?`<div class="card"><div class="card-title">Sync issues</div>${n?`<div class="between" style="align-items:center;padding:8px 0;border-bottom:1px solid var(--border-default)"><div>Sync canceled by period lock${sub(n+' transactions')}</div><a class="text-link" href="#transactions?status=canceled&reason=lock">See related transactions</a></div>`:''}<div class="between" style="align-items:center;padding:8px 0"><div>No matching open invoice found${sub('1 transaction')}</div><a class="text-link" onclick="${mock}">See related transactions</a></div></div>`
 :`<div class="card"><div class="card-title">Sync issues</div><p class="text-secondary" style="margin:0">No sync issues.</p></div>`)+'</div>'}

/* ---------- summaries (SM) ---------- */
const SUMS=[{id:'s1015',date:'2026-10-14',amt:'2,904.10 USD',st:'synced'},{id:'s1001',date:'2026-10-01',amt:'3,412.75 USD',st:'adj',moved:37},{id:'s0915',date:'2026-09-15',amt:'2,118.40 USD',st:'synced',locked:1}];
const sumChip=s=>s.st==='adj'?'<span class="status status-yellow">Synced adjustment</span>':'<span class="status status-green">Synced</span>';
function vSums(){return head('Summaries list','Daily summaries from Green Leaf (Square).')
 +table(['Summary','Integration','Amount','Status'],SUMS.map(s=>`<tr><td><a class="text-link" href="#summary?id=${s.id}">Summary · ${fmt(s.date)}</a></td><td>Green Leaf (Square)</td><td>${s.amt}</td><td>${sumChip(s)}${s.moved?sub(s.moved+' records moved here by soft lock'):''}</td></tr>`))}
function vSum(q){const s=SUMS.find(x=>x.id===q.get('id'))||SUMS[2],c=S.integ.greenleaf,L=lockOf(c);
 const inLock=L&&s.date<=L;
 const note=inLock?`<div class="alert alert-info"><span class="mi">info</span><div>Dated in the locked period (through ${fmt(L)}). Period lock doesn't block summary sync, rollback or resync.</div></div>`:s.moved?`<div class="alert alert-info"><span class="mi">info</span><div>${s.moved} datasource records dated Sep 28–30, 2026 were moved to ${fmt(s.date)} by soft lock and included in this summary.</div></div>`:'';
 const lines=[['Sales','Bread · 412 units','1,030.00 USD'],['Sales','Croissant · 380 units','722.00 USD'],['Fees','Square fees','-48.30 USD'],['COGS','Product cost','-610.00 USD']];
 return crumb(['Summaries list','#summaries'],['Summary · '+fmt(s.date)])+head('Summary · '+fmt(s.date),'Green Leaf (Square) · '+s.amt,`<button class="btn btn-outlined" onclick="toast('Rollback started.')">Roll back</button><button class="btn btn-outlined" onclick="toast('Resync started.')">Resync</button>`)
 +note+`<div class="mb16">${sumChip(s)}</div>`+'<h2 class="text-h2" style="margin:24px 0 12px">Summary lines</h2>'+table(['Line type','Description','Amount'],lines.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td></tr>`))}

/* ---------- products (SM) ---------- */
function vProducts(){return head('Products and services','Product costs used for COGS in summaries.')
 +table(['Product','SKU','Purchase cost','Sales price'],S.products.map(p=>`<tr class="click" onclick="go('#product?id=${p.id}')"><td><a class="text-link">${p.name}</a></td><td>${p.sku}</td><td>${p.cost} USD</td><td>${p.price} USD</td></tr>`))}
function vProduct(q){const p=S.products.find(x=>x.id===q.get('id'))||S.products[0],c=S.integ.greenleaf,L=lockOf(c);
 return crumb(['Products and services','#products'],[p.name])+head(p.name)+`<div class="card" style="padding:24px;max-width:560px"><div class="form-field"><label class="form-label">Name</label><input class="input" style="width:100%" value="${p.name}"></div><div class="form-field"><label class="form-label">SKU</label><input class="input" style="width:100%" value="${p.sku}"></div><div class="form-field"><label class="form-label">Purchase cost (USD)</label><input class="input" id="cost" style="width:100%" value="${p.cost}">${L?`<div class="form-hint">Period lock: records through ${fmt(L)} keep the old cost. Cost updates always use hard lock.</div>`:''}</div><div class="form-field" style="margin-bottom:0"><label class="form-label">Sales price (USD)</label><input class="input" style="width:100%" value="${p.price}"></div></div><div class="pl-foot"><button class="btn" onclick="saveProduct('${p.id}')">Save</button><a class="text-link" href="#products">Cancel</a></div>`}
function saveProduct(id){const v=$('#cost').value.trim()||'0';const p=S.products.find(x=>x.id===id);p.cost=v;const L=lockOf(S.integ.greenleaf);go('#products');toast(L?`Records through ${fmt(L)} were not updated because the period is locked.`:'Product saved.')}

/* ---------- activity log ---------- */
function vActivity(q){const f=q.get('i');const rows=S.activity.filter(a=>a.org===S.org&&(!f||a.integ===f));
 return head('Activity log','Changes made in this organization.')+(f?`<div class="row mb16" style="gap:8px"><span class="text-secondary">Filters:</span><span class="chip-input">Integration: ${S.integ[f].name}</span><a class="text-link" href="#activity">Reset all filters</a></div>`:'')
 +table(['Date','User','Action','Details'],rows.map(a=>`<tr><td>${fmt(a.at.slice(0,10))}${sub(a.at.slice(11))}</td><td>${a.user}</td><td>${a.action}</td><td>${S.integ[a.integ].name}${sub(a.details)}</td></tr>`))}

/* ---------- dev notes ---------- */
function vDev(){const ev=[['PeriodLockVisited','User opens Period lock from the left nav or from the recon promote.','None'],['PeriodLockSet','User clicks Update while the lock is on (first enable and each change).','<code>lockMode</code> soft|hard, <code>lockSchedule</code> fixed|recurring; suggested <code>orgId</code>, <code>ppProvider</code>, <code>accProvider</code>'],['PeriodLockDisabled','User turns the lock off, then clicks Update.','Suggested <code>orgId</code>, <code>ppProvider</code>, <code>accProvider</code>'],['Synched (existing)','Synder syncs a transaction.','New: <code>periodLockApplied</code> none|soft|hard']];
 return `<div class="dev">${head('Dev notes','Prototype-only notes. Not product UI.')}<h2 class="text-h2">Mixpanel events (FDD)</h2>${table(['Event','Trigger','Properties'],ev.map(e=>`<tr><td><code>${e[0]}</code></td><td>${e[1]}</td><td>${e[2]}</td></tr>`))}
 <h2 class="text-h2">Events fired in this session</h2>${S.events.length?table(['Event','Properties'],S.events.map(e=>`<tr><td><code>${e.ev}</code></td><td>${Object.entries(e.props).map(([k,v])=>`<code>${k}</code>=${v}`).join(', ')||'—'}</td></tr>`)):'<p class="text-secondary">None yet. Open Period lock or save a change.</p>'}
 <h2 class="text-h2">Assumptions to confirm</h2><ul>
 <li>No impact counts are shown; the confirm dialog appears only when the lock weakens (off, earlier date, hard → soft).</li>
 <li>Recurring run day is limited to 1–28 so it runs every month (FDD: one recurring option, lock through end of previous month).</li>
 <li>"Move late transactions to" is always user-set (FDD), default the day after the lock. Assumption: with a monthly schedule it shifts forward one month each time the lock auto-advances.</li>
 <li>Hard lock, batch with two internal transactions (FDD edge case 4): one payment syncs, the other is canceled, sync status is Canceled.</li>
 <li>Activity log shows only "Period lock set" and "Period lock disabled" with the state after the update (FDD). Monthly auto-advance has no entry.</li>
 <li>Recon "Lock period" prefills the recon end date and never moves an existing lock earlier. FDD edge case 2 says recon shows no callout for re-dated rows; the "After soft period lock" subtext needs approval.</li>
 <li>Permissions are an open FDD question. Demo: admins edit, members read only.</li>
 <li>"Today (demo)" in the top bar changes the date so you can see the monthly lock move forward.</li></ul></div>`}

/* ---------- render ---------- */
let lastR=null;
function render(){const{r,q}=parse();
 if(['transactions','sync','recon','revrec'].includes(r)&&S.org!=='pt')S.org='pt';
 if(['summaries','summary','products','product'].includes(r)&&S.org!=='sm')S.org='sm';
 if(['lock','edit'].includes(r)&&!['lock','edit'].includes(lastR)&&lastR!==null&&!S._noVisit)track('PeriodLockVisited',{});
 S._noVisit=0;lastR=r;nav(r);
 document.querySelectorAll('.vbar a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
 const V={dashboard:vDash,lock:vList,edit:vEdit,transactions:vTxns,sync:vSync,imports:vImports,recon:vRecon,revrec:vRevrec,summaries:vSums,summary:vSum,products:vProducts,product:vProduct,activity:vActivity,dev:vDev};
 $('#app').innerHTML=(V[r]||vList)(q)}
function setToday(v){if(!v)return;TODAY=v;S.draft=null;render();toast('Demo date set to '+fmt(v)+'.','info')}
function resetDemo(){Object.assign(S,JSON.parse(INIT));TODAY='2026-10-15';$('#today').value=TODAY;closeM();go('#lock');render()}
document.addEventListener('click',e=>{if((S.menu||S.orgOpen)&&!e.target.closest('.dropdown-menu')&&!e.target.closest('.sb-org')){S.menu=null;S.orgOpen=false;render()}});
let prevHash=location.hash;
window.addEventListener('hashchange',()=>{const p=prevHash;prevHash=location.hash;if(p.startsWith('#edit')&&S.draft&&dirty()){const want=location.hash;history.replaceState(null,'',p);prevHash=p;if(!guard(want))return;go(want);return}if(!location.hash.startsWith('#edit'))S.draft=null;render()});
render();
</script>
</body>
