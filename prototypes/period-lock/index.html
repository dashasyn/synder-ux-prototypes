 txns:[
  {id:'ch_buddy',integ:'stripe',info:'Buddy QA Customer · ch_3Q9k',type:'Invoice payment',amount:'128.00 USD',date:'2026-10-03',webhook:'2026-10-03',status:'synced'},

const $=s=>document.querySelector(s);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(i){if(!i)return'';const[y,m,d]=i.split('-').map(Number);return MON[m-1]+' '+d+', '+y}
const short=i=>fmt(i).slice(0,-6);
function iso(y,m,d){return new Date(Date.UTC(y,m,d)).toISOString().slice(0,10)}
function addDays(s,n){const[y,m,d]=s.split('-').map(Number);return iso(y,m-1,d+n)}
function dim(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
function runDate(y,m,rd){return iso(y,m,rd==='last'?dim(y,m):Math.min(+rd,dim(y,m)))}
function recur(rd){const[y,m]=TODAY.split('-').map(Number);let r=runDate(y,m-1,rd),last,next;if(r<=TODAY){last=r;next=runDate(y,m,rd)}else{last=runDate(y,m-2,rd);next=r}
 const end=s=>{const[a,b]=s.split('-').map(Number);return iso(a,b-1,0)};return{last,next,lock:end(last),nextLock:end(next)}}
const lockOf=c=>!c.on?null:(c.schedule==='recurring'?recur(c.runDay).lock:c.date);
const postOn=c=>(c.schedule==='fixed'&&c.moveTo)||addDays(lockOf(c)||c.date,1);

/* ---------- nav ---------- */

const svg=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>';
function nav(r){const mock="toast('Not part of this demo')";
 const ni=(k,t,extra,on,href)=>'<a class="ni'+(on?' on':'')+'" '+(href?'href="'+href+'"':'onclick="'+mock+'"')+'>'+svg(k)+'<span>'+t+'</span>'+(extra||'')+'</a>';
 const sub=(t,on,href,b)=>'<a class="sub'+(on?' on':'')+'" '+(href?'href="'+href+'"':'onclick="'+mock+'"')+'>'+t+(b||'')+'</a>';

 +ni('inv','Inventory sync',' <span class="bdg beta">Beta</span>')+ni('rules','Smart rules',cv)+ni('invc','Invoicing',cv)+ni('an','Analytics',cv)+ni('rev','Revenue recognition',cv)+'<div class="gap"></div>'+ni('ai','AI Hub')+ni('news',"What's New")+ni('set','Settings')

const INFO='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';

/* ---------- edit ---------- */
function validate(d){const e={};if(!d.on)return e;
 if(d.schedule==='fixed'){if(!d.date){e.date='Pick a date.';e.block=1}else if(d.date>=TODAY){e.date='Pick a date before today ('+fmt(TODAY)+').';e.block=1}

 return e}

 let s='Locked through '+fmt(L)+'. '+(d.mode==='soft'?'Move late transactions to '+fmt(dMove(d))+'.':'Late transactions won\'t sync.');
 if(d.mode==='soft'&&d.schedule==='fixed'&&isAdmin()&&!S.showMove)s+=' <a onclick="S.showMove=1;render()">Change</a>';
 if(d.schedule==='recurring')s+=' Next lock: '+fmt(recur(d.runDay).next)+'.';return s}
function vEdit(q){const id=q.get('i')||'stripe',c=S.integ[id],d=ensureDraft(id),ro=!isAdmin(),n=d.short,er=validate(d),rec=d.schedule==='recurring';
 const card=(v,t,s)=>'<div class="mcard '+(d.mode===v?'on':'')+(ro?' ro':'')+'" '+(ro?'':'onclick="setD(\'mode\',\''+v+'\')"')+'><span class="radio '+(d.mode===v?'on':'')+'"></span><div><b>'+t+'</b><span class="muted">'+s+'</span></div></div>';
 let f=srow('Period lock',tog(d.on,'setD(\'on\','+(!d.on)+')',ro),help('Last changed '+c.at+' by '+c.by+'.'));
 if(d.on){
  f+=srow('Mode','<div class="stack">'+card('soft','Soft lock — move late transactions to the open period','From now on, any transaction dated on or before the lock date is posted on the first open day instead of its real date. Your closed period stays untouched, but these transactions will show a different date in accounting than in '+n+'.')
   +card('hard','Hard lock — don\'t sync late transactions','From now on, any transaction dated on or before the lock date is canceled and not posted. You\'ll need to resync it manually after you move the lock.')+'</div>',help('Applies to all future syncs for '+n+', scheduled and manual.'));
  if(rec){let days='';for(let i=1;i<=28;i++)days+='<option value="'+i+'" '+(String(d.runDay)===String(i)?'selected':'')+'>'+i+'</option>';days+='<option value="last" '+(d.runDay==='last'?'selected':'')+'>last day</option>';
   const ds='<select class="in daysel" '+(ro?'disabled':'')+' onchange="setD(\'runDay\',this.value)">'+days+'</select>';
   f+=srow('Schedule','<div class="row" style="gap:6px">'+(d.runDay==='last'?'Every month on the '+ds:'Every month on day '+ds)+', lock through the end of the previous month.</div>'+(ro?'':'<div style="margin-top:8px"><a onclick="setD(\'schedule\',\'fixed\')">Set a specific date instead</a></div>'))}
  else f+=srow('Lock transactions dated on or before','<input type="date" value="'+(d.date||'')+'" max="'+addDays(TODAY,-1)+'" '+(ro?'disabled':'')+' onchange="setD(\'date\',this.value)">'+(er.date?'<div class="err">'+er.date+'</div>':'')+(ro?'':'<div style="margin-top:8px"><a onclick="setD(\'schedule\',\'recurring\')">Use a monthly schedule</a></div>'));
  if(d.mode==='soft'&&!rec&&(S.showMove||d.moveTo&&d.moveTo!==addDays(d.date,1)))f+=srow('Move late transactions to','<input type="date" value="'+dMove(d)+'" min="'+addDays(d.date,1)+'" '+(ro?'disabled':'')+' onchange="setD(\'moveTo\',this.value)">'+(er.move?'<div class="err">'+er.move+'</div>':''));
 }
 f+='<div class="pv"><div class="pv-t">Preview</div><div>'+preview(d)+'</div></div>';
 const sw='<select class="in" onchange="guardLeave(\'a/edit?i=\'+this.value);this.value=\''+id+'\'">'+Object.values(S.integ).map(i=>'<option value="'+i.id+'" '+(i.id===id?'selected':'')+'>'+i.name+'</option>').join('')+'</select>';
 return '<div style="margin:4px 0 8px"><a onclick="guardLeave(\'a/lock\')">← Period lock</a></div><div class="row" style="justify-content:space-between;margin-bottom:16px"><h1 style="margin:0">'+c.name+'</h1>'+sw+'</div>'
 +(ro?'<div class="note n-warn">Only admins can change period lock.</div>':'')
 +'<div class="panel">'+f+'</div>'+(ro?'':'<div style="margin-top:16px"><button class="btn" '+(lockDirty()&&!er.block?'':'disabled')+' onclick="confirmSave()">Update</button></div>')}
function setD(k,v){const d=S.draft;d[k]=v;
 if(k==='schedule'&&v==='fixed'){if(!d.date||d.date>=TODAY)d.date=recur(d.runDay).lock;d.moveTo=null;S.showMove=0}
 if(k==='date'){d.moveTo=null}
 render()}
const PEND={stripe:{late:12,synced:340},shopify:{late:5,synced:812}};
function confirmSave(){const d=S.draft,c=S.integ[d.id];const oldT=lockOf(c),newT=dLock(d),p=PEND[d.id];
 const weaker=c.on&&(!d.on||newT<oldT);
 if(weaker){const aff=S.txns.filter(t=>t.integ===d.id&&t.reason==='canceled'&&(!d.on||t.date>newT)&&t.date<=oldT);const part=aff.filter(t=>t.status==='partial').length;
  return modal('<h3>'+(d.on?'Move the lock back to '+fmt(newT)+'?':'Turn off period lock for '+d.name+'?')+'</h3><p>'+(d.on?short(addDays(newT,1))+' – '+fmt(oldT)+' will be open for syncs again.':'All dates will be open for syncs again.')+'</p><ul>'
  +(aff.length?'<li>'+aff.length+' transactions canceled by this lock stay Canceled unless you resync them.</li>':'<li>No transactions were canceled by this lock.</li>')+(part?'<li>'+part+' is partly canceled. Only the canceled part resyncs.</li>':'')+'<li>Transactions moved by a soft lock keep their new dates.</li><li>'+p.synced+' already synced transactions won\'t change.</li></ul>'
  +(aff.length?'<label class="row"><input type="checkbox" id="rs" checked> Resync them after saving, on their original dates</label>':'')
  +'<div class="mfoot"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn" onclick="doSave(document.getElementById(\'rs\')?.checked,'+aff.length+')">'+(d.on?'Move lock':'Turn off')+'</button></div>')}
 const line=d.mode==='soft'?'This will move '+p.late+' transactions waiting to sync to '+fmt(dMove(d))+' and won\'t change '+p.synced+' already synced.':'This will cancel '+p.late+' transactions waiting to sync and won\'t change '+p.synced+' already synced.';
 modal('<h3>Update period lock for '+d.name+'?</h3><p>'+line+'</p><p class="muted">'+preview({...d,_np:1}).replace(/ <a.*?<\/a>/,'')+'</p><div class="mfoot"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn" onclick="doSave(false,0)">Update</button></div>')}
function doSave(rs,n){closeM();const d=S.draft,c=S.integ[d.id];if(d.on&&d.schedule==='recurring'){d.date=recur(d.runDay).lock;d.moveTo=null}
 d.by='Viacheslav Tarabarov';d.at=fmt(TODAY);Object.assign(c,JSON.parse(JSON.stringify(d)));S.showMove=0;
 if(rs)S.txns.forEach(t=>{if(t.integ===c.id&&t.reason==='canceled'&&(!c.on||t.date>lockOf(c))){t.status='synced';t.reason=null}});
 S.draft=null;render();toast('Period lock updated.'+(rs?' Resyncing '+n+' transactions.':''))}
function guardLeave(h){if(lockDirty()){modal('<h3>Discard changes?</h3><p>You have unsaved period lock changes.</p><div class="mfoot"><button class="btn o" onclick="closeM()">Keep editing</button><button class="btn" onclick="closeM();S.draft=null;S.showMove=0;go(\''+h+'\')">Discard</button></div>');return false}S.draft=null;S.showMove=0;go(h);return false}

/* ---------- supporting: transactions ---------- */

function chip(t){return{synced:'<span class="chip c-ok">Synced</span>',warn:'<span class="chip c-warn">Synced with warnings</span>',canceled:'<span class="chip c-bad">Canceled</span>',partial:'<span class="chip c-bad">Partly canceled</span>'}[t.status]}
function reason(t){return t.reason==='moved'?'Date moved by period lock':t.reason==='canceled'?'Canceled by period lock':''}
function vTxns(){const rows=S.txns.filter(t=>S.status==='all'||t.status===S.status||(S.status==='canceled'&&t.status==='partial'));
 const body=rows.map(t=>'<tr><td><a href="'+P('sync?id='+t.id)+'">'+t.info+'</a><div class="muted">'+S.integ[t.integ].name+'</div></td><td>'+t.amount+'</td><td>'+fmt(t.posted||t.date)+(t.posted?'<div class="muted">was '+short(t.date)+'</div>':'')+'</td><td>'+chip(t)+(t.reason?'<div class="muted" style="margin-top:4px">'+reason(t)+'</div>':'')+'</td><td style="position:relative"><button class="btn o dots" onclick="S.menu=S.menu===\''+t.id+'\'?null:\''+t.id+'\';render()">⋯</button>'+(S.menu===t.id?'<div class="menu"><a href="'+P('sync?id='+t.id)+'">Show sync info</a><a onclick="rollback(\''+t.id+'\')">Roll back</a><a onclick="resync(\''+t.id+'\')">Resync</a></div>':'')+'</td></tr>').join('');
 const st=[['all','All statuses'],['synced','Synced'],['warn','Synced with warnings'],['canceled','Canceled']];
 return '<h1>Transactions list</h1><p class="subt">Transactions imported from your integrations and their sync status.</p>'
 +'<div class="between" style="margin-bottom:12px"><div class="row" style="gap:8px;position:relative"><button class="btn" onclick="S.menu=S.menu===\'act\'?null:\'act\';render()">Actions ▾</button>'+(S.menu==='act'?'<div class="menu" style="left:0;right:auto;top:36px"><a onclick="S.menu=null;bulk()">Roll back by date range</a><a onclick="S.menu=null;render();toast(\'Sync started (mock)\')">Sync</a></div>':'')+'<button class="btn o">Select all transactions</button></div>'
 +'<div class="row" style="gap:8px"><button class="btn o">Import historical data</button><button class="btn g">See transactions in books ▾</button></div></div>'
 +'<div class="row" style="gap:8px;margin-bottom:10px"><input type="text" placeholder="Search" style="width:280px"><select class="in" onchange="S.status=this.value;render()">'+st.map(([v,t])=>'<option value="'+v+'" '+(S.status===v?'selected':'')+'>'+t+'</option>').join('')+'</select><button class="btn">Apply</button></div>'
 +(S.status!=='all'?'<div class="row" style="gap:8px;margin-bottom:12px"><span class="muted">Filters:</span><span class="fchip">Sync status: '+st.find(x=>x[0]===S.status)[1]+'</span><span class="fchip red" onclick="S.status=\'all\';render()">Reset all filters</span></div>':'')
 +(rows.length?'<table class="sy"><thead><tr><th>Transaction</th><th>Amount</th><th>Transaction date</th><th>Sync status</th><th></th></tr></thead><tbody>'+body+'</tbody></table>':'<div class="empty"><b>No transactions match</b><p>Try a different status.</p><button class="btn" onclick="S.status=\'all\';render()">Clear filter</button></div>')}
function rollback(id){S.menu=null;const t=S.txns.find(x=>x.id===id),c=S.integ[t.integ],L=lockOf(c);render();
 if(t.status==='canceled')return toast('Nothing to roll back. No objects were created for this sync.');
 if(L&&t.webhook<=L)return modal('<h3>Can\'t roll back this transaction</h3><p>Its webhook date, '+fmt(t.webhook)+', is on or before the lock date ('+c.short+', '+fmt(L)+').</p><p class="muted">To roll it back, move the lock to before '+fmt(t.webhook)+'.</p><div class="mfoot"><button class="btn o" onclick="closeM()">Close</button>'+(isAdmin()?'<a class="btn" onclick="closeM()" href="'+lockLink(c.id)+'">Period lock settings</a>':'')+'</div>');
 toast('Rollback started. Webhook date '+fmt(t.webhook)+' is open.')}
function resync(id){S.menu=null;const t=S.txns.find(x=>x.id===id),c=S.integ[t.integ],L=lockOf(c);render();
 if(t.reason==='canceled'&&L&&c.mode==='hard'){const pd=t.parts?t.parts.find(p=>!p.ok).d:t.date;if(pd<=L)return toast('Still locked: dated '+fmt(pd)+', lock date '+fmt(L)+'. Move the lock first.')}
 if(t.status==='partial')return toast('Resyncing only the canceled part. The synced part isn\'t duplicated.');
 if(c.on&&c.mode==='soft'&&t.date<=L)return toast('Resync started. It posts on '+fmt(postOn(c))+' again.');toast('Resync started.')}
function bulk(st){st=st||{integ:'shopify',from:'2026-08-15',to:'2026-09-05'};S.bulk=st;const c=S.integ[st.integ],L=lockOf(c);let msg='',btn='';
 if(st.from>st.to)msg='<div class="err">From must be before To.</div>';
 else if(L&&st.to<=L)msg='<div class="note n-warn">The whole range is on or before the lock date ('+fmt(L)+'). Nothing can be rolled back.</div>';
 else if(L&&st.from<=L){const o=addDays(L,1);msg='<div class="note n-warn">'+short(st.from)+' – '+fmt(L)+' is locked. Only '+short(o)+' – '+fmt(st.to)+' can be rolled back.</div>';btn='<button class="btn" onclick="closeM();toast(\'Rollback started for '+short(o)+' – '+fmt(st.to)+'.\')">Roll back '+short(o)+' – '+short(st.to)+'</button>'}
 else btn='<button class="btn" onclick="closeM();toast(\'Rollback started.\')">Roll back</button>';
 modal('<h3>Roll back by date range</h3><p class="muted">Synder checks each sync\'s webhook date.</p><div class="field"><label class="l">Integration</label><select class="in" onchange="S.bulk.integ=this.value;bulk(S.bulk)">'+Object.values(S.integ).map(i=>'<option value="'+i.id+'" '+(i.id===st.integ?'selected':'')+'>'+i.name+'</option>').join('')+'</select></div><div class="row" style="margin-bottom:16px"><div><div class="muted" style="margin-bottom:6px">From</div><input type="date" value="'+st.from+'" onchange="S.bulk.from=this.value;bulk(S.bulk)"></div><div><div class="muted" style="margin-bottom:6px">To</div><input type="date" value="'+st.to+'" onchange="S.bulk.to=this.value;bulk(S.bulk)"></div></div>'+msg+'<div class="mfoot"><button class="btn o" onclick="closeM()">Cancel</button>'+btn+'</div>')}

/* ---------- supporting: sync info ---------- */
function vSync(q){const t=S.txns.find(x=>x.id===q.get('id'))||S.txns[1],c=S.integ[t.integ],L=lockOf(c);let notice='',logs=[];
 const link=isAdmin()?' <a href="'+lockLink(c.id)+'">Period lock settings</a>':'';
 if(t.reason==='moved'){notice='<div class="note n-plain">'+t.objs.length+(t.objs.length>1?' objects were':' object was')+' posted on '+fmt(t.posted)+' instead of '+fmt(t.date)+' by soft lock.'+link+'</div>';
  logs=t.objs.map(o=>[o,o+' was created on '+fmt(t.posted)+'. Original date '+fmt(t.date)+'.'+(t.fx?'<div class="muted" style="margin-top:6px">FX rate: '+t.fx+'</div>':'')])}
 else if(t.status==='partial'){const b=t.parts.find(p=>!p.ok),o=t.parts.find(p=>p.ok);notice='<div class="note n-warn"><b style="font-weight:500">1 of 2 payments synced.</b> '+b.t+' ('+b.a+') is dated '+fmt(b.d)+', on or before the lock date ('+fmt(L)+'), so it was canceled.'+link+'</div>';logs=[['Payment',o.t+' was created.']]}
 else if(t.reason==='canceled')notice='<div class="note n-warn"><b style="font-weight:500">Canceled by hard lock.</b> The '+t.part+' is dated '+fmt(t.date)+', on or before the lock date ('+fmt(L)+'). Nothing was posted. Move the lock, then resync.'+link+'</div>';
 else if(t.edit){notice='<div class="note n-warn">Order edit received '+fmt(t.edit)+'. Synder didn\'t roll back and resync: the webhook date, '+fmt(t.webhook)+', is on or before the lock date ('+fmt(L)+').</div>';logs=[['Sales receipt','Sales receipt was created.']]}
 else logs=[['Object','Created.']];
 return '<div class="row" style="margin-bottom:16px"><a class="btn o" href="'+P('transactions')+'">← Transactions list</a>'+(t.status==='canceled'?'':'<button class="btn o" onclick="rollback(\''+t.id+'\')">Roll back</button>')+'<button class="btn o" onclick="resync(\''+t.id+'\')">Resync</button></div><h1>Sync info</h1>'
 +'<table class="kv" style="margin:12px 0 8px"><tr><th>Integration</th><td>'+c.name+'</td></tr><tr><th>Status</th><td>'+chip(t)+'</td></tr><tr><th>Amount</th><td>'+t.amount+'</td></tr><tr><th>Transaction date</th><td>'+fmt(t.date)+(t.posted?' · posted '+fmt(t.posted):'')+'</td></tr><tr><th>Webhook date</th><td>'+fmt(t.webhook)+'</td></tr></table>'
 +'<h2>Sync log</h2>'+notice+(logs.length?'<div><table class="sy"><thead><tr><th>Object type</th><th>Message</th></tr></thead><tbody>'+logs.map(l=>'<tr><td>'+l[0]+'</td><td>'+l[1]+'</td></tr>').join('')+'</tbody></table></div>':'<div class="panel empty"><b>No objects were created</b><p>This sync was canceled before anything was posted.</p><a class="btn" href="'+P('transactions')+'">Back to transactions</a></div>')}

/* ---------- render ---------- */
function lockLink(id){return '#a/edit?i='+id}
function render(){const{r,q}=parse();V='a';nav(r);
 $('#app').innerHTML=({lock:vList,edit:vEdit,transactions:vTxns,sync:vSync}[r]||vList)(q)}
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('td')){S.menu=null;render()}});
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
