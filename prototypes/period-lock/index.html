<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Period lock · Synder prototype</title>
<style>
:root{--p:#0053CC;--p10:#E0EBFD;--p5:#F2F6FC;--g5:#F7F8FA;--g10:#EFF1F5;--g20:#DFE4EC;--g30:#B4BBCB;--g50:#6B778C;--t:#1A1B24;
--green:#1F8940;--greenL:#ECFDDC;--red:#CC2929;--redL:#FFECE8;--yel:#CB7515;--yelL:#FFF1DD;--side:#007AFF}
*{box-sizing:border-box}
html,body{margin:0;font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:20px;color:var(--t);background:var(--g5)}
a{color:var(--p);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
button{font:inherit}
.vbar{position:sticky;top:0;z-index:50;height:44px;background:#1A1B24;color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px}

.side a:hover{background:var(--g5);text-decoration:none}

.side .grp{padding:12px 16px 4px;color:var(--g50);font-size:14px}
main{flex:1;padding:24px 32px;max-width:1180px}
h1{font-size:24px;line-height:32px;font-weight:500;margin:0 0 4px}
h2{font-size:18px;line-height:24px;font-weight:500;margin:24px 0 8px}
.sub{color:var(--g50);margin:0 0 20px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:6px 19px;border-radius:4px;border:1px solid var(--p);background:var(--p);color:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#0045AA;text-decoration:none}
.btn.o{background:#fff;color:var(--p)}.btn.o:hover{background:var(--p5)}
.btn.q{background:transparent;border-color:transparent;color:var(--p);padding:6px 8px}
.btn.d{background:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--g20);border-radius:8px}
.pad{padding:20px 24px}
table{width:100%;border-collapse:collapse;background:#fff}
th{text-align:left;font-weight:500;color:var(--g50);padding:10px 12px;border-bottom:1px solid #DDD;font-size:14px;white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--g10);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--g5)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:14px;line-height:20px;white-space:nowrap}
.c-ok{background:var(--greenL);color:var(--green)}.c-warn{background:var(--yelL);color:#8A4E0B}.c-bad{background:var(--redL);color:var(--red)}
.c-lock{background:var(--g10);color:var(--t);border:1px solid var(--g20)}.c-off{background:#fff;color:var(--g50);border:1px solid var(--g20)}
.muted{color:var(--g50)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.field{margin-bottom:18px;max-width:360px}
.field label.l{display:block;color:var(--g50);margin-bottom:6px}
input[type=date],input[type=text],select.in{height:36px;border:1px solid var(--g30);border-radius:4px;padding:0 10px;font-size:14px;background:#fff;color:var(--t);font-family:inherit}
.err{color:var(--red);margin-top:6px}.hint{color:var(--g50);margin-top:6px}.warnt{color:#8A4E0B;margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;max-width:640px}
.opt{border:1px solid var(--g20);border-radius:6px;padding:12px 14px;cursor:pointer;background:#fff}
.opt.on{border-color:var(--p);background:var(--p5)}
.opt b{font-weight:500;display:block}.opt span{color:var(--g50)}
.opt.ro{cursor:default}
.note{border-radius:6px;padding:12px 14px;margin-bottom:16px}
.n-info{background:var(--p5);border:1px solid var(--p10)}
.n-warn{background:var(--yelL);border:1px solid #F3D6AE}
.n-plain{background:var(--g5);border:1px solid var(--g20)}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--g30);border-radius:22px;cursor:pointer;transition:.15s}
.toggle span:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.toggle input:checked+span{background:var(--p)}.toggle input:checked+span:before{transform:translateX(18px)}
.toggle input:disabled+span{cursor:not-allowed;opacity:.6}
.dim{opacity:.5;pointer-events:none}
.savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--g20);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;border-radius:0 0 8px 8px}
.modal-bg{position:fixed;inset:0;background:rgba(26,27,36,.45);z-index:80;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:8px;width:520px;max-width:92vw;padding:24px}
.modal h3{margin:0 0 8px;font-size:18px;font-weight:500}
.modal ul{padding-left:20px;margin:8px 0 16px}.modal li{margin-bottom:6px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1B24;color:#fff;padding:12px 18px;border-radius:6px;z-index:90;max-width:560px}
.menu{position:absolute;right:12px;top:40px;background:#fff;border:1px solid var(--g20);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.1);z-index:20;min-width:200px}
.menu a{display:block;padding:8px 14px;color:var(--t)}.menu a:hover{background:var(--g5);text-decoration:none}
.kv{border-collapse:collapse;width:auto;background:transparent}.kv th{padding:6px 24px 6px 0;color:var(--g50);border:0;font-weight:400}.kv td{padding:6px 0;border:0}
.empty{text-align:center;padding:48px 16px}
.empty b{display:block;font-size:18px;font-weight:500;margin-bottom:6px}
.empty p{color:var(--g50);margin:0 0 16px}
.empty .sec{display:block;margin-top:10px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--g20);margin-bottom:16px}
.tabs a{padding:8px 0;color:var(--g50)}.tabs a.on{color:var(--p);border-bottom:2px solid var(--p);font-weight:500}
.hl{background:var(--yelL);padding:0 4px;border-radius:3px}
details summary{cursor:pointer;color:var(--p)}
ol.as li{margin-bottom:10px}
.lockic{width:14px;height:14px;vertical-align:-2px}
</style>
<style>
.stack{display:flex;flex-direction:column;gap:12px;margin-bottom:8px;max-width:720px}
.mcard{display:flex;gap:12px;border:1px solid var(--g20);border-radius:6px;padding:16px;background:#fff;cursor:pointer}
.mcard.on{border:2px solid var(--p);padding:15px}
.mcard.ro{cursor:default}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--g30);flex-shrink:0;margin-top:1px;position:relative;background:#fff}
.radio.on{border-color:var(--p)}.radio.on:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--p)}
.mcard b{font-weight:500;display:block;margin-bottom:4px}
.rline{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
.sec-h{font-weight:500;margin:24px 0 10px}
.stabs{display:flex;gap:0;border-bottom:1px solid #DDD;margin:16px 0 20px;overflow-x:auto}
.stabs a{padding:10px 16px;color:#555;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.stabs a:hover{text-decoration:none;color:var(--t)}
.stabs a.on{color:var(--p);border-bottom-color:var(--p);font-weight:500}
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.demo{margin:16px;padding-top:12px;border-top:1px solid var(--g20);color:var(--g50)}
.h4{font-size:16px;font-weight:500;margin:0 0 10px}
.srow{margin-bottom:24px}.slabel{font-weight:700;margin-bottom:8px}
.shelp{display:flex;gap:6px;color:var(--g50);margin-top:8px;max-width:720px}
.scard{background:#fff;border:1px solid #DDD;border-radius:4px}
.rail-wrap{display:flex;min-height:420px}
.rail{width:170px;border-right:1px solid #DDD;padding:8px 0;flex-shrink:0}
.rail a{display:flex;align-items:center;height:38px;padding:0 16px;color:var(--t)}
.rail a:hover{background:var(--g5);text-decoration:none}
.rail a.on{color:var(--p);background:var(--p5);border-left:3px solid var(--p);padding-left:13px;font-weight:500}
.rail-body{flex:1;padding:24px 28px}
.pills{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.pill{border:1px solid var(--g30);border-radius:16px;padding:4px 14px;background:#fff}
.pill.on{background:var(--p);color:#fff;border-color:var(--p)}
.pill.add{border-style:dashed;color:var(--p)}
.pills.greyed{opacity:.45;pointer-events:none}
.fsd{position:fixed;inset:44px 0 0 0;background:#fff;z-index:40;display:flex;flex-direction:column}
.fsd-top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #DDD}
.fsd-body{display:flex;flex:1;overflow:auto}
.fsd-menu{width:240px;border-right:1px solid #DDD;padding:12px 0}
.fsd-menu a{display:block;padding:10px 20px;color:var(--t)}.fsd-menu a.on{color:var(--p);background:var(--p5);font-weight:500}
.fsd-main{flex:1;padding:24px 32px;max-width:900px}
.r2{display:grid;grid-template-columns:1fr 280px;gap:24px;padding:16px 0;border-bottom:1px solid var(--g10)}
.mcard b{font-weight:500}
</style>
</head>
<body>
<div class="vbar"><b>Period lock</b><label>Variant <select id="varSel"><option value="a">A · Separate page</option><option value="b">B · Settings tab</option></select></label><span class="sp"></span></div>
<div class="shell"><nav class="side" id="side"></nav><main id="app"></main></div>
<div id="layer"></div>
<script>
const TODAY='2026-10-15';
const S={role:'admin',menu:null,draft:null,status:'all',
 integ:{
  stripe:{id:'stripe',name:'mzkt.by (Stripe)',short:'Stripe',tz:'Europe/Belgrade',on:true,mode:'soft',schedule:'recurring',date:'2026-09-30',moveTo:null,runDay:5,by:'Viacheslav Tarabarov',at:'Oct 6, 2026'},
  shopify:{id:'shopify',name:'andrewshitsko (Shopify)',short:'Shopify',tz:'Europe/Belgrade',on:true,mode:'hard',schedule:'recurring',date:'2026-09-30',moveTo:null,runDay:'last',by:'System (monthly move)',at:'Oct 5, 2026'},
  paypal:{id:'paypal',name:'Synder test (Stripe)',short:'Stripe',tz:'Europe/Belgrade',on:true,mode:'soft',schedule:'fixed',date:'2026-09-30',moveTo:'2026-10-01',runDay:5,by:'Maya Chen',at:'Oct 2, 2026'}},
 txns:[
  {id:'ch_buddy',integ:'stripe',info:'Buddy QA Customer · ch_3Q9k',type:'Invoice payment',amount:'128.00 USD',date:'2026-10-03',webhook:'2026-10-03',status:'synced'},
  {id:'re_3P8',integ:'stripe',info:'Refund · re_3P8mXy9kL2',type:'Refund',amount:'-42.50 USD',date:'2026-09-29',posted:'2026-10-01',webhook:'2026-10-01',status:'warn',reason:'moved',objs:['Refund receipt','Expense']},
  {id:'inv_eur',integ:'stripe',info:'Invoice · in_EU5521 (EUR)',type:'Invoice',amount:'500.00 EUR',date:'2026-09-05',posted:'2026-10-01',webhook:'2026-10-02',status:'warn',reason:'moved',objs:['Invoice'],fx:'1 EUR = 1.0842 USD · rate for Sep 5, 2026 (original date, from QuickBooks)'},
  {id:'order_2120',integ:'shopify',info:'andrewshitsko · Order #2120',type:'Order',amount:'54.00 USD',date:'2026-10-06',webhook:'2026-10-06',status:'synced'},
  {id:'batch_77',integ:'shopify',info:'andrewshitsko · Batch payout · 2 payments',type:'Batch payment',amount:'310.00 USD',date:'2026-08-31',webhook:'2026-09-01',status:'partial',reason:'canceled',parts:[{t:'Payment py_A',d:'2026-09-01',a:'190.00 USD',ok:true},{t:'Payment py_B',d:'2026-08-31',a:'120.00 USD',ok:false}]},
  {id:'order_2108',integ:'shopify',info:'andrewshitsko · Order #2108',type:'Order',amount:'86.40 USD',date:'2026-08-31',webhook:'2026-09-02',status:'canceled',reason:'canceled',part:'fee'},
  {id:'order_1043',integ:'shopify',info:'andrewshitsko · Order #1043 (edited Sep 3)',type:'Order',amount:'72.00 USD',date:'2026-08-28',webhook:'2026-08-28',status:'synced',edit:'2026-09-03'}]};
const $=s=>document.querySelector(s);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(i){if(!i)return'';const[y,m,d]=i.split('-').map(Number);return MON[m-1]+' '+d+', '+y}
const short=i=>fmt(i).slice(0,-6);
function iso(y,m,d){return new Date(Date.UTC(y,m,d)).toISOString().slice(0,10)}
function addDays(s,n){const[y,m,d]=s.split('-').map(Number);return iso(y,m-1,d+n)}
function dim(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
function runDate(y,m,rd){return iso(y,m,rd==='last'?dim(y,m):Math.min(+rd,dim(y,m)))}
function recur(rd){const[y,m]=TODAY.split('-').map(Number);let r=runDate(y,m-1,rd),last,next;if(r<=TODAY){last=r;next=runDate(y,m,rd)}else{last=runDate(y,m-2,rd);next=r}
 const end=s=>{const[a,b]=s.split('-').map(Number);return iso(a,b-1,0)};return{last,next,lock:end(last),nextLock:end(next)}}
const lockOf=c=>!c.on?null:(c.schedule==='recurring'?recur(c.runDay).lock:c.date);
const postOn=c=>(c.schedule==='fixed'&&c.moveTo)||addDays(lockOf(c)||c.date,1);
const isAdmin=()=>S.role==='admin';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
function modal(h){$('#layer').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeM()"><div class="modal">'+h+'</div></div>'}
function closeM(){$('#layer').innerHTML=''}
function parse(){const h=(location.hash||'#a/lock').slice(1);const[path,qs]=h.split('?');const[v,r]=path.split('/');return{v:v==='b'?'b':'a',r:r||(v==='b'?'settings':'lock'),q:new URLSearchParams(qs||'')}}
function go(h){location.hash=h}
let V='a';const P=r=>'#'+V+'/'+r;

/* ---------- nav ---------- */
function nav(r){const L=(h,t,k)=>'<a href="'+P(h)+'" class="'+(k.includes(r)?'on':'')+'">'+t+'</a>';
 let h='<div class="org"><div class="av">PT</div><div>Per transaction test</div></div><a onclick="toast(\'Not part of this demo\')">Dashboard</a><div class="grp">Transactions</div>'+L('transactions','Transactions list',['transactions','sync']);
 if(V==='a')h+=L('lock','Period lock',['lock']);
 h+='<div class="grp">Settings</div>'+L('settings','Settings',['settings']);
 if(V==='b')h+=L('summary-settings','Summary settings (SM org)',['summary-settings']);
 h+='<div class="demo">Demo: viewing as '+(isAdmin()?'Admin':'Member')+'.<br><a onclick="S.role=isAdmin()?\'member\':\'admin\';S.draft=null;S.ptd=null;render()">View as '+(isAdmin()?'Member':'Admin')+'</a></div>';
 $('#side').innerHTML=h}

/* ---------- row primitives (Synder PT settings pattern) ---------- */
const INFO='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
function help(t,lm){return '<div class="shelp">'+INFO+'<span>'+t+(lm?' <a onclick="'+lm+'">Learn more &gt;&gt;</a>':'')+'</span></div>'}
function srow(label,control,h){return '<div class="srow"><div class="slabel">'+label+'</div><div>'+control+'</div>'+(h||'')+'</div>'}
function tog(on,onchange,ro){return '<label class="row" style="gap:8px"><span class="toggle"><input type="checkbox" '+(on?'checked':'')+' '+(ro?'disabled':'')+' onchange="'+onchange+'"><span></span></span><span>'+(on?'On':'Off')+'</span></label>'}
function sel(opts,val,onchange,ro,w){return '<select class="in" style="min-width:'+(w||320)+'px" '+(ro?'disabled':'')+' onchange="'+onchange+'">'+opts.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return '<option value="'+v+'" '+(String(v)===String(val)?'selected':'')+'>'+t+'</option>'}).join('')+'</select>'}

/* ---------- shared period lock content ---------- */
function validate(d){const e={};if(!d.on)return e;
 if(d.schedule==='fixed'){if(!d.date){e.date='Pick a date.';e.block=1}else if(d.date>=TODAY){e.date='Pick a date before today ('+fmt(TODAY)+').';e.block=1}}
 if(d.mode==='soft'&&d.schedule==='fixed'&&d.moveTo&&d.date&&d.moveTo<=d.date){e.move='Pick a date after '+fmt(d.date)+'.';e.block=1}
 return e}
function ensureDraft(id){if(!S.draft||S.draft.id!==id)S.draft=JSON.parse(JSON.stringify(S.integ[id]));return S.draft}
const lockDirty=()=>S.draft&&JSON.stringify(S.draft)!==JSON.stringify(S.integ[S.draft.id]);
function lockRows(id){const c=S.integ[id],d=ensureDraft(id),ro=!isAdmin(),n=d.short,er=validate(d);
 const card=(v,t,s)=>'<div class="mcard '+(d.mode===v?'on':'')+(ro?' ro':'')+'" '+(ro?'':'onclick="setD(\'mode\',\''+v+'\')"')+'><span class="radio '+(d.mode===v?'on':'')+'"></span><div><b>'+t+'</b><span class="muted">'+s+'</span></div></div>';
 const rad=(k,v,t)=>'<div class="rline" '+(ro?'':'onclick="setD(\''+k+'\',\''+v+'\')"')+'><span class="radio '+(d[k]===v?'on':'')+'"></span><div>'+t+'</div></div>';
 const rec=d.schedule==='recurring';
 let h=srow('Period lock',tog(d.on,'setD(\'on\',this.checked)',ro),help('Stops syncs from changing a period you\'ve closed. Last changed '+c.at+' by '+c.by+'.'));
 if(!d.on)return h;
 h+=srow('Lock type',rad('schedule','recurring','Recurring (recommended)')+rad('schedule','fixed','Fixed date'));
 if(rec){const r=recur(d.runDay);let days='';for(let i=1;i<=28;i++)days+='<option value="'+i+'" '+(String(d.runDay)===String(i)?'selected':'')+'>'+i+'</option>';days+='<option value="last" '+(d.runDay==='last'?'selected':'')+'>Last day of month</option>';
  h+=srow('Lock on day','<select class="in" style="min-width:220px" '+(ro?'disabled':'')+' onchange="setD(\'runDay\',this.value)">'+days+'</select><div style="margin-top:10px">Next lock: '+fmt(r.next)+' · locks through '+fmt(r.nextLock)+'</div><div class="muted" style="margin-top:4px">Locked now through '+fmt(r.lock)+'.</div>',help('On this day each month, Synder locks the previous month.'))}
 else h+=srow('Lock transactions dated on or before','<input type="date" value="'+(d.date||'')+'" max="'+addDays(TODAY,-1)+'" '+(ro?'disabled':'')+' onchange="setD(\'date\',this.value)">'+(er.date?'<div class="err">'+er.date+'</div>':''),help('Must be before today. Includes the whole day in '+d.tz+' (integration timezone).'));
 h+=srow('Mode','<div class="stack">'+card('soft','Soft lock — move late transactions to the open period','From now on, any transaction dated on or before the lock date is posted on the first open day instead of its real date. Your closed period stays untouched, but these transactions will show a different date in accounting than in '+n+'.')
  +card('hard','Hard lock — don\'t sync late transactions','From now on, any transaction dated on or before the lock date is canceled and not posted. You\'ll need to resync it manually after you move the lock.')+'</div>',help('Applies to all future syncs for '+n+', scheduled and manual.'));
 if(d.mode==='soft'){if(rec){const r=recur(d.runDay),a=addDays(r.lock,1),b=addDays(r.nextLock,1);
   h+=srow('Post them on','First day after the lock ('+short(a)+', then '+short(b)+'…)',help('Moves automatically with each monthly lock.'))}
  else h+=srow('Post them on','<input type="date" value="'+(d.moveTo||addDays(d.date,1))+'" min="'+addDays(d.date,1)+'" '+(ro?'disabled':'')+' onchange="setD(\'moveTo\',this.value)">'+(er.move?'<div class="err">'+er.move+'</div>':''),help('Late transactions are posted on this date. Must be after the lock date.'))}
 h+=help('Not covered: rollbacks (checked by webhook date), Shopify order edits, and Summary sync.','learn()');
 return h}
function learn(){modal('<h3>What period lock doesn\'t cover</h3><ul><li><b style="font-weight:500">Rollbacks</b> are checked by the webhook date only. A transaction dated in the locked period with a later webhook date can still be rolled back.</li><li><b style="font-weight:500">Shopify order edits</b> roll back and resync when the webhook date is open, even if parts are dated in the locked period.</li><li><b style="font-weight:500">Summary sync</b> isn\'t locked. Summaries change only when their source records change.</li><li>Imports keep running for all dates.</li></ul><div class="mfoot"><button class="btn" onclick="closeM()">Got it</button></div>')}
function setD(k,v){const d=S.draft;if(k==='on'&&v&&!S.integ[d.id].on){d.schedule='recurring'}d[k]=v;if(k==='schedule'&&v==='fixed'){if(!d.date||d.date>=TODAY)d.date=lockOf({...d,on:true,schedule:'recurring'});if(!d.moveTo||d.moveTo<=d.date)d.moveTo=addDays(d.date,1)}if(k==='date'&&(!d.moveTo||d.moveTo<=v))d.moveTo=addDays(v,1);render()}
function trySave(){const d=S.draft,c=S.integ[d.id];const oldT=lockOf(c),newT=d.on?(d.schedule==='recurring'?recur(d.runDay).lock:d.date):null;
 if(!(c.on&&(!d.on||newT<oldT)))return doSave(false,0);
 const aff=S.txns.filter(t=>t.integ===d.id&&t.reason==='canceled'&&(!d.on||t.date>newT)&&t.date<=oldT);const part=aff.filter(t=>t.status==='partial').length;
 modal('<h3>'+(d.on?'Move the lock back to '+fmt(newT)+'?':'Turn off period lock for '+d.name+'?')+'</h3><p>'+(d.on?short(addDays(newT,1))+' – '+fmt(oldT)+' will be open for syncs again.':'All dates will be open for syncs again.')+'</p><ul>'
 +(aff.length?'<li>'+aff.length+' transactions canceled by this lock stay Canceled unless you resync them.</li>':'<li>No transactions were canceled by this lock.</li>')+(part?'<li>'+part+' is partly canceled. Only the canceled part resyncs.</li>':'')+'<li>Transactions moved by a soft lock keep their new dates.</li></ul>'
 +(aff.length?'<label class="row"><input type="checkbox" id="rs" checked> Resync them after saving, on their original dates</label>':'')
 +'<div class="mfoot"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn" onclick="doSave(document.getElementById(\'rs\')?.checked,'+aff.length+')">'+(d.on?'Move lock':'Turn off')+'</button></div>')}
function doSave(rs,n){closeM();const d=S.draft,c=S.integ[d.id];if(d.on&&d.schedule==='recurring'){d.date=recur(d.runDay).lock;d.moveTo=null}
 d.by='Viacheslav Tarabarov';d.at=fmt(TODAY);Object.assign(c,JSON.parse(JSON.stringify(d)));
 if(rs)S.txns.forEach(t=>{if(t.integ===c.id&&t.reason==='canceled'&&(!c.on||t.date>lockOf(c))){t.status='synced';t.reason=null}});
 S.draft=null;render();toast('Settings updated.'+(rs?' Resyncing '+n+' transactions.':''))}
function anyDirty(){return lockDirty()||ptDirty()}
function guardLeave(h){if(anyDirty()){modal('<h3>Save changes?</h3><p>You have unsaved settings changes.</p><div class="mfoot"><button class="btn o" onclick="closeM()">Keep editing</button><button class="btn o" onclick="closeM();S.draft=null;S.ptd=null;go(\''+h+'\')">Discard</button><button class="btn" onclick="closeM();update()">Update</button></div>');return false}S.draft=null;S.ptd=null;go(h);return false}
function integPicker(id,base){return '<h4 class="h4">Select integration</h4><div class="row" style="margin-bottom:24px">'+sel(['stripe','paypal','shopify'].map(k=>[k,S.integ[k].name]),id,'guardLeave(\''+V+'/'+base+'i=\'+this.value);this.value=\''+id+'\'',false,320)+'<a onclick="toast(\'Add integration (mock)\')">+ Add integration</a></div>'}
function updateBtn(dirty,block){if(!isAdmin())return '<p class="muted" style="margin-top:16px">Only admins can change these settings.</p>';return '<div style="margin-top:16px"><button class="btn" '+(dirty&&!block?'':'disabled')+' onclick="update()">Update</button></div>'}
function update(){if(ptDirty()){Object.assign(S.pt[S.ptd.id],S.ptd);S.ptd=null;if(!lockDirty()){render();return toast('Settings updated.')}}if(lockDirty())trySave()}

/* ---------- PT settings sets (non-lock tabs) ---------- */
S.pt={};Object.keys(S.integ).forEach(k=>S.pt[k]={id:k,autoImport:true,autoSync:true,skipDup:true,tz:'Europe/Belgrade',clearing:'Stripe Clearing',payMethod:'Stripe',posting:'Transaction date'});
const ptDirty=()=>S.ptd&&JSON.stringify(S.ptd)!==JSON.stringify(S.pt[S.ptd.id]);
function ptD(id){if(!S.ptd||S.ptd.id!==id)S.ptd=JSON.parse(JSON.stringify(S.pt[id]));return S.ptd}
function setP(k,v){S.ptd[k]=v;render()}
function ptTab(id,tab){const d=ptD(id),ro=!isAdmin();
 if(tab==='general')return srow('Auto-import',tog(d.autoImport,'setP(\'autoImport\',this.checked)',ro),help('Synder imports new transactions from your integration as they arrive. To bring in past transactions, use Import historical data.','toast(\'Help center (mock)\')'))
  +srow('Auto-sync',tog(d.autoSync,'setP(\'autoSync\',this.checked)',ro),help('Synder syncs new transactions to your books automatically. Requires Auto-import.'))
  +srow('Skip synchronization of duplicated transactions',tog(d.skipDup,'setP(\'skipDup\',this.checked)',ro),help('Synder skips transactions that already exist in your books.'))
  +srow('Timezone',sel(['Europe/Belgrade','Europe/Vilnius','America/New_York','UTC'],d.tz,'setP(\'tz\',this.value)',ro),help('Synder uses this timezone to set transaction dates.'));
 if(tab==='sales')return srow('Clearing account',sel(['Stripe Clearing','Undeposited Funds','Checking'],d.clearing,'setP(\'clearing\',this.value)',ro),help('Select the account that represents Stripe in your books. Synced transactions are deposited here before payout.','toast(\'Help center (mock)\')'))
  +srow('Payment method',sel(['Stripe','Credit card','Cash'],d.payMethod,'setP(\'payMethod\',this.value)',ro),help('Payment method Synder sets on sales transactions.'))
  +srow('Posting date',sel(['Transaction date','Payout date'],d.posting,'setP(\'posting\',this.value)',ro),help('Which date Synder uses for sales transactions in your books.'));
 return '<p class="muted" style="margin:0">Not part of this demo.</p>'}

/* ---------- variant A: separate page ---------- */
function vLockPage(q){const id=q.get('i')||'stripe';ensureDraft(id);
 return integPicker(id,'lock?')+'<div class="scard pad">'+lockRows(id)+'</div>'+updateBtn(lockDirty(),validate(S.draft).block)}
function vSettingsA(q){return vPT(q,false)}

/* ---------- PT settings page (both variants) ---------- */
const RAIL=[['general','General'],['sales','Sales'],['invoices','Invoices'],['products','Products/Services'],['pmap','Product mapping'],['taxes','Taxes'],['fees','Fees'],['payouts','Payouts'],['multi','Multicurrency']];
function vPT(q,withLock){const id=q.get('i')||'stripe';let tab=q.get('tab')||(withLock?'lock':'general');if(tab==='lock'&&!withLock)tab='general';
 const rail=RAIL.concat(withLock?[['lock','Period lock']]:[]);const isLock=tab==='lock';
 if(isLock)ensureDraft(id);else ptD(id);
 const dirty=isLock?lockDirty():ptDirty(),block=isLock&&validate(S.draft).block;
 const base='settings?tab='+tab+'&';
 return '<button class="btn o" style="margin-bottom:24px" onclick="toast(\'Organization settings (mock)\')">Go to Organization settings</button>'
 +integPicker(id,base)
 +'<h4 class="h4">Select synchronization mode</h4><div class="row" style="margin-bottom:24px;gap:24px"><label class="row" style="gap:8px"><span class="radio on"></span>Per transaction</label><label class="row muted" style="gap:8px"><span class="radio" style="opacity:.5"></span>Summary</label><a onclick="toast(\'How to change mode (mock)\')">How to change mode</a></div>'
 +'<div class="pills'+(isLock?' greyed':'')+'"><span class="pill on">Default</span><span class="pill">Refund</span><a class="pill add">+ Create additional settings</a></div>'
 +'<div class="scard rail-wrap"><div class="rail">'+rail.map(([k,t])=>'<a class="'+(k===tab?'on':'')+'" onclick="'+(k===tab?'':'guardLeave(\''+V+'/settings?i='+id+'&tab='+k+'\')')+'">'+t+'</a>').join('')+'</div><div class="rail-body">'
 +(isLock?'<div class="note n-plain" style="margin-bottom:24px">Applies to all settings sets of this integration.</div>'+lockRows(id):ptTab(id,tab))+'</div></div>'+updateBtn(dirty,block)}
function vSettingsB(q){return vPT(q,true)}

/* ---------- Summary settings dialog (variant B) ---------- */
function vSummarySettings(q){const tab=q.get('tab')||'general';const r2=(l,hp,c)=>'<div class="r2"><div><div class="slabel">'+l+'</div><div class="muted">'+hp+'</div></div><div>'+c+'</div></div>';
 const content=tab==='general'?r2('Auto-generate summaries','Synder creates a summary for each day automatically.',tog(true,'toast(\'Mock\')'))+r2('Summary period','How transactions are grouped into one summary.',sel(['Daily','Per payout'],'Daily','',false,220))+r2('Timezone','Used to split transactions into days.',sel(['Europe/Belgrade','UTC'],'Europe/Belgrade','',false,220))
  +r2('Period lock','Per transaction sync only.','<span>Doesn\'t apply to Summary sync.</span> <a onclick="learn()">Learn more</a>'):'<p class="muted">Not part of this demo.</p>';
 const m=[['general','General'],['mapping','Mapping'],['products','Products and services']];
 return '<div class="fsd"><div class="fsd-top"><a class="btn q" href="#b/settings">✕</a><b style="font-weight:500;font-size:18px">Settings (Summary_test)</b></div><div class="fsd-body"><div class="fsd-menu">'+m.map(([k,t])=>'<a class="'+(k===tab?'on':'')+'" href="#b/summary-settings?tab='+k+'">'+t+'</a>').join('')+'<a onclick="toast(\'Organization settings (mock)\')">Go to Organization settings</a></div><div class="fsd-main">'+content+'</div></div></div>'}

/* ---------- supporting: transactions ---------- */
function lockLink(id){return V==='a'?'#a/lock?i='+id:'#b/settings?i='+id+'&tab=lock'}
function chip(t){return{synced:'<span class="chip c-ok">Synced</span>',warn:'<span class="chip c-warn">Synced with warnings</span>',canceled:'<span class="chip c-bad">Canceled</span>',partial:'<span class="chip c-bad">Partly canceled</span>'}[t.status]}
function reason(t){return t.reason==='moved'?'Date moved by period lock':t.reason==='canceled'?'Canceled by period lock':''}
function vTxns(){const rows=S.txns.filter(t=>S.status==='all'||t.status===S.status||(S.status==='canceled'&&t.status==='partial'));
 const body=rows.map(t=>'<tr><td><a href="'+P('sync?id='+t.id)+'">'+t.info+'</a><div class="muted">'+S.integ[t.integ].name+'</div></td><td>'+t.amount+'</td><td>'+fmt(t.posted||t.date)+(t.posted?'<div class="muted">was '+short(t.date)+'</div>':'')+'</td><td>'+chip(t)+(t.reason?'<div class="muted" style="margin-top:4px">'+reason(t)+'</div>':'')+'</td><td style="position:relative"><button class="btn o" style="padding:6px 10px" onclick="S.menu=S.menu===\''+t.id+'\'?null:\''+t.id+'\';render()">⋯</button>'+(S.menu===t.id?'<div class="menu"><a href="'+P('sync?id='+t.id)+'">Show sync info</a><a onclick="rollback(\''+t.id+'\')">Roll back</a><a onclick="resync(\''+t.id+'\')">Resync</a></div>':'')+'</td></tr>').join('');
 return '<div class="between"><div><h1>Transactions list</h1><p class="sub">Transactions imported from your integrations and their sync status.</p></div><button class="btn o" onclick="bulk()">Roll back by date range</button></div>'
 +'<div style="margin-bottom:12px"><select class="in" onchange="S.status=this.value;render()">'+[['all','All statuses'],['synced','Synced'],['warn','Synced with warnings'],['canceled','Canceled']].map(([v,t])=>'<option value="'+v+'" '+(S.status===v?'selected':'')+'>'+t+'</option>').join('')+'</select></div>'
 +'<div class="card" style="overflow:visible">'+(rows.length?'<table><thead><tr><th>Transaction</th><th>Amount</th><th>Transaction date</th><th>Sync status</th><th></th></tr></thead><tbody>'+body+'</tbody></table>':'<div class="empty"><b>No transactions match</b><p>Try a different status.</p><button class="btn" onclick="S.status=\'all\';render()">Clear filter</button></div>')+'</div>'}
function rollback(id){S.menu=null;const t=S.txns.find(x=>x.id===id),c=S.integ[t.integ],L=lockOf(c);render();
 if(t.status==='canceled')return toast('Nothing to roll back. No objects were created for this sync.');
 if(L&&t.webhook<=L)return modal('<h3>Can\'t roll back this transaction</h3><p>Its webhook date, '+fmt(t.webhook)+', is on or before the lock date ('+c.short+', '+fmt(L)+').</p><p class="muted">To roll it back, move the lock to before '+fmt(t.webhook)+'.</p><div class="mfoot"><button class="btn o" onclick="closeM()">Close</button>'+(isAdmin()?'<a class="btn" onclick="closeM()" href="'+lockLink(c.id)+'">Period lock settings</a>':'')+'</div>');
 toast('Rollback started. Webhook date '+fmt(t.webhook)+' is open.')}
function resync(id){S.menu=null;const t=S.txns.find(x=>x.id===id),c=S.integ[t.integ],L=lockOf(c);render();
 if(t.reason==='canceled'&&L&&c.mode==='hard'){const pd=t.parts?t.parts.find(p=>!p.ok).d:t.date;if(pd<=L)return toast('Still locked: dated '+fmt(pd)+', lock date '+fmt(L)+'. Move the lock first.')}
 if(t.status==='partial')return toast('Resyncing only the canceled part. The synced part isn\'t duplicated.');
 if(c.on&&c.mode==='soft'&&t.date<=L)return toast('Resync started. It posts on '+fmt(postOn(c))+' again.');toast('Resync started.')}
function bulk(st){st=st||{integ:'shopify',from:'2026-08-15',to:'2026-09-05'};S.bulk=st;const c=S.integ[st.integ],L=lockOf(c);let msg='',btn='';
 if(st.from>st.to)msg='<div class="err">From must be before To.</div>';
 else if(L&&st.to<=L)msg='<div class="note n-warn">The whole range is on or before the lock date ('+fmt(L)+'). Nothing can be rolled back.</div>';
 else if(L&&st.from<=L){const o=addDays(L,1);msg='<div class="note n-warn">'+short(st.from)+' – '+fmt(L)+' is locked. Only '+short(o)+' – '+fmt(st.to)+' can be rolled back.</div>';btn='<button class="btn" onclick="closeM();toast(\'Rollback started for '+short(o)+' – '+fmt(st.to)+'.\')">Roll back '+short(o)+' – '+short(st.to)+'</button>'}
 else btn='<button class="btn" onclick="closeM();toast(\'Rollback started.\')">Roll back</button>';
 modal('<h3>Roll back by date range</h3><p class="muted">Synder checks each sync\'s webhook date.</p><div class="field"><label class="l">Integration</label><select class="in" onchange="S.bulk.integ=this.value;bulk(S.bulk)">'+Object.values(S.integ).map(i=>'<option value="'+i.id+'" '+(i.id===st.integ?'selected':'')+'>'+i.name+'</option>').join('')+'</select></div><div class="row" style="margin-bottom:16px"><div><div class="muted" style="margin-bottom:6px">From</div><input type="date" value="'+st.from+'" onchange="S.bulk.from=this.value;bulk(S.bulk)"></div><div><div class="muted" style="margin-bottom:6px">To</div><input type="date" value="'+st.to+'" onchange="S.bulk.to=this.value;bulk(S.bulk)"></div></div>'+msg+'<div class="mfoot"><button class="btn o" onclick="closeM()">Cancel</button>'+btn+'</div>')}

/* ---------- supporting: sync info ---------- */
function vSync(q){const t=S.txns.find(x=>x.id===q.get('id'))||S.txns[1],c=S.integ[t.integ],L=lockOf(c);let notice='',logs=[];
 const link=isAdmin()?' <a href="'+lockLink(c.id)+'">Period lock settings</a>':'';
 if(t.reason==='moved'){notice='<div class="note n-plain">'+t.objs.length+(t.objs.length>1?' objects were':' object was')+' posted on '+fmt(t.posted)+' instead of '+fmt(t.date)+' by soft lock.'+link+'</div>';
  logs=t.objs.map(o=>[o,o+' was created on '+fmt(t.posted)+'. Original date '+fmt(t.date)+'.'+(t.fx?'<div class="muted" style="margin-top:6px">FX rate: '+t.fx+'</div>':'')])}
 else if(t.status==='partial'){const b=t.parts.find(p=>!p.ok),o=t.parts.find(p=>p.ok);notice='<div class="note n-warn"><b style="font-weight:500">1 of 2 payments synced.</b> '+b.t+' ('+b.a+') is dated '+fmt(b.d)+', on or before the lock date ('+fmt(L)+'), so it was canceled.'+link+'</div>';logs=[['Payment',o.t+' was created.']]}
 else if(t.reason==='canceled')notice='<div class="note n-warn"><b style="font-weight:500">Canceled by hard lock.</b> The '+t.part+' is dated '+fmt(t.date)+', on or before the lock date ('+fmt(L)+'). Nothing was posted. Move the lock, then resync.'+link+'</div>';
 else if(t.edit){notice='<div class="note n-warn">Order edit received '+fmt(t.edit)+'. Synder didn\'t roll back and resync: the webhook date, '+fmt(t.webhook)+', is on or before the lock date ('+fmt(L)+').</div>';logs=[['Sales receipt','Sales receipt was created.']]}
 else logs=[['Object','Created.']];
 return '<div class="row" style="margin-bottom:16px"><a class="btn o" href="'+P('transactions')+'">← Transactions list</a>'+(t.status==='canceled'?'':'<button class="btn o" onclick="rollback(\''+t.id+'\')">Roll back</button>')+'<button class="btn o" onclick="resync(\''+t.id+'\')">Resync</button></div><h1>Sync info</h1>'
 +'<table class="kv" style="margin:12px 0 8px"><tr><th>Integration</th><td>'+c.name+'</td></tr><tr><th>Status</th><td>'+chip(t)+'</td></tr><tr><th>Amount</th><td>'+t.amount+'</td></tr><tr><th>Transaction date</th><td>'+fmt(t.date)+(t.posted?' · posted '+fmt(t.posted):'')+'</td></tr><tr><th>Webhook date</th><td>'+fmt(t.webhook)+'</td></tr></table>'
 +'<h2>Sync log</h2>'+notice+(logs.length?'<div class="card" style="overflow:hidden"><table><thead><tr><th>Object type</th><th>Message</th></tr></thead><tbody>'+logs.map(l=>'<tr><td>'+l[0]+'</td><td>'+l[1]+'</td></tr>').join('')+'</tbody></table></div>':'<div class="card empty"><b>No objects were created</b><p>This sync was canceled before anything was posted.</p><a class="btn" href="'+P('transactions')+'">Back to transactions</a></div>')}

/* ---------- render ---------- */
function render(){const{v,r,q}=parse();V=v;$('#varSel').value=v;nav(r);
 const map=v==='a'?{lock:vLockPage,settings:vSettingsA,transactions:vTxns,sync:vSync}:{settings:vSettingsB,'summary-settings':vSummarySettings,transactions:vTxns,sync:vSync};
 $('#app').innerHTML=(map[r]||map[v==='a'?'lock':'settings'])(q)}
$('#varSel').onchange=e=>{S.draft=null;S.ptd=null;go(e.target.value==='a'?'a/lock':'b/settings?i=stripe&tab=lock')};
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('td')){S.menu=null;render()}});
window.addEventListener('hashchange',render);render();
</script>
</body>
