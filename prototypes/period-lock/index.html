 <li>Recon "Lock period" prefills the recon end date and never moves an existing lock earlier. FDD edge case 2 says recon shows no callout for re-dated rows; the "After soft period lock" subtext needs approval.</li>
 <li>Permissions are an open FDD question. Demo: admins edit, members read only.</li>
 <li>"Today (demo)" in the top bar changes the date so you can see the monthly lock move forward.</li></ul></div>`))+`</div>`}

/* ---------- render ---------- */
let VAR=(v=>['a','b','c'].includes(v)?v:'c')(new URLSearchParams(location.search).get('v'));
function syncVar(){document.querySelectorAll('.vv').forEach(b=>{const on=b.dataset.v===VAR;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)})}
function setVar(v){if(v!==VAR&&leaveC(()=>setVar(v)))return;VAR=v;history.replaceState(null,'',location.pathname+'?v='+v+location.hash);render()}
let lastR=null;
function render(){const{r,q}=parse();
 if(r==='revrec'){location.replace('#subs');return}
 if(['transactions','sync','recon','subs','sub','reports','balances','rrconfig'].includes(r)&&S.org!=='pt')S.org='pt';
 if(['summaries','summary','products','product'].includes(r)&&S.org!=='sm')S.org='sm';
 if(['lock','edit'].includes(r)&&!['lock','edit'].includes(lastR)&&lastR!==null&&!S._noVisit)track('PeriodLockVisited',{});
 S._noVisit=0;lastR=r;nav(r);syncVar();
 const V={dashboard:vDash,lock:vList,edit:vEdit,transactions:vTxns,sync:vSync,imports:vImports,recon:vRecon,subs:vSubs,sub:vSub,reports:vReports,balances:vBalances,rrconfig:vRRConfig,summaries:vSums,summary:vSum,products:vProducts,product:vProduct,activity:vActivity,dev:vDev};
 const out=(V[r]||vList)(q),fs=$('#fs'),sh=$('#shell');
 if(out&&out.dlg){const sc=fs.querySelector('.dbody')?.scrollTop||0;
  fs.innerHTML=`<div class="dbar"><button class="btn-icon dx" aria-label="Close" onclick="go('${out.back}')"><span class="mi">close</span></button><span class="dv"></span><span class="dt">${out.title}</span><span class="sp"></span><div class="dbar-r">${out.actions}</div></div><div class="dbody"><div class="dwrap">${out.body}</div></div>`;
  fs.querySelector('.dbody').scrollTop=sc;fs.hidden=false;sh.hidden=true;sh.style.display='none';$('#app').innerHTML=''}
 else{fs.hidden=true;fs.innerHTML='';sh.hidden=false;sh.style.display='';$('#app').innerHTML=out}}
function setToday(v){if(!v)return;TODAY=v;S.draft=null;render();toast('Demo date set to '+fmt(v)+'.','info')}
function resetDemo(){Object.assign(S,JSON.parse(INIT));TODAY='2026-10-15';$('#today').value=TODAY;closeM();go('#lock');render()}
document.addEventListener('click',e=>{if(!e.target.closest('.vmw'))$('#vmenu').classList.remove('show');if(!e.target.closest('.acw'))$('#acm').classList.remove('show');if((S.menu||S.orgOpen)&&!e.target.closest('.dropdown-menu')&&!e.target.closest('.sb-org')){S.menu=null;S.orgOpen=false;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#layer').innerHTML&&!$('#fs').hidden){const b=$('#fs .dx');if(b)b.click()}});
let prevHash=location.hash;
window.addEventListener('hashchange',()=>{const p=prevHash;prevHash=location.hash;S.menu=null;if(p.startsWith('#edit')&&S.draft&&dirty()){const want=location.hash;history.replaceState(null,'',p);prevHash=p;if(!guard(want))return;go(want);return}if(!location.hash.startsWith('#edit'))S.draft=null;render()});
render();
</script>
